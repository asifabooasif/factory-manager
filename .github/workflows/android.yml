name: Build Android app
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check settings
        run: |
          test -n "$APP_URL" || (echo "Add repository variable APP_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1)
          test -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" || echo "WARNING: no GOOGLE_SERVICES_JSON_B64 secret. Google sign-in and push will not work."
      - run: npm install
      - run: npx cap add android
      - name: Firebase config
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json; fi
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: slipper-erp-apk
          path: android/app/build/outputs/apk/**/*.apk
