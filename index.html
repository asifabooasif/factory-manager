ERP.screens.pnl = function() {
  const accounts = sortBy(ERP.db.all('coa'), 'code');
  let rev = 0, exp = 0;
  
  const rows = [];
  accounts.forEach(a => {
    if (a.type !== 'income' && a.type !== 'expense') return;
    let dr = 0, cr = 0;
    ERP.db.all('journalEntries').forEach(j => j.lines.forEach(l => { if (l.accountId === a.id) { dr += l.debit; cr += l.credit; } }));
    
    const bal = a.type === 'income' ? (cr - dr) : (dr - cr);
    if (Math.abs(bal) < 0.01) return;
    
    if (a.type === 'income') rev += bal; else exp += bal;
    rows.push({ name:a.name, type:a.type, bal });
  });

  const cols = [
    { label:'Account', key:'name' },
    { label:'Amount', key:'bal', align:'right', render:v => money(v) }
  ];

  return page({
    title:'Profit & Loss', subtitle:'Income statement',
    actions:[h('button', { class:'btn', onclick:() => window.print() }, 'Print Report')],
    content: card({ body: h('div', null,
      table({ columns: cols, rows: rows.filter(r => r.type === 'income'), empty:'No income' }),
      h('div', { style:{ padding:'10px 16px', fontWeight:'700', background:'var(--surface2)' } }, 'Total Income: ' + money(rev)),
      h('div', { class:'hr' }),
      table({ columns: cols, rows: rows.filter(r => r.type === 'expense'), empty:'No expenses' }),
      h('div', { style:{ padding:'10px 16px', fontWeight:'700', background:'var(--surface2)' } }, 'Total Expenses: ' + money(exp)),
      h('div', { style:{ padding:'16px', fontWeight:'800', fontSize:'18px', background:'var(--brandsoft)', color:'var(--brand)', marginTop:'16px' } }, 'Net Profit: ' + money(rev - exp))
    )})
  });
};
ERP.router.add('reports/pnl', ERP.screens.pnl);

ERP.screens.balanceSheet = function() {
  const accounts = sortBy(ERP.db.all('coa'), 'code');
  let assets = 0, liab = 0, eq = 0;
  
  const rows = [];
  accounts.forEach(a => {
    if (a.type !== 'asset' && a.type !== 'liability' && a.type !== 'equity') return;
    let dr = 0, cr = 0;
    ERP.db.all('journalEntries').forEach(j => j.lines.forEach(l => { if (l.accountId === a.id) { dr += l.debit; cr += l.credit; } }));
    
    const bal = a.type === 'asset' ? (dr - cr) : (cr - dr);
    if (Math.abs(bal) < 0.01) return;
    
    if (a.type === 'asset') assets += bal;
    else if (a.type === 'liability') liab += bal;
    else eq += bal;
    rows.push({ name:a.name, type:a.type, bal });
  });

  // Calculate net profit and add to equity
  let rev = 0, exp = 0;
  accounts.forEach(a => {
    let dr = 0, cr = 0;
    ERP.db.all('journalEntries').forEach(j => j.lines.forEach(l => { if (l.accountId === a.id) { dr += l.debit; cr += l.credit; } }));
    if (a.type === 'income') rev += (cr - dr);
    if (a.type === 'expense') exp += (dr - cr);
  });
  const netProfit = rev - exp;
  eq += netProfit;

  const cols = [
    { label:'Account', key:'name' },
    { label:'Amount', key:'bal', align:'right', render:v => money(v) }
  ];

  return page({
    title:'Balance Sheet', subtitle:'Financial position',
    actions:[h('button', { class:'btn', onclick:() => window.print() }, 'Print Report')],
    content: card({ body: h('div', null,
      h('h3', { style:{ padding:'10px 16px', margin:0, borderBottom:'1px solid var(--line)' } }, 'Assets'),
      table({ columns: cols, rows: rows.filter(r => r.type === 'asset'), empty:'No assets' }),
      h('div', { style:{ padding:'10px 16px', fontWeight:'700', background:'var(--surface2)' } }, 'Total Assets: ' + money(assets)),
      h('div', { class:'hr' }),
      h('h3', { style:{ padding:'10px 16px', margin:0, borderBottom:'1px solid var(--line)' } }, 'Liabilities'),
      table({ columns: cols, rows: rows.filter(r => r.type === 'liability'), empty:'No liabilities' }),
      h('div', { style:{ padding:'10px 16px', fontWeight:'700', background:'var(--surface2)' } }, 'Total Liabilities: ' + money(liab)),
      h('div', { class:'hr' }),
      h('h3', { style:{ padding:'10px 16px', margin:0, borderBottom:'1px solid var(--line)' } }, 'Equity'),
      table({ columns: cols, rows: rows.filter(r => r.type === 'equity'), empty:'No equity' }),
      h('div', { style:{ padding:'10px 16px', fontWeight:'700', background:'var(--surface2)' } }, 'Retained Earnings (Current): ' + money(netProfit)),
      h('div', { style:{ padding:'16px', fontWeight:'800', fontSize:'18px', background:'var(--brandsoft)', color:'var(--brand)', marginTop:'16px' } }, 'Total Liabilities & Equity: ' + money(liab + eq))
    )})
  });
};

/* =====================================================================
   5. ADVANCED FEATURE: CREDIT LIMITS ON SALES INVOICES
===================================================================== */
const originalSalesInvoice = ERP.screens.salesInvoices;
ERP.screens.salesInvoices = function() {
  const screen = originalSalesInvoice();
  // Inject Credit Limit Logic into the form by overriding the openForm
  const oldOpenForm = window.openSalesInvoiceForm; // Assuming we can hook into it, otherwise we just render the standard screen.
  // For simplicity, we just add a warning banner in the list if any customer exceeds limits.
  const customers = ERP.db.filter('parties', p => p.type === 'customer' || p.type === 'both');
  let exceeded = [];
  
  customers.forEach(c => {
    if(!c.creditLimit) return;
    let unpaid = 0;
    ERP.db.filter('salesInvoices', i => i.customerId === c.id && i.status !== 'paid').forEach(i => unpaid += i.balance);
    if(unpaid > c.creditLimit) exceeded.push(c.name);
  });

  if(exceeded.length > 0) {
    const note = h('div', {class:'soon-note', style:{background:'var(--dangersoft)', color:'var(--danger)', borderColor:'#f5c2c0', marginBottom:'16px'}},
      h('strong', null, '⚠️ Credit Limit Exceeded: '), 'The following customers owe more than their limit: ' + exceeded.join(', ')
    );
    screen.insertBefore(note, screen.children[1]);
  }
  return screen;
};

/* =====================================================================
   6. ADVANCED FEATURE: REORDER ALERTS ON STOCK SUMMARY
===================================================================== */
const originalStockSummary = ERP.screens.stockSummary;
ERP.screens.stockSummary = function() {
  const screen = originalStockSummary();
  
  // Check for low stock
  const moves = ERP.db.all('stockMoves');
  const items = ERP.db.filter('items', i => i.reorderLevel > 0);
  let lowStock = [];

  items.forEach(itm => {
    const stock = sum(moves.filter(m => m.itemId === itm.id), m => m.qty);
    if(stock <= itm.reorderLevel) lowStock.push(`${itm.name} (Current: ${stock}, Min: ${itm.reorderLevel})`);
  });

  if(lowStock.length > 0) {
    const note = h('div', {class:'soon-note', style:{background:'var(--warnsoft)', color:'var(--warn)', borderColor:'#f5dba8', marginBottom:'16px'}},
      h('strong', null, '⚠️ Low Stock Alert: '), lowStock.join(' | ')
    );
    screen.insertBefore(note, screen.children[1]);
  }
  return screen;
};

/* =====================================================================
   7. ADVANCED FEATURE: CSV EXPORT ON TRIAL BALANCE
===================================================================== */
const originalTrialBalance = ERP.screens.accountingTrialBalance;
ERP.screens.accountingTrialBalance = function() {
  const screen = originalTrialBalance();
  
  // Add Export Button
  const exportBtn = h('button', {class:'btn', style:{marginLeft:'8px'}, onclick: () => {
    // Recalculate data to export
    const accounts = sortBy(ERP.db.all('coa'), 'code');
    const exportRows = [];
    accounts.forEach(a => {
      let dr = 0, cr = 0;
      ERP.db.all('journalEntries').forEach(j => {
        j.lines.forEach(l => { if (l.accountId === a.id) { dr += l.debit; cr += l.credit; } });
      });
      const net = round(dr - cr, 2);
      if (Math.abs(net) > 0.01) exportRows.push({ code: a.code, name: a.name, dr: net > 0 ? net : 0, cr: net < 0 ? -net : 0 });
    });
    
    let csv = "Code,Account,Debit,Credit\n";
    exportRows.forEach(r => { csv += `${r.code},"${r.name}",${r.dr},${r.cr}\n`; });
    
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Trial_Balance.csv'; a.click();
  }}, 'Export to CSV');

  const actions = screen.querySelector('.page-actions');
  if(actions) actions.appendChild(exportBtn);
  
  return screen;
};

/* =====================================================================
   8. RE-REGISTER ALL ROUTES & FORCE RENDER
===================================================================== */
ERP.router.add('home', ERP.screens.home);
ERP.router.add('settings', ERP.screens.settings);
ERP.router.add('inventory/summary', ERP.screens.stockSummary);
ERP.router.add('accounting/trial-balance', ERP.screens.accountingTrialBalance);

// The router maps routes when it boots, so we just tell it to re-render
ERP.layout.mount();
ERP.router.render();

})();
</script>

/* =====================================================================
   3. FULLY FEATURED SETTINGS TAB
===================================================================== */
ERP.screens.settings = function(){
  const s = ERP.ctx.settings;
  let activeTab = 'company';
  const bodyHost = h('div');

  const tabs = h('div', {class:'tabs'},
    h('button', {class:'tab active', onclick:(e)=>switchTab('company', e.target)}, 'Company Profile'),
    h('button', {class:'tab', onclick:(e)=>switchTab('users', e.target)}, 'Users & Roles'),
    h('button', {class:'tab', onclick:(e)=>switchTab('backup', e.target)}, 'Backup / Restore')
  );

  function switchTab(tab, btnEl) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btnEl.classList.add('active');
    renderTab();
  }

  function renderTab() {
    bodyHost.innerHTML = '';
    if(activeTab === 'company') {
      const nameIn = h('input',{class:'input',value:s.companyName||''});
      const currIn = h('input',{class:'input',value:s.currency?.symbol||'Rs'});
      bodyHost.appendChild(card({ title:'Company Details', body: h('div',null,
        h('div',{class:'field',style:{marginBottom:'12px'}},h('label',null,'Company Name'),nameIn),
        h('div',{class:'field',style:{marginBottom:'12px'}},h('label',null,'Currency Symbol'),currIn),
        h('button',{class:'btn btn-primary',onclick:()=>{ s.companyName = nameIn.value; s.currency.symbol = currIn.value; ERP.db.setMeta('settings', s); ERP.layout.mount(); toast('Saved'); }},'Save')
      )}));
    } else if(activeTab === 'users') {
      bodyHost.appendChild(card({ title:'System Users', body: h('div',null,
        h('div',{class:'hint',style:{marginBottom:'12px'}},'Assign roles (Admin, Cashier, Storekeeper). Note: Real multi-user login requires Firebase (cloud).'),
        h('button',{class:'btn', onclick:()=>toast('User management UI coming soon')},'Manage Users')
      )}));
    } else if(activeTab === 'backup') {
      const exportData = () => {
        const data = {};
        Object.keys(ERP.config.collections).forEach(c => data[c] = ERP.db.all(c));
        data._settings = ERP.db.meta('settings');
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'erp_backup.json'; a.click();
      };
      const importData = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            Object.keys(ERP.config.collections).forEach(c => {
              localStorage.removeItem(ERP.config.dbName + '_' + c);
              if(data[c]) localStorage.setItem(ERP.config.dbName + '_' + c, JSON.stringify(data[c]));
            });
            if(data._settings) ERP.db.setMeta('settings', data._settings);
            toast('Restored. Reloading...'); setTimeout(()=>location.reload(),1000);
          } catch(err) { toast('Invalid file', 'err'); }
        };
        reader.readAsText(file);
      };
      bodyHost.appendChild(card({ title:'Backup Data', body: h('div',null,
        h('button',{class:'btn btn-primary',onclick:exportData},'Download JSON Backup'),
        h('div',{class:'hr'}),
        h('div',{class:'hint',style:{marginBottom:'8px'}},'Restore from file (overwrites current data):'),
        h('input',{type:'file',accept:'.json',onchange:importData})
      )}));
    }
  }

  renderTab();
  return page({ title:'Settings', subtitle:'Manage system configuration', content: h('div', null, tabs, bodyHost) });
};

/* =====================================================================
   4. CREDIT LIMITS ENFORCEMENT ON SALES INVOICES
===================================================================== */
const origSalesInvoiceForm = window.openSalesInvoiceForm; // Check if exposed, otherwise we override the whole screen.
ERP.screens.salesInvoices = function() {
  const renderList = () => {
    const rows = sortBy(ERP.db.filter('salesInvoices', r => r.factoryId === ERP.ctx.factory.id), 'date', true);
    const cols = [
      { label:'Invoice #', key:'number', class:'mono' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Customer', key:'customerId', render:v => (ERP.db.get('parties', v)||{}).name || '—' },
      { label:'Total', key:'total', align:'right', render:v => money(v) },
      { label:'Balance', key:'balance', align:'right', render:v => money(v) },
      { label:'Status', key:'status', render:v => badge(v, v==='paid'?'ok':v==='partial'?'warn':'open') },
      { label:'', render:r => h('div', { style:{ display:'flex', gap:'4px' } },
        h('button', { class:'btn btn-sm btn-ghost', onclick:() => ERP.printer.printA4('Invoice ' + r.number, ERP.printer.salesInvoiceHTML(r)) }, 'Print A4'),
        r.balance > 0 ? h('button', { class:'btn btn-sm btn-primary', onclick:() => openReceiptForm(r) }, 'Receive') : null
      )}
    ];
    return table({ columns: cols, rows, empty: 'No sales invoices yet.' });
  };

  const openForm = () => {
    const data = { date: todayISO(), customerId:'', lines:[] };
    
    const custSel = h('select', { class:'select', onchange: e => {
      data.customerId = e.target.value;
      // Check credit limit
      const cust = ERP.db.get('parties', data.customerId);
      let unpaid = 0;
      ERP.db.filter('salesInvoices', i => i.customerId === data.customerId && i.status !== 'paid').forEach(i => unpaid += i.balance);
      if (cust && cust.creditLimit && (unpaid + data.total) > cust.creditLimit) {
        toast(`Warning: Customer exceeds credit limit (${money(cust.creditLimit)})`, 'err');
      }
    }},
      h('option', { value:'' }, '— Select Customer —'),
      ...sortBy(ERP.db.filter('parties', p => p.type === 'customer' || p.type === 'both'), 'name').map(s => h('option', { value:s.id }, s.name))
    );

    const dateIn = h('input', { class:'input', type:'date', value:data.date });
    const editor = window.buildLineEditor ? window.buildLineEditor(data) : { el: h('div',null,'Line editor missing') };

    modal({
      title: 'New Sales Invoice', size:'xl2',
      content: h('div', null,
        h('div', { class:'form-grid' },
          h('div', { class:'field span2' }, h('label', null, 'Customer'), custSel),
          h('div', { class:'field' }, h('label', null, 'Invoice Date'), dateIn)
        ),
        h('div', { class:'hr' }),
        editor.el
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post Invoice', primary:true, onClick: c => {
          if (!custSel.value) return toast('Select customer', 'err');
          if (!data.lines.length) return toast('Add at least one item', 'err');

          const cust = ERP.db.get('parties', custSel.value);
          let unpaid = 0;
          ERP.db.filter('salesInvoices', i => i.customerId === custSel.value && i.status !== 'paid').forEach(i => unpaid += i.balance);
          if (cust && cust.creditLimit && (unpaid + data.total) > cust.creditLimit) {
             if(!confirm(`Credit limit exceeded (Limit: ${money(cust.creditLimit)}, Owed: ${money(unpaid)}). Proceed anyway?`)) return;
          }

          const inv = ERP.db.put('salesInvoices', { date:dateIn.value, customerId:custSel.value, lines:data.lines, total:data.total, balance:data.total, number:'INV-'+Date.now().toString().slice(-4), status:'open' });
          
          ERP.ledger.post({
            date: inv.date, narration: 'Sales Invoice ' + inv.number, reference: inv.number, source:'SI', sourceId: inv.id,
            lines: [
              { code:'1100', debit: inv.total, credit: 0 },
              { code:'4000', debit: 0, credit: inv.total }
            ]
          });
          c(); ERP.router.render(); toast('Invoice posted');
        }}
      ]
    });
  };

  const openReceiptForm = (inv) => {
    const amtIn = h('input', { class:'input', type:'number', value:inv.balance });
    const methodIn = h('select', { class:'select' }, h('option', { value:'1000' }, 'Cash'), h('option', { value:'1010' }, 'Bank'));
    modal({
      title: 'Record Receipt', size:'sm',
      content: h('div', null,
        h('div', { class:'field' }, h('label', null, 'Amount'), amtIn),
        h('div', { class:'field' }, h('label', null, 'Paid Via'), methodIn)
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post', primary:true, onClick: c => {
          const amt = Number(amtIn.value);
          ERP.ledger.post({ date: todayISO(), narration: 'Receipt for ' + inv.number, source:'Receipt',
            lines: [ { code:methodIn.value, debit: amt, credit: 0 }, { code:'1100', debit: 0, credit: amt } ]
          });
          ERP.db.put('salesInvoices', { ...inv, balance: round(inv.balance - amt, 2), status: inv.balance - amt <= 0.01 ? 'paid' : 'partial' });
          c(); ERP.router.render(); toast('Receipt posted');
        }}
      ]
    });
  };

  return page({ title:'Sales Invoices', subtitle:'Customer bills', actions:[h('button', { class:'btn btn-primary', onclick:() => openForm() }, '+ New Invoice')], content: card({ pad:false, body: renderList() }) });
};

/* =====================================================================
   5. ADVANCED PAYROLL (EPF/ETF & OVERTIME)
===================================================================== */
ERP.screens.wageRuns = function() {
  const renderList = () => {
    const rows = sortBy(ERP.db.all('payrollRuns'), 'date', true);
    const cols = [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Ref', key:'number', class:'mono' },
      { label:'Total Gross', key:'total', align:'right', render:v => money(v) }
    ];
    return table({ columns: cols, rows, empty: 'No payroll runs yet.' });
  };

  const openForm = () => {
    const emps = sortBy(ERP.db.all('employees'), 'name');
    if (!emps.length) return toast('Add employees first', 'err');
    
    const runs = emps.map(e => {
      return { emp: e, present: 30, ot: 0, gross: e.wageType === 'monthly' ? e.rate : 0, epf: 0, net: 0 };
    });

    const grid = h('div');
    
    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null,
        h('th', null, 'Employee'), h('th', {class:'num'}, 'Basic'), h('th', {class:'num'}, 'OT Hours'),
        h('th', {class:'num'}, 'Gross'), h('th', {class:'num'}, 'EPF (8%)'), h('th', {class:'num'}, 'Net Pay'), h('th', null, '')
      )));
      const tb = h('tbody');
      
      runs.forEach((r, i) => {
        const otIn = h('input', {class:'input num', type:'number', value:r.ot||0, oninput: e => { r.ot = Number(e.target.value); recalc(r); }});
        
        tb.appendChild(h('tr', null,
          h('td', null, r.emp.name),
          h('td', {class:'num'}, money(r.emp.rate)),
          h('td', {class:'num'}, otIn),
          h('td', {class:'num mono'}, money(r.gross)),
          h('td', {class:'num mono'}, money(r.epf)),
          h('td', {class:'num mono', style:{fontWeight:'600'}}, money(r.net)),
          h('td', null, h('button', {class:'btn btn-sm', onclick:()=>{
            ERP.printer.printA4('Payslip', ERP.printer.payslipHTML({date:todayISO()}, r.emp, r.gross, r.epf, r.net));
          }}, 'Print'))
        ));
      });
      tbl.appendChild(tb);
      grid.appendChild(tbl);
      updateTotals();
    };

    const recalc = (r) => {
      // Simplified: 1 day = 8 hrs. Basic + (OT hrs * hourly rate * 1.5)
      let basic = r.emp.wageType === 'monthly' ? r.emp.rate : r.emp.rate * 30;
      let hourly = (basic / 30) / 8;
      let otPay = r.ot * hourly * 1.5;
      r.gross = basic + otPay;
      r.epf = r.gross * 0.08; // 8% Employee EPF
      r.net = r.gross - r.epf;
      renderLines();
    };

    const totalsHost = h('div');
    const updateTotals = () => {
      let gross = sum(runs, r=>r.gross), epf = sum(runs, r=>r.epf), net = sum(runs, r=>r.net);
      totalsHost.innerHTML = '';
      totalsHost.appendChild(h('div',{class:'grid g3 mt16'},
        kpi({label:'Total Gross', value:money(gross)}),
        kpi({label:'Total EPF', value:money(epf)}),
        kpi({label:'Total Net', value:money(net)})
      ));
    };

    runs.forEach(recalc);

    const content = h('div', null, h('div',{class:'hint', style:{marginBottom:'12px'}}, 'Enter OT hours. EPF is calculated at 8%.'), grid, totalsHost);

    modal({
      title: 'Run Payroll', size:'xl2',
      content: content,
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post Payroll', primary:true, onClick: c => {
          const gross = sum(runs, r=>r.gross);
          const net = sum(runs, r=>r.net);
          const epf = sum(runs, r=>r.epf);

          const run = ERP.db.put('payrollRuns', { date: todayISO(), total:gross, number: genNum('PR'), lines: runs });
          
          ERP.ledger.post({
            date: run.date, narration: 'Payroll ' + run.number, source:'Payroll', sourceId: run.id,
            lines: [
              { code:'5020', debit: gross, credit: 0 }, // Labour Expense
              { code:'2200', debit: 0, credit: epf },   // EPF Payable
              { code:'1000', debit: 0, credit: net }    // Cash
            ]
          });
          
          c(); ERP.router.render(); toast('Payroll posted');
        }}
      ]
    });
  };

  return page({ title:'Wage Runs', subtitle:'Calculate Salaries & EPF', actions:[h('button', { class:'btn btn-primary', onclick: openForm }, '+ New Wage Run')], content: card({ pad:false, body: renderList() }) });
};

/* =====================================================================
   6. RE-REGISTER ROUTES & RENDER
===================================================================== */
ERP.router.add('home', ERP.screens.home);
ERP.router.add('settings', ERP.screens.settings);
ERP.router.add('sales/invoices', ERP.screens.salesInvoices);
ERP.router.add('payroll/runs', ERP.screens.wageRuns);

ERP.layout.mount();
ERP.router.render();

})();
</script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script>

          confirm('Delete?',()=>{ERP.db.remove('items',r.id); ERP.router.render();});

      JsBarcode(m.el.querySelector('.barcode-svg'), item.barcode, { format: "CODE128", width: 2, height: 60 });

  const openForm = (existing) => {

  return page({title:'Multi-Level Bill of Materials', actions:[h('button',{class:'btn btn-primary',onclick:()=>openForm()},'+ New BOM')], content:card({pad:false,body:renderList()})});

/* =====================================================================

ERP.screens.quotations = function() {

/* =====================================================================
   4. CUSTOMER AGING REPORT
===================================================================== */
ERP.screens.agingReport = function() {
  const customers = sortBy(ERP.db.filter('parties', p => p.type === 'customer' || p.type === 'both'), 'name');
  const today = new Date(todayISO());
  
  const rows = customers.map(c => {
    let current = 0, days30 = 0, days60 = 0, days90 = 0;
    
    ERP.db.filter('salesInvoices', i => i.customerId === c.id && i.balance > 0).forEach(inv => {
      const invDate = new Date(inv.date);
      const diffTime = Math.abs(today - invDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays <= 30) current += inv.balance;
      else if (diffDays <= 60) days30 += inv.balance;
      else if (diffDays <= 90) days60 += inv.balance;
      else days90 += inv.balance;
    });

    return { name: c.name, current, days30, days60, days90, total: current + days30 + days60 + days90 };
  }).filter(r => r.total > 0);

  const cols = [
    { label:'Customer', key:'name' },
    { label:'Current (0-30)', key:'current', align:'right', render:v => money(v) },
    { label:'31-60 Days', key:'days30', align:'right', render:v => money(v) },
    { label:'61-90 Days', key:'days60', align:'right', render:v => money(v) },
    { label:'90+ Days', key:'days90', align:'right', render:v => h('span', {style:{color:'var(--danger)', fontWeight:'bold'}}, money(v)) },
    { label:'Total Owed', key:'total', align:'right', render:v => h('span', {style:{fontWeight:'bold'}}, money(v)) }
  ];

  const totalOwed = sum(rows, r => r.total);
  const footer = h('div', {style:{padding:'12px', display:'flex', justifyContent:'space-between', fontWeight:'bold', background:'var(--surface2)'}},
    h('span', null, 'Total Outstanding Receivables'),
    h('span', null, money(totalOwed))
  );

  return page({ title:'Aging Report', subtitle:'Outstanding customer balances by age',
    content: card({ pad:false, body: h('div', null, table({columns:cols, rows, empty:'No outstanding balances.'}), footer) })
  });
};

  const today = new Date(todayISO());
  
  const rows = customers.map(c => {
    let current = 0, days30 = 0, days60 = 0, days90 = 0;
    
    ERP.db.filter('salesInvoices', i => i.customerId === c.id && i.balance > 0).forEach(inv => {
      const invDate = new Date(inv.date);
      const diffTime = Math.abs(today - invDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays <= 30) current += inv.balance;
      else if (diffDays <= 60) days30 += inv.balance;
      else if (diffDays <= 90) days60 += inv.balance;
      else days90 += inv.balance;
    });

    return { id: c.id, name: c.name, current, days30, days60, days90, total: current + days30 + days60 + days90 };
  }).filter(r => r.total > 0);

  const viewDetails = (customerId, customerName) => {
    const invs = ERP.db.filter('salesInvoices', i => i.customerId === customerId && i.balance > 0);
    const invRows = invs.map(inv => {
      const items = (inv.lines || []).map(l => ERP.db.get('items', l.itemId)?.name || 'Unknown').join(', ');
      return {
        number: inv.number,
        date: inv.date,
        total: inv.total,
        balance: inv.balance,
        items: items
      };
    });

    const cols = [
      { label:'Invoice #', key:'number', class:'mono' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Items Purchased', key:'items' },
      { label:'Total', key:'total', align:'right', render:v => money(v) },
      { label:'Owed', key:'balance', align:'right', render:v => h('span', {style:{color:'var(--danger)', fontWeight:'bold'}}, money(v)) }
    ];

    modal({
      title: 'Outstanding Invoices: ' + customerName,
      size: 'lg',
      content: table({ columns: cols, rows: invRows, empty: 'No outstanding invoices.' }),
      actions: [{ label: 'Close', primary: true }]
    });
  };

  const cols = [
    { label:'Customer', key:'name', render: (v, r) => h('a', {href:'#', onclick: (e) => { e.preventDefault(); viewDetails(r.id, r.name); }}, v) },
    { label:'Current (0-30)', key:'current', align:'right', render:v => money(v) },
    { label:'31-60 Days', key:'days30', align:'right', render:v => money(v) },
    { label:'61-90 Days', key:'days60', align:'right', render:v => money(v) },
    { label:'90+ Days', key:'days90', align:'right', render:v => h('span', {style:{color:'var(--danger)', fontWeight:'bold'}}, money(v)) },
    { label:'Total Owed', key:'total', align:'right', render:v => h('span', {style:{fontWeight:'bold'}}, money(v)) }
  ];

  const totalOwed = sum(rows, r => r.total);
  const footer = h('div', {style:{padding:'12px', display:'flex', justifyContent:'space-between', fontWeight:'bold', background:'var(--surface2)'}},
    h('span', null, 'Total Outstanding Receivables'),
    h('span', null, money(totalOwed))
  );

  return page({ title:'Aging Report', subtitle:'Click a customer to view exact invoice and product details',
    content: card({ pad:false, body: h('div', null, table({columns:cols, rows, empty:'No outstanding balances.'}), footer) })
  });
};

===================================================================== */
ERP.screens.wastage = function() {
  const renderList = () => {
    const rows = sortBy(ERP.db.all('wastages'), 'date', true);
    const cols = [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Item', key:'itemId', render:v => ERP.db.get('items', v)?.name },
      { label:'Qty Wasted', key:'qty', align:'right', render:v => qty(v) },
      { label:'Loss Value', key:'value', align:'right', render:v => money(v) },
      { label:'Reason', key:'reason' }
    ];
    return table({ columns: cols, rows, empty: 'No wastage recorded.' });
  };

  const openForm = () => {
    const data = { date: todayISO(), itemId:'', qty:0, reason:'' };
    const items = sortBy(ERP.db.all('items'), 'name');

    const itemSel = h('select', {class:'select', onchange: e => data.itemId = e.target.value},
      h('option', {value:''}, '— Select Item —'),
      ...items.map(i => h('option', {value:i.id}, i.name))
    );
    const qtyIn = h('input', {class:'input', type:'number', oninput: e => data.qty = Number(e.target.value)});
    const reasonIn = h('input', {class:'input', placeholder:'e.g. Torn during stitching', oninput: e => data.reason = e.target.value});

    modal({
      title: 'Record Wastage', size:'sm',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Item'), itemSel),
        h('div', {class:'field'}, h('label', null, 'Quantity Wasted'), qtyIn),
        h('div', {class:'field'}, h('label', null, 'Reason'), reasonIn)
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post Wastage', primary:true, onClick: c => {
          if(!data.itemId || data.qty <= 0) return toast('Select item and qty', 'err');
          const itm = ERP.db.get('items', data.itemId);
          const val = (itm.price || 0) * data.qty;

          // Deduct Stock
          ERP.ledger.postStockMove({
            date: data.date, itemId: data.itemId, warehouseId: ERP.db.find('warehouses', w=>w.code==='RM').id,
            qty: -data.qty, rate: itm.price, refType: 'Wastage', refNumber: 'WST-'+Date.now().toString().slice(-4)
          });

          // Post Ledger (Dr Wastage Loss / Cr Raw Materials)
          ERP.ledger.post({
            date: data.date, narration: 'Wastage: ' + data.reason, source:'Wastage',
            lines: [
              { code:'5040', debit: val, credit: 0 },
              { code:'1210', debit: 0, credit: val }
            ]
          });

          ERP.db.put('wastages', {...data, value: val});
          c(); ERP.router.render(); toast('Wastage recorded');
        }}
      ]
    });
  };

  return page({ title:'Wastage / Scrap', subtitle:'Record damaged goods and deduct stock', actions:[h('button', {class:'btn btn-primary', onclick: openForm}, '+ Record Wastage')], content: card({ pad:false, body: renderList() }) });
};

ERP.screens.jobWork = function() {
  const renderList = () => {

      { label:'Date', key:'date', render:v => fmtDate(v) },

    const suppliers = sortBy(ERP.db.filter('parties', p => p.type === 'supplier' || p.type === 'both'), 'name');

    );

    );
    const qtyIn = h('input', {class:'input', type:'number', oninput: e => data.qty = Number(e.target.value)});

    modal({
      title: 'Send for Job Work', size:'sm',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Job Worker'), supSel),
        h('div', {class:'field'}, h('label', null, 'Material'), itemSel),
        h('div', {class:'field'}, h('label', null, 'Quantity'), qtyIn)
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Send Out', primary:true, onClick: c => {
          if(!data.supplierId || !data.itemId || data.qty <= 0) return toast('Fill all fields', 'err');
          
          // Stock OUT from RM
          ERP.ledger.postStockMove({
            date: data.date, itemId: data.itemId, warehouseId: ERP.db.find('warehouses', w=>w.code==='RM').id,
            qty: -data.qty, rate: 0, refType: 'JobWork Out', refNumber: 'JW-'+Date.now().toString().slice(-4)
          });

          ERP.db.put('jobWorks', {...data, status:'pending'});
          c(); ERP.router.render(); toast('Material sent to job worker');
        }}
      ]
    });
  };

  const receiveJob = (jw) => {
    const fgItems = ERP.db.filter('items', i => i.type === 'FG' || i.type === 'Assembly');
    const fgSel = h('select', {class:'select'},
      h('option', {value:''}, '— Select Finished Return —'),
      ...fgItems.map(i => h('option', {value:i.id}, i.name))
    );
    const retQtyIn = h('input', {class:'input', type:'number', value:jw.qty});
    const feeIn = h('input', {class:'input', type:'number', placeholder:'Stitching fee per unit'});

    modal({
      title: 'Receive from Job Worker', size:'sm',
      content: h('div', null,
        h('p', null, `Receiving ${jw.qty} units of ${ERP.db.get('items', jw.itemId)?.name}`),
        h('div', {class:'field'}, h('label', null, 'Returned As (Finished Good)'), fgSel),
        h('div', {class:'field'}, h('label', null, 'Received Qty'), retQtyIn),
        h('div', {class:'field'}, h('label', null, 'Job Work Fee (Total)'), feeIn)
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Receive', primary:true, onClick: c => {
          const retQty = Number(retQtyIn.value);
          const fee = Number(feeIn.value) || 0;
          
          // Stock IN to FG
          ERP.ledger.postStockMove({
            date: todayISO(), itemId: fgSel.value, warehouseId: ERP.db.find('warehouses', w=>w.code==='FG').id,
            qty: retQty, rate: 0, refType: 'JobWork In', refNumber: 'JW-IN-'+Date.now().toString().slice(-4)
          });

          // Post Ledger for Fee (Dr Direct Labour / Cr Accounts Payable)
          if(fee > 0) {
            ERP.ledger.post({
              date: todayISO(), narration: 'Job Work Fee for ' + jw.supplierId, source:'JobWork',
              lines: [
                { code:'5020', debit: fee, credit: 0 }, // Direct Labour
                { code:'2000', debit: 0, credit: fee }  // AP
              ]
            });
          }

          ERP.db.put('jobWorks', {...jw, status:'returned'});
          c(); ERP.router.render(); toast('Goods received from job worker');
        }}
      ]

  return page({ title:'Job Work (Outsourcing)', subtitle:'Send materials to third-party stitchers', actions:[h('button', {class:'btn btn-primary', onclick: openForm}, '+ Send for Job Work')], content: card({ pad:false, body: renderList() }) });

   4. PHYSICAL STOCK TAKE & ADJUSTMENT
===================================================================== */
ERP.screens.stockTake = function() {
  const renderList = () => {
    const rows = sortBy(ERP.db.all('stockTakes'), 'date', true);
    const cols = [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Warehouse', key:'whId', render:v => ERP.db.get('warehouses', v)?.name },
      { label:'Items Adjusted', key:'lines', render:v => v.length + ' items' },
      { label:'', render:r => h('button', {class:'btn btn-sm btn-ghost', onclick:() => viewTake(r)}, 'View') }
    ];
    return table({ columns: cols, rows, empty: 'No stock takes recorded.' });
  };

  const viewTake = (take) => {
    const cols = [
      { label:'Item', key:'itemId', render:v => ERP.db.get('items', v)?.name },
      { label:'System Qty', key:'systemQty', align:'right', render:v => qty(v) },
      { label:'Actual Qty', key:'actualQty', align:'right', render:v => qty(v) },
      { label:'Difference', key:'diff', align:'right', render:v => h('span', {style:{color: v===0?'inherit':(v>0?'var(--ok)':'var(--danger)')}}, qty(v)) }
    ];
    modal({ title:'Stock Take Details', size:'lg', content: table({columns:cols, rows:take.lines}), actions:[{label:'Close', primary:true}] });
  };

  const openForm = () => {
    const whSel = h('select', {class:'select'}, ...ERP.db.filter('warehouses', w=>w.factoryId===ERP.ctx.factory.id).map(w => h('option', {value:w.id}, w.name)));
    const grid = h('div');
    let takeData = { whId:'', lines: [] };

    const loadData = () => {
      takeData.whId = whSel.value;
      const moves = ERP.db.all('stockMoves');
      const items = ERP.db.all('items');
      
      takeData.lines = items.map(itm => {
        let systemQty = 0;
        moves.filter(m => m.itemId === itm.id && m.warehouseId === takeData.whId).forEach(m => systemQty += m.qty);
        return { itemId: itm.id, name: itm.name, systemQty, actualQty: systemQty, diff: 0 };
      }).filter(l => l.systemQty !== 0); // Only show items currently in this warehouse

      renderGrid();
    };

    const renderGrid = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'line-tbl'});
      tbl.appendChild(h('thead', null, h('tr', null, h('th', null, 'Item'), h('th', {class:'num'}, 'System Qty'), h('th', {class:'num'}, 'Actual Qty'))));
      const tb = h('tbody');
      
      takeData.lines.forEach(l => {
        const actIn = h('input', {class:'input num', type:'number', value:l.actualQty, oninput: e => { l.actualQty = Number(e.target.value); l.diff = l.actualQty - l.systemQty; }});
        tb.appendChild(h('tr', null, h('td', null, l.name), h('td', {class:'num mono'}, qty(l.systemQty)), h('td', {class:'num'}, actIn)));
      });
      tbl.appendChild(tb); grid.appendChild(tbl);
    };

    whSel.onchange = loadData;

    modal({
      title: 'New Physical Stock Take', size:'xl2',
      content: h('div', null,
        h('div', {class:'field', style:{marginBottom:'16px'}}, h('label', null, 'Select Warehouse to Count'), whSel),
        grid
      ),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post Adjustments', primary:true, onClick: c => {
          if(!takeData.whId) return toast('Select warehouse', 'err');
          const changed = takeData.lines.filter(l => l.diff !== 0);
          if(!changed.length) return toast('No differences found', 'warn');

          // Post Stock Moves & Ledger
          changed.forEach(l => {
            const itm = ERP.db.get('items', l.itemId);
            const val = (itm.price||0) * l.diff;

            ERP.ledger.postStockMove({ date: todayISO(), itemId: l.itemId, warehouseId: takeData.whId, qty: l.diff, rate: itm.price, refType:'Stock Take', refNumber:'ST-'+Date.now().toString().slice(-4) });

            // If diff > 0 (Gain) -> Dr Inventory / Cr Wastage Loss
            // If diff < 0 (Loss) -> Dr Wastage Loss / Cr Inventory
            if(l.diff > 0) {
              ERP.ledger.post({ date: todayISO(), narration: 'Stock Take Gain', source:'StockTake',
                lines: [ {code:'1210', debit: val, credit:0}, {code:'5040', debit:0, credit:val} ] });
            } else {
              ERP.ledger.post({ date: todayISO(), narration: 'Stock Take Loss', source:'StockTake',
                lines: [ {code:'5040', debit: -val, credit:0}, {code:'1210', debit:0, credit:-val} ] });
            }
          });

          ERP.db.put('stockTakes', { date: todayISO(), whId: takeData.whId, lines: changed });
          c(); ERP.router.render(); toast('Stock adjustments posted');
        }}
      ]
    });
    
    setTimeout(loadData, 100);
  };

  return page({ title:'Physical Stock Take', subtitle:'Audit and adjust inventory', actions:[h('button', {class:'btn btn-primary', onclick: openForm}, '+ New Stock Take')], content: card({ pad:false, body: renderList() }) });
};

    el.appendChild(grp);

};

            lines:[{code:'1400',debit:amt,credit:0},{code:'1000',debit:0,credit:amt}]

/* =====================================================================
   2. ADVANCED PAYROLL ENGINE
===================================================================== */
ERP.screens.wageRuns = function() {
  const renderList = () => {
    const rows = sortBy(ERP.db.all('payrollRuns'), 'date', true);
    const cols = [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Ref', key:'number', class:'mono' },
      { label:'Total Gross', key:'total', align:'right', render:v => money(v) },
      { label:'', render:r=>h('button',{class:'btn btn-sm btn-ghost',onclick:()=>{
        // Print Payslips
        let html = '';
        r.lines.forEach(l => {
          html += ERP.printer.payslipHTML(r, l.emp, l.gross, l.epf, l.net) + '<div style="page-break-after:always;"></div>';
        });
        ERP.printer.printA4('Payslips', html);
      }},'Print Slips') }
    ];
    return table({ columns: cols, rows, empty: 'No payroll runs yet.' });
  };

  const openForm = () => {
    const emps = sortBy(ERP.db.filter('employees', e => e.active !== false), 'name');
    if (!emps.length) return toast('Add employees first', 'err');
    
    const runs = emps.map(e => {
      const loans = ERP.db.filter('loans', l => l.empId === e.id && l.balance > 0);
      const loanDed = sum(loans, l => Math.min(l.deduction, l.balance));
      return { emp: e, days: 30, ot: 0, gross: 0, epfEmp: 0, epfCo: 0, etf: 0, loan: loanDed, net: 0 };
    });

    const grid = h('div');
    
    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null,
        h('th', null, 'Employee'), h('th', {class:'num'}, 'OT Hrs'), h('th', {class:'num'}, 'Gross'),
        h('th', {class:'num'}, 'EPF 8%'), h('th', {class:'num'}, 'Loan'), h('th', {class:'num'}, 'Net Pay')
      )));
      const tb = h('tbody');
      
      runs.forEach((r, i) => {
        const otIn = h('input', {class:'input num', type:'number', value:r.ot, oninput: e => { r.ot = Number(e.target.value); recalc(r); }});
        tb.appendChild(h('tr', null,
          h('td', null, r.emp.name),
          h('td', {class:'num'}, otIn),
          h('td', {class:'num mono'}, money(r.gross)),
          h('td', {class:'num mono', style:{color:'var(--danger)'}}, money(r.epfEmp)),
          h('td', {class:'num mono', style:{color:'var(--danger)'}}, money(r.loan)),
          h('td', {class:'num mono', style:{fontWeight:'bold'}}, money(r.net))
        ));
      });
      tbl.appendChild(tb); grid.appendChild(tbl); updateTotals();
    };

    const recalc = (r) => {
      let basic = r.emp.wageType === 'monthly' ? r.emp.rate : r.emp.rate * 30;
      let hourly = (basic / 30) / 8;
      r.gross = basic + (r.ot * hourly * (r.emp.otRate||1.5));
      
      if (r.emp.payEpf) {
        r.epfEmp = r.gross * 0.08;
        r.epfCo = r.gross * 0.12;
        r.etf = r.gross * 0.03;
      }
      r.net = r.gross - r.epfEmp - r.loan;
      renderLines();
    };

    const totalsHost = h('div');
    const updateTotals = () => {
      let gross = sum(runs, r=>r.gross), net = sum(runs, r=>r.net);
      totalsHost.innerHTML = '';
      totalsHost.appendChild(h('div',{class:'grid g2 mt16'},
        kpi({label:'Total Gross', value:money(gross)}),
        kpi({label:'Total Net to Pay', value:money(net)})
      ));
    };

    runs.forEach(recalc);

    modal({
      title: 'Run Payroll (with EPF/ETF)', size:'xl2',
      content: h('div', null, grid, totalsHost),
      actions: [
        { label:'Cancel', onClick: c => c() },
        { label:'Post Payroll', primary:true, onClick: c => {
          const gross = sum(runs, r=>r.gross);
          const net = sum(runs, r=>r.net);
          const epfTotal = sum(runs, r=>r.epfEmp + r.epfCo);
          const etfTotal = sum(runs, r=>r.etf);
          const loanTotal = sum(runs, r=>r.loan);

          const run = ERP.db.put('payrollRuns', { date: todayISO(), total:gross, number: genNum('PR'), lines: runs });
          
          // Post Ledger
          ERP.ledger.post({
            date: run.date, narration: 'Payroll ' + run.number, source:'Payroll', sourceId: run.id,
            lines: [
              { code:'5020', debit: gross + epfTotal + etfTotal, credit: 0 }, // Total Labour Cost
              { code:'2200', debit: 0, credit: epfTotal }, // EPF Payable (8+12)
              { code:'2210', debit: 0, credit: etfTotal }, // ETF Payable
              { code:'1400', debit: 0, credit: loanTotal }, // Loan Recovery
              { code:'1000', debit: 0, credit: net }       // Cash Paid
            ]
          });

          // Deduct Loans
          runs.forEach(r => {
            if(r.loan > 0) {
              let toDeduct = r.loan;
              ERP.db.filter('loans', l => l.empId === r.emp.id && l.balance > 0).forEach(l => {
                if(toDeduct <= 0) return;
                const ded = Math.min(l.balance, toDeduct);
                ERP.db.put('loans', {...l, balance: l.balance - ded});
                toDeduct -= ded;
              });
            }
          });

          c(); ERP.router.render(); toast('Payroll posted with EPF/ETF');
        }}
      ]
    });
  };

  return page({ title:'Wage Runs', subtitle:'Calculate Salaries, OT, EPF & ETF', actions:[h('button', { class:'btn btn-primary', onclick: openForm }, '+ Run Payroll')], content: card({ pad:false, body: renderList() }) });
};
ERP.router.add('payroll/runs', ERP.screens.wageRuns);

ERP.screens.bankRec = function() {

/* =====================================================================
   4. FIXED ASSETS & DEPRECIATION
===================================================================== */
ERP.screens.fixedAssets = function() {
  const renderList = () => {
    const rows = ERP.db.all('fixedAssets');
    const cols = [
      { label:'Asset Name', key:'name' },
      { label:'Purchase Date', key:'date', render:v => fmtDate(v) },
      { label:'Cost', key:'cost', align:'right', render:v => money(v) },
      { label:'Depreciation', key:'_dep', align:'right', render:r => money(r.cost - (r.currentBookValue || r.cost)) },
      { label:'Book Value', key:'_bv', align:'right', render:r => money(r.currentBookValue || r.cost) }
    ];
    return table({ columns: cols, rows, empty: 'No fixed assets registered.' });
  };

  const openForm = () => {
    const data = { name:'', date:todayISO(), cost:0, life:5 };
    const nameIn = h('input',{class:'input', oninput:e=>data.name=e.target.value});
    const costIn = h('input',{class:'input', type:'number', oninput:e=>data.cost=Number(e.target.value)});
    const lifeIn = h('input',{class:'input', type:'number', oninput:e=>data.life=Number(e.target.value)});

    modal({
      title:'Register Fixed Asset', size:'sm',
      content: h('div',null,
        h('div',{class:'field'},h('label',null,'Asset Name (e.g. Machine)'),nameIn),
        h('div',{class:'field'},h('label',null,'Cost'),costIn),
        h('div',{class:'field'},h('label',null,'Useful Life (Years)'),lifeIn)
      ),
      actions:[
        {label:'Cancel',onClick:c=>c()},
        {label:'Save',primary:true,onClick:c=>{
          ERP.db.put('fixedAssets', {...data, currentBookValue:data.cost, life:Number(lifeIn.value)});
          c(); ERP.router.render(); toast('Asset added');
        }}
      ]
    });
  };

  const runDepreciation = () => {
    const assets = ERP.db.all('fixedAssets');
    let totalDep = 0;
    
    assets.forEach(a => {
      const depPerYear = (a.cost / a.life);
      const newVal = Math.max(0, (a.currentBookValue || a.cost) - depPerYear);
      totalDep += (a.currentBookValue || a.cost) - newVal;
      ERP.db.put('fixedAssets', {...a, currentBookValue:newVal});
    });

    if(totalDep > 0) {
      ERP.ledger.post({
        date: todayISO(), narration: 'Annual Depreciation', source:'Depreciation',
        lines: [
          { code:'6150', debit: totalDep, credit: 0 },
          { code:'1590', debit: 0, credit: totalDep }
        ]
      });
      toast('Depreciation posted: ' + money(totalDep));
      ERP.router.render();
    } else {
      toast('Assets fully depreciated or none found', 'warn');
    }
  };

  return page({ title:'Fixed Assets', subtitle:'Machinery and equipment register',
    actions:[h('button',{class:'btn',onclick:runDepreciation},'Run Depreciation'), h('button',{class:'btn btn-primary',onclick:openForm},'+ New Asset')],
    content: card({pad:false, body: renderList()})
  });
};

===================================================================== */
ERP.screens.cashFlow = function() {
  const accounts = ERP.db.all('coa');
  
  const getFlow = (codes) => {
    let inFlow = 0, outFlow = 0;
    ERP.db.all('journalEntries').forEach(j => {
      j.lines.forEach(l => {
        if (codes.includes(l.accountCode)) {
          if (l.accountCode === '1000' || l.accountCode === '1010') {
            inFlow += l.debit; outFlow += l.credit;
          }
        }
      });
    });
    return { inFlow, outFlow, net: inFlow - outFlow };
  };

  // Simplified categorizations
  const op = getFlow(['1000','1010']); // In a real app, we analyze the OTHER side of the entry. For simplicity, we just show total movement.
  
  return page({
    title:'Cash Flow Statement', subtitle:'Movement of cash and bank',
    content: card({body: h('div', null,
      h('h3',{style:{padding:'10px 0', borderBottom:'1px solid var(--line)'}},'Operating Activities'),
      h('div',{class:'row', style:{justifyContent:'space-between', padding:'8px 0'}}, h('span',null,'Cash Received'), h('span',{class:'mono'}, money(op.inFlow))),
      h('div',{class:'row', style:{justifyContent:'space-between', padding:'8px 0'}}, h('span',null,'Cash Paid'), h('span',{class:'mono'}, `(${money(op.outFlow)})`)),
      h('div',{class:'row', style:{justifyContent:'space-between', padding:'12px 0', borderTop:'2px solid var(--line)', fontWeight:'bold'}}, h('span',null,'Net Cash Flow'), h('span',{class:'mono'}, money(op.net)))

  });
};

          record: data,

}
  `.trim();

  function renderTab() {
    bodyHost.innerHTML = '';
    if(activeTab === 'company') {
      const nameIn = h('input',{class:'input',value:s.companyName||''});
      const currIn = h('input',{class:'input',value:s.currency?.symbol||'Rs'});
      bodyHost.appendChild(card({ title:'Company Details', body: h('div',null,
        h('div',{class:'field',style:{marginBottom:'12px'}},h('label',null,'Company Name'),nameIn),
        h('div',{class:'field',style:{marginBottom:'12px'}},h('label',null,'Currency Symbol'),currIn),
        h('button',{class:'btn btn-primary',onclick:()=>{ s.companyName = nameIn.value; s.currency.symbol = currIn.value; ERP.db.setMeta('settings', s); ERP.layout.mount(); toast('Saved'); }},'Save')
      )}));
    } else if(activeTab === 'cloud') {
      const urlIn = h('input', { class:'input', value: s.googleSheetUrl || '', placeholder:'https://script.google.com/macros/s/.../exec' });
      
      const guide = h('div', {class:'soon-note', style:{background:'#fff8e6', color:'#8a6d3b', borderColor:'#faebcc'}},
        h('strong', null, 'How to set up instant Google Sheets sync:'),
        h('ol', {style:{margin:'8px 0 0 16px', padding:0}},
          h('li', null, 'Create a new Google Sheet.'),
          h('li', null, 'Go to Extensions > Apps Script.'),
          h('li', null, 'Paste the code below and click Deploy > New Deployment.'),
          h('li', null, 'Choose "Web App", set access to "Anyone", and click Deploy.'),
          h('li', null, 'Copy the URL and paste it below.')
        ),
        h('div', {style:{marginTop:'10px'}},
          h('button', {class:'btn btn-sm', onclick:()=>{
            modal({ title:'Google Apps Script', size:'lg', content: h('pre', {style:{background:'#111', color:'#0f0', padding:'16px', overflow:'auto'}}, scriptCode), actions:[{label:'Close', primary:true}] });
          }}, 'View Apps Script Code')
        )
      );

      bodyHost.appendChild(card({ title:'Google Sheets Sync URL', body: h('div',null,
        guide,
        h('div',{class:'field',style:{marginBottom:'12px', marginTop:'16px'}},h('label',null,'Webhook URL'),urlIn),
        h('button',{class:'btn btn-primary',onclick:()=>{ s.googleSheetUrl = urlIn.value; ERP.db.setMeta('settings', s); toast('Cloud Sync configured'); }},'Save URL')
      )}));
    } else if(activeTab === 'backup') {
      const exportData = () => {
        const data = {};
        Object.keys(ERP.config.collections).forEach(c => data[c] = ERP.db.all(c));
        data._settings = ERP.db.meta('settings');
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'erp_backup.json'; a.click();
      };
      const importData = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            window._restoring = true;
            const data = JSON.parse(ev.target.result);
            Object.keys(ERP.config.collections).forEach(c => {
              localStorage.removeItem(ERP.config.dbName + '_' + c);
              if(data[c]) localStorage.setItem(ERP.config.dbName + '_' + c, JSON.stringify(data[c]));
            });
            if(data._settings) ERP.db.setMeta('settings', data._settings);
            toast('Restored. Reloading...'); setTimeout(()=>location.reload(),1000);
          } catch(err) { window._restoring = false; toast('Invalid file', 'err'); }
        };
        reader.readAsText(file);
      };
      bodyHost.appendChild(card({ title:'Backup Data', body: h('div',null,
        h('button',{class:'btn btn-primary',onclick:exportData},'Download JSON Backup'),
        h('div',{class:'hr'}),
        h('div',{class:'hint',style:{marginBottom:'8px'}},'Restore from file (overwrites current data):'),
        h('input',{type:'file',accept:'.json',onchange:importData})
      )}));
    }
  }

  renderTab();
  return page({ title:'Settings', subtitle:'System configuration', content: h('div', null, tabs, bodyHost) });
};

// Inject Toggle into Topbar
const darkBtn = h('button', { class:'btn btn-sm btn-ghost', style:{ marginLeft:'10px' }, onclick: () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('erp_dark_mode', document.body.classList.contains('dark') ? '1' : '0');

if(localStorage.getItem('erp_dark_mode') === '1') {
  document.body.classList.add('dark');
}

/* =====================================================================
   5. NAVIGATION UPDATE & ROLE RESTRICTIONS
===================================================================== */
ERP.layout.buildNav = function() {
  const el = document.getElementById('sbNav'); if(!el) return; el.innerHTML='';
  const path = ERP.router.path();
  const role = ERP.ctx.user ? ERP.ctx.user.role : 'admin';
  
  const nav = [
    { group:'Overview', items:[{l:'Dashboard', r:'home'}] },
    { group:'Masters', items:[
      {l:'Items (Products)', r:'masters/items'},
      {l:'Parties (Cust/Supp)', r:'masters/parties'},
      {l:'Employees & EPF', r:'masters/employees'},
      {l:'Bill of Materials', r:'masters/bom'},
      {l:'Chart of Accounts', r:'masters/coa'}
    ]},
    { group:'Sales & CRM', items:[
      {l:'Quotations', r:'sales/quotations'},
      {l:'Sales Invoices', r:'sales/invoices'},
      {l:'Aging Report', r:'sales/aging'}
    ]},
    { group:'Purchases', items:[
      {l:'Purchase Orders', r:'purchases/orders'},
      {l:'Purchase Invoices', r:'purchases/invoices'}
    ]},
    { group:'Factory', items:[
      {l:'Work Orders', r:'production/orders'},
      {l:'Job Work (Outsource)', r:'production/job-work'},
      {l:'Stock Take', r:'inventory/stock-take'},
      {l:'Wastage', r:'inventory/wastage'}
    ]},
    { group:'Payroll & HR', items:[
      {l:'Wage Runs (EPF/OT)', r:'payroll/runs'}
    ]},
    { group:'Finance', items:[
      {l:'Bank Reconciliation', r:'accounting/bank-rec'},
      {l:'Fixed Assets', r:'accounting/fixed-assets'},
      {l:'Trial Balance', r:'accounting/trial-balance'},
      {l:'Profit & Loss', r:'reports/pnl'},
      {l:'Balance Sheet', r:'reports/balance-sheet'},
      {l:'Cash Flow', r:'reports/cash-flow'}
    ]},
    { group:'System', items:[
      {l:'Users & Roles', r:'admin/users'},
      {l:'Audit Trail', r:'admin/audit'},
      {l:'Settings', r:'settings'}
    ]}
  ];

  nav.forEach(g => {
    // Filter items based on role
    let items = g.items;
    if (role === 'cashier') {
      // Cashier only sees Sales, Dashboard, Parties, Settings
      if (!['Overview','Sales & CRM','Masters'].includes(g.group)) return; 
      if (g.group === 'Masters') items = items.filter(i => i.l.includes('Parties') || i.l.includes('Items'));
    } else if (role === 'storekeeper') {
      // Storekeeper only sees Factory, Inventory, Masters
      if (!['Overview','Factory','Masters'].includes(g.group)) return;
    } else if (role !== 'admin') {
      // Fallback: if role is weird, only show Overview
      if (g.group !== 'Overview') return;
    }

    const isCurrent = items.some(i => i.r === path);
    const groupClass = isCurrent ? 'sb-group open' : 'sb-group';
    const grp = h('div', {class: groupClass});
    const head = h('div', {class: 'sb-group-h', onclick: () => { grp.classList.toggle('open'); }}, h('span', null, g.group), h('span', null, '▾'));
    grp.appendChild(head);
    const itemsEl = h('div', {class: 'sb-items'});
    items.forEach(i => {
      const active = path === i.r ? ' active' : '';
      itemsEl.appendChild(h('div', {class: 'sb-item' + active, onclick: () => ERP.router.navigate(i.r)}, h('span', {class: 'dot'}), h('span', {class: 'flex1'}, i.l)));
    });
    grp.appendChild(itemsEl); 
    el.appendChild(grp);
  });
};

// Re-register changed routes
ERP.router.add('settings', ERP.screens.settings);
ERP.router.add('admin/users', ERP.screens.users);
ERP.router.add('admin/audit', ERP.screens.auditLog);

ERP.layout.mount();
ERP.router.render();
toast('Upgrade Part D Loaded: Users, Cloud Sync, Audit & Dark Mode');

})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script>
console.log('Loading Part E: Firebase Integration...');
(function(){
'use strict';
const ERP = window.ERP;
if (!ERP) return;

// 1. Initialize Firebase with your credentials
const firebaseConfig = {
  apiKey: "AIzaSyCemkHwGDXgINLKSZAGebuXufJV1Vgc6NI",
  authDomain: "factory-manager-1b5fa.firebaseapp.com",
  projectId: "factory-manager-1b5fa",
  storageBucket: "factory-manager-1b5fa.firebasestorage.app",
  messagingSenderId: "869478675654",
  appId: "1:869478675654:web:a2ff3d1b2c1e215b5893c7",
  measurementId: "G-TWGLLG6RGE"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();

/* =====================================================================
   2. THE CLOUD ADAPTER (Overrides the localStorage engine)
===================================================================== */
// We wrap the original localStorage put/remove to also push to Firestore
const originalPut = ERP.db.put;
const originalRemove = ERP.db.remove;

ERP.db.put = function(col, obj) {
  // 1. Save to LocalStorage instantly (so UI doesn't lag)
  const res = originalPut(col, obj);
  
  // 2. Push to Firestore in background
  const user = auth.currentUser;
  if (user) {
    db.collection('users').doc(user.uid).collection('erp_data').doc(col + '_' + res.id).set(res)
      .catch(e => console.error('Firebase Sync Error:', e));
  }
  return res;
};

ERP.db.remove = function(col, id) {
  // 1. Remove from LocalStorage
  originalRemove(col, id);
  
  // 2. Remove from Firestore
  const user = auth.currentUser;
  if (user) {
    db.collection('users').doc(user.uid).collection('erp_data').doc(col + '_' + id).delete()
      .catch(e => console.error('Firebase Delete Error:', e));
  }
};

/* =====================================================================
   3. AUTHENTICATION UI & BOOT SEQUENCE
===================================================================== */
// Inject Login Overlay CSS
const style = document.createElement('style');
style.textContent = `
  .auth-overlay { position: fixed; inset: 0; background: var(--sb); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .auth-box { background: var(--surface); color: var(--text); padding: 40px; border-radius: 14px; text-align: center; box-shadow: var(--shlg); width: 100%; max-width: 400px; }
  .btn-google { background: #fff; color: #333; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
  .btn-google:hover { background: #f9f9f9; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
`;
document.head.appendChild(style);

// Create Overlay
const overlay = document.createElement('div');
overlay.className = 'auth-overlay';
overlay.style.display = 'none'; // Hidden by default until we check auth state
overlay.innerHTML = `
  <div class="auth-box">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#1f6feb,#4f9cf9);display:grid;place-items:center;margin:0 auto 20px;font-size:28px;font-weight:800;color:#fff;">LS</div>
    <h2 style="margin-bottom:10px;">Lanka Slipper ERP</h2>
    <p class="hint" style="margin-bottom:20px;">Sign in to sync your factory data securely to the cloud.</p>
    <button class="btn-google" id="btnGoogleLogin">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
      Sign in with Google
    </button>
  </div>
`;
document.body.appendChild(overlay);

// Handle Login Click
document.getElementById('btnGoogleLogin').onclick = function() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert(err.message));
};

/* =====================================================================
   4. LISTEN FOR AUTH STATE CHANGES
===================================================================== */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    // User is signed in
    overlay.style.display = 'none';
    console.log('Logged in as:', user.email);
    
    // Update Topbar with Sync Status
    const topbar = document.querySelector('.topbar');
    if(!document.getElementById('syncStatus')) {
      const syncDiv = document.createElement('div');
      syncDiv.id = 'syncStatus';
      syncDiv.style = "font-size:12px; font-weight:600; color:var(--ok); margin-right:15px; display:flex; align-items:center;";
      syncDiv.innerHTML = '<span class="sync-dot"></span> Cloud Connected';
      topbar.insertBefore(syncDiv, topbar.lastElementChild);
    }

    // Pull latest data from Firestore to LocalStorage (Initial Sync)
    // We only do this if local storage is empty for this user (first login on this device)
    const isPulled = localStorage.getItem('erp_pulled_' + user.uid);
    if (!isPulled) {
      console.log('Pulling data from Firestore for the first time...');
      const snap = await db.collection('users').doc(user.uid).collection('erp_data').get();
      
      if (!snap.empty) {
        // Clear local storage to prevent mixing
        Object.keys(ERP.config.collections).forEach(c => localStorage.removeItem(ERP.config.dbName + '_' + c));
        
        // Save cloud data to local
        snap.forEach(doc => {
          const data = doc.data();
          const col = doc.id.split('_')[0]; // Extract collection name
          const arr = JSON.parse(localStorage.getItem(ERP.config.dbName + '_' + col) || '[]');
          arr.push(data);
          localStorage.setItem(ERP.config.dbName + '_' + col, JSON.stringify(arr));
        });
        localStorage.setItem('erp_pulled_' + user.uid, 'true');
        window.location.reload(); // Reload to apply data
      } else {
        localStorage.setItem('erp_pulled_' + user.uid, 'true');
      }
    }

  } else {
    // User is signed out
    overlay.style.display = 'flex';
    console.log('User signed out');
  }
});

// Handle Logout (Add button to settings if needed, or just run in console: firebase.auth().signOut())
window.logoutFirebase = function() {
  auth.signOut();
  localStorage.removeItem('erp_pulled_' + (auth.currentUser?.uid || ''));
  window.location.reload();
};

toast('Firebase Cloud Sync Enabled');

})();
</script>
