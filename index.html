            ${Math.abs(totalDr - totalCr) < 0.01 ? '✓ Trial Balance is perfectly balanced.' : '✗ Out of balance by ' + money(Math.abs(totalDr - totalCr))}
          </td>
        </tr>
      `;
    }, 100);
  });

  __LS_registerAction('print-tb', () => {
    const html = document.getElementById('tb-table').outerHTML;
    printReport('Trial Balance', html);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. PROFIT & LOSS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('rpt-pnl', 'Profit & Loss', async () => {
    return `
      <div class="card">
        <div class="card-head">
          <h3>📈 Profit & Loss</h3>
          <button class="btn primary" data-action="print-pnl">🖨 Print</button>
        </div>
        <div id="pnl-body" style="padding:20px;"></div>
      </div>
    `;
  });

  __LS_register('part8-pnl-bind', () => {
    setTimeout(() => {
      const host = document.getElementById('pnl-body');
      if (!host) return;

      let incRows = '', expRows = '';
      let totalInc = 0, totalExp = 0;

      // Income (Cr - Dr)
      state.data.coa.filter(a => a.type === 'income').forEach(acc => {
        const bal = -getBalance(acc.id); // Income is credit normal
        if (bal === 0) return;
        totalInc += bal;
        incRows += `<tr><td>${esc(acc.name)}</td><td class="num">${money(bal)}</td></tr>`;
      });

      // Expenses (Dr - Cr)
      state.data.coa.filter(a => a.type === 'expense').forEach(acc => {
        const bal = getBalance(acc.id); // Expense is debit normal
        if (bal === 0) return;
        totalExp += bal;
        expRows += `<tr><td>${esc(acc.name)}</td><td class="num">${money(bal)}</td></tr>`;
      });

      const netProfit = totalInc - totalExp;

      host.innerHTML = `
        <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Income</div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          ${incRows || '<tr><td class="muted">No income recorded</td><td></td></tr>'}
          <tr style="font-weight:bold; border-top:1px solid var(--border);"><td>Total Income</td><td class="num" style="color:var(--green);">${money(totalInc)}</td></tr>
        </table>

        <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Expenses</div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          ${expRows || '<tr><td class="muted">No expenses recorded</td><td></td></tr>'}
          <tr style="font-weight:bold; border-top:1px solid var(--border);"><td>Total Expenses</td><td class="num" style="color:var(--red);">${money(totalExp)}</td></tr>
        </table>

        <div style="display:flex; justify-content:space-between; padding:16px; background:var(--surface-2); border-radius:8px; font-size:20px; font-weight:bold;">
          <span>Net Profit</span>
          <span style="color:${netProfit >= 0 ? 'var(--green)' : 'var(--red)'}">${money(netProfit)}</span>
        </div>
      `;
    }, 100);
  });

  __LS_registerAction('print-pnl', () => {
    const html = document.getElementById('pnl-body').innerHTML;
    printReport('Profit & Loss', html);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. BALANCE SHEET
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('rpt-bs', 'Balance Sheet', async () => {
    return `
      <div class="card">
        <div class="card-head">
          <h3>🏛️ Balance Sheet</h3>
          <button class="btn primary" data-action="print-bs">🖨 Print</button>
        </div>
        <div id="bs-body" style="padding:20px;"></div>
      </div>
    `;
  });

  __LS_register('part8-bs-bind', () => {
    setTimeout(() => {
      const host = document.getElementById('bs-body');
      if (!host) return;

      let assetRows = '', liabRows = '', eqRows = '';
      let totalAssets = 0, totalLiab = 0, totalEq = 0;

      // Assets (Dr - Cr)
      state.data.coa.filter(a => a.type === 'asset').forEach(acc => {
        const bal = getBalance(acc.id);
        if (Math.abs(bal) < 0.01) return;
        totalAssets += bal;
        assetRows += `<tr><td>${esc(acc.name)}</td><td class="num">${money(bal)}</td></tr>`;
      });

      // Liabilities (Cr - Dr)
      state.data.coa.filter(a => a.type === 'liability').forEach(acc => {
        const bal = -getBalance(acc.id);
        if (Math.abs(bal) < 0.01) return;
        totalLiab += bal;
        liabRows += `<tr><td>${esc(acc.name)}</td><td class="num">${money(bal)}</td></tr>`;
      });

      // Equity (Cr - Dr)
      state.data.coa.filter(a => a.type === 'equity').forEach(acc => {
        const bal = -getBalance(acc.id);
        if (Math.abs(bal) < 0.01) return;
        totalEq += bal;
        eqRows += `<tr><td>${esc(acc.name)}</td><td class="num">${money(bal)}</td></tr>`;
      });

      // Calculate Net Profit (Current Year Earnings) to add to Equity
      let totalInc = 0, totalExp = 0;
      state.data.coa.filter(a => a.type === 'income').forEach(acc => totalInc += -getBalance(acc.id));
      state.data.coa.filter(a => a.type === 'expense').forEach(acc => totalExp += getBalance(acc.id));
      const netProfit = totalInc - totalExp;
      totalEq += netProfit;

      host.innerHTML = `
        <div class="grid g2" style="display:grid; grid-template-columns:1fr 1fr; gap:40px;">
          <div>
            <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Assets</div>
            <table style="width:100%; border-collapse:collapse;">
              ${assetRows || '<tr><td class="muted">No assets</td><td></td></tr>'}
              <tr style="font-weight:bold; border-top:2px solid var(--border);"><td>Total Assets</td><td class="num" style="color:var(--accent);">${money(totalAssets)}</td></tr>
            </table>
          </div>
          
          <div>
            <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Liabilities & Equity</div>
            <table style="width:100%; border-collapse:collapse;">
              <tr><td colspan="2" style="font-weight:bold; padding-top:10px; color:var(--text-3);">Liabilities</td></tr>
              ${liabRows || '<tr><td class="muted">No liabilities</td><td></td></tr>'}
              <tr style="font-weight:bold;"><td>Total Liabilities</td><td class="num">${money(totalLiab)}</td></tr>
              
              <tr><td colspan="2" style="font-weight:bold; padding-top:16px; color:var(--text-3);">Equity</td></tr>
              ${eqRows}
              <tr><td>Retained Earnings (Current)</td><td class="num">${money(netProfit)}</td></tr>
              <tr style="font-weight:bold;"><td>Total Equity</td><td class="num">${money(totalEq)}</td></tr>
              
              <tr style="font-weight:bold; border-top:2px solid var(--border); font-size:16px;">
                <td>Total Liabilities & Equity</td>
                <td class="num" style="color:var(--accent);">${money(totalLiab + totalEq)}</td>
              </tr>
            </table>
          </div>
        </div>
        
        <div style="text-align:center; margin-top:30px; padding:12px; border-radius:8px; font-weight:bold; background:${Math.abs(totalAssets - (totalLiab + totalEq)) < 0.01 ? 'var(--green-soft)' : 'var(--red-soft)'}; color:${Math.abs(totalAssets - (totalLiab + totalEq)) < 0.01 ? 'var(--green)' : 'var(--red)'};">
          ${Math.abs(totalAssets - (totalLiab + totalEq)) < 0.01 ? '✓ Balance Sheet is perfectly balanced.' : '✗ Out of balance by ' + money(Math.abs(totalAssets - (totalLiab + totalEq)))}
        </div>
      `;
    }, 100);
  });

  __LS_registerAction('print-bs', () => {
    const html = document.getElementById('bs-body').innerHTML;
    printReport('Balance Sheet', html);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 5. CASH FLOW STATEMENT
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('rpt-cf', 'Cash Flow', async () => {
    return `
      <div class="card">
        <div class="card-head">
          <h3>💸 Cash Flow Statement</h3>
          <button class="btn primary" data-action="print-cf">🖨 Print</button>
        </div>
        <div id="cf-body" style="padding:20px;"></div>
      </div>
    `;
  });

  __LS_register('part8-cf-bind', () => {
    setTimeout(() => {
      const host = document.getElementById('cf-body');
      if (!host) return;

      // Find all Cash/Bank accounts
      const cashAccs = state.data.coa.filter(a => ['1000','1010','1020'].includes(a.code));
      const cashIds = cashAccs.map(a => a.id);

      let opIn = 0, opOut = 0, invIn = 0, invOut = 0, finIn = 0, finOut = 0;

      state.data.journalEntries.forEach(je => {
        // Check if this entry touches cash
        const cashLines = je.lines.filter(l => cashIds.includes(l.accountId));
        if (!cashLines.length) return;

        let cashNet = 0;
        cashLines.forEach(l => cashNet += (l.debit - l.credit));
        if (Math.abs(cashNet) < 0.01) return;

        // Categorize based on the *other* accounts
        const otherLines = je.lines.filter(l => !cashIds.includes(l.accountId));
        const otherCodes = otherLines.map(l => {
           const acc = state.data.coa.find(a => a.id === l.accountId);
           return acc ? acc.code : '';
        });

        let cat = 'Operating';
        if (otherCodes.some(c => c.startsWith('15') || c.startsWith('16'))) cat = 'Investing';
        if (otherCodes.some(c => c.startsWith('2') || c === '3000' || c === '3200')) cat = 'Financing';

        if (cashNet > 0) {
          if (cat === 'Operating') opIn += cashNet;
          if (cat === 'Investing') invIn += cashNet;
          if (cat === 'Financing') finIn += cashNet;
        } else {
          if (cat === 'Operating') opOut += -cashNet;
          if (cat === 'Investing') invOut += -cashNet;
          if (cat === 'Financing') finOut += -cashNet;
        }
      });

      const opNet = opIn - opOut;
      const invNet = invIn - invOut;
      const finNet = finIn - finOut;
      const totalNet = opNet + invNet + finNet;

      host.innerHTML = `
        <div style="max-width:600px; margin:0 auto;">
          <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Operating Activities</div>
          <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
            <tr><td>Cash received from customers</td><td class="num">${money(opIn)}</td></tr>
            <tr><td>Cash paid to suppliers & staff</td><td class="num">(${money(opOut)})</td></tr>
            <tr style="font-weight:bold; border-top:1px solid var(--border);"><td>Net Cash from Operations</td><td class="num">${money(opNet)}</td></tr>
          </table>

          <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Investing Activities</div>
          <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
            <tr><td>Purchase of fixed assets</td><td class="num">(${money(invOut)})</td></tr>
            <tr><td>Sale of fixed assets</td><td class="num">${money(invIn)}</td></tr>
            <tr style="font-weight:bold; border-top:1px solid var(--border);"><td>Net Cash from Investing</td><td class="num">${money(invNet)}</td></tr>
          </table>

          <div class="section" style="font-weight:bold; font-size:16px; color:var(--text);">Financing Activities</div>
          <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
            <tr><td>Capital introduced / loans</td><td class="num">${money(finIn)}</td></tr>
            <tr><td>Drawings / loan repayments</td><td class="num">(${money(finOut)})</td></tr>
            <tr style="font-weight:bold; border-top:1px solid var(--border);"><td>Net Cash from Financing</td><td class="num">${money(finNet)}</td></tr>
          </table>

          <div style="display:flex; justify-content:space-between; padding:16px; background:var(--accent-soft); color:var(--accent-text); border-radius:8px; font-size:18px; font-weight:bold;">
            <span>Net Increase / (Decrease) in Cash</span>
            <span>${money(totalNet)}</span>
          </div>
        </div>
      `;
    }, 100);
  });

  __LS_registerAction('print-cf', () => {
    const html = document.getElementById('cf-body').innerHTML;
    printReport('Cash Flow Statement', html);
  });

})();
</script>
<!-- =====================================================================
     PART 9 — PURCHASES & SUPPLIER MANAGEMENT
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Purchases', id: 'purchase-orders', ico: '📝', label: 'Purchase Orders' });
  __LS_addNav({ group: 'Purchases', id: 'grns', ico: '📦', label: 'Goods Received' });
  __LS_addNav({ group: 'Purchases', id: 'purchase-invoices', ico: '🧾', label: 'Purchase Invoices' });

  // Ensure collections exist
  if (!state.data.purchaseOrders) state.data.purchaseOrders = [];
  if (!state.data.grns) state.data.grns = [];
  if (!state.data.purchaseInvoices) state.data.purchaseInvoices = [];
  if (!state.data.supplierPayments) state.data.supplierPayments = [];

  // Ensure necessary CoA accounts exist
  function ensurePurchaseAccounts() {
    const req = [
      { code: '1200', name: 'Raw Materials', type: 'asset' },
      { code: '2100', name: 'Accrued Expenses', type: 'liability' },
      { code: '2000', name: 'Accounts Payable', type: 'liability' }
    ];
    req.forEach(r => {
      if (!state.data.coa.find(a => a.code === r.code)) {
        const acc = { id: uid(), code: r.code, name: r.name, type: r.type, isGroup: false, active: true };
        state.data.coa.push(acc);
        dbPut('coa', acc);
      }
    });
  }

  // Helper for stock
  function getStock(itemId) {
    let qty = 0;
    (state.data.stockMoves || []).forEach(m => { if (m.itemId === itemId) qty += num(m.qty); });
    return qty;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 2. PURCHASE ORDERS (PO)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('purchase-orders', 'Purchase Orders', async () => {
    const list = [...state.data.purchaseOrders].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(po => {
      const sup = state.data.parties.find(p => p.id === po.supplierId);
      return `
        <tr>
          <td class="mono"><strong>${esc(po.number)}</strong></td>
          <td>${dateFmt(po.date)}</td>
          <td>${sup ? esc(sup.name) : 'Unknown'}</td>
          <td class="num">${money(po.total)}</td>
          <td><span class="badge ${po.status === 'received' ? 'green' : 'amber'}">${po.status.toUpperCase()}</span></td>
          <td class="actions-cell">
            ${po.status === 'pending' ? `<button class="btn sm primary" data-action="po-receive" data-id="${po.id}">Receive Stock</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>📝 Purchase Orders</h3>
          <button class="btn primary" data-action="po-new">＋ New PO</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>PO #</th><th>Date</th><th>Supplier</th><th class="num">Total</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-3)">No purchase orders.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('po-new', () => {
    const suppliers = state.data.parties.filter(p => p.type === 'supplier' || p.type === 'both');
    const rmItems = state.data.items.filter(i => i.type === 'main');

    openModal('Create Purchase Order', `
      <div class="field">
        <label>Supplier</label>
        <select id="po-sup">
          <option value="">— Select Supplier —</option>
          ${suppliers.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      
      <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Items</label>
        <input type="text" id="po-search" placeholder="Search raw materials..." style="padding:8px; border:1px solid var(--border); border-radius:6px; width:100%; margin-bottom:8px;">
        
        <table style="width:100%; font-size:13px;">
          <thead><tr><th style="text-align:left; padding:8px 0;">Material</th><th style="text-align:right;">Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody id="po-body"></tbody>
        </table>
      </div>
      <div style="margin-top:16px; text-align:right; font-weight:bold; font-size:16px;">
        PO Total: <span id="po-total">Rs 0.00</span>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="po-save">Save PO</button>`
    });

    const tbody = document.getElementById('po-body');
    let lines = {};

    function render() {
      const q = document.getElementById('po-search').value.toLowerCase();
      const list = rmItems.filter(i => i.name.toLowerCase().includes(q));
      
      tbody.innerHTML = list.map(item => `
        <tr>
          <td style="padding:8px 0;">${esc(item.name)}</td>
          <td style="text-align:right;"><input type="number" class="po-qty" data-id="${item.id}" value="${lines[item.id]?.qty || ''}" style="width:60px; padding:4px; text-align:right; border:1px solid var(--border);"></td>
          <td style="text-align:right;"><input type="number" class="po-rate" data-id="${item.id}" value="${lines[item.id]?.rate || item.cost || ''}" style="width:80px; padding:4px; text-align:right; border:1px solid var(--border);"></td>
          <td style="text-align:right; font-weight:bold;" class="po-line-total">Rs 0.00</td>
        </tr>
      `).join('');

      document.querySelectorAll('.po-qty, .po-rate').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          const qty = num(document.querySelector(`.po-qty[data-id="${id}"]`).value);
          const rate = num(document.querySelector(`.po-rate[data-id="${id}"]`).value);
          if (!lines[id]) lines[id] = { qty: 0, rate: 0 };
          lines[id].qty = qty;
          lines[id].rate = rate;
          calc();
        };
      });
    }

    function calc() {
      let total = 0;
      tbody.querySelectorAll('tr').forEach(r => {
        const qty = num(r.querySelector('.po-qty').value);
        const rate = num(r.querySelector('.po-rate').value);
        const lineTot = qty * rate;
        total += lineTot;
        r.querySelector('.po-line-total').textContent = money(lineTot);
      });
      document.getElementById('po-total').textContent = money(total);
    }

    document.getElementById('po-search').oninput = render;
    render();

    document.getElementById('po-save').onclick = async () => {
      const supId = document.getElementById('po-sup').value;
      if (!supId) return toast('Select a supplier', 'error');
      
      const validLines = Object.keys(lines).filter(id => lines[id].qty > 0).map(id => ({
        itemId: id, qty: lines[id].qty, rate: lines[id].rate
      }));

      if (!validLines.length) return toast('Add at least one item', 'error');

      const total = validLines.reduce((s,l) => s + (l.qty * l.rate), 0);
      const po = {
        id: uid(),
        number: 'PO-' + Date.now().toString().slice(-4),
        date: today(),
        supplierId: supId,
        lines: validLines,
        total,
        status: 'pending'
      };

      state.data.purchaseOrders.push(po);
      await dbPut('purchaseOrders', po);
      closeModal();
      handleRoute();
      toast('PO Created', 'success');
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. GOODS RECEIVED (GRN)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('grns', 'Goods Received', async () => {
    const list = [...state.data.grns].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(g => {
      const sup = state.data.parties.find(p => p.id === g.supplierId);
      return `
        <tr>
          <td class="mono"><strong>${esc(g.number)}</strong></td>
          <td>${dateFmt(g.date)}</td>
          <td>${sup ? esc(sup.name) : '—'}</td>
          <td class="num">${money(g.total)}</td>
          <td><button class="btn sm primary" data-action="grn-invoice" data-id="${g.id}">Create Invoice</button></td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>📦 Goods Received Notes</h3>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>GRN #</th><th>Date</th><th>Supplier</th><th class="num">Total Value</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">No GRNs recorded.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('po-receive', (ev, poId) => {
    const po = state.data.purchaseOrders.find(p => p.id === poId);
    if (!po) return;
    receiveStock(po);
  });

  function receiveStock(po) {
    ensurePurchaseAccounts();
    
    openModal('Receive Stock (GRN)', `
      <div class="field"><label>Date Received</label><input type="date" id="grn-date" value="${today()}"></div>
      
      <div style="margin-top:16px;">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Items Received</label>
        <table style="width:100%; font-size:13px;">
          <thead><tr><th style="text-align:left; padding:8px 0;">Material</th><th style="text-align:right;">Ordered</th><th style="text-align:right;">Received Qty</th><th style="text-align:right;">Rate</th></tr></thead>
          <tbody id="grn-body"></tbody>
        </table>
      </div>
      <div style="margin-top:16px; text-align:right; font-weight:bold; font-size:16px;">
        Total Value: <span id="grn-total">Rs 0.00</span>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="grn-save">Post GRN</button>`
    });

    const tbody = document.getElementById('grn-body');
    let receivedLines = po.lines.map(l => ({ ...l, receivedQty: l.qty }));

    tbody.innerHTML = receivedLines.map((l, i) => {
      const item = state.data.items.find(x => x.id === l.itemId);
      return `
        <tr>
          <td style="padding:8px 0;">${esc(item.name)}</td>
          <td style="text-align:right;">${l.qty}</td>
          <td style="text-align:right;"><input type="number" class="grn-qty" data-idx="${i}" value="${l.receivedQty}" style="width:70px; padding:4px; text-align:right; border:1px solid var(--border);"></td>
          <td style="text-align:right;">${money(l.rate)}</td>
        </tr>
      `;
    }).join('');

    document.querySelectorAll('.grn-qty').forEach(inp => {
      inp.oninput = (e) => {
        const idx = num(e.target.dataset.idx);
        receivedLines[idx].receivedQty = num(e.target.value);
        calc();
      };
    });

    function calc() {
      let total = 0;
      receivedLines.forEach(l => total += (l.receivedQty * l.rate));
      document.getElementById('grn-total').textContent = money(total);
    }
    calc();

    document.getElementById('grn-save').onclick = async () => {
      const date = document.getElementById('grn-date').value;
      const validLines = receivedLines.filter(l => l.receivedQty > 0);
      if (!validLines.length) return toast('No items received', 'error');

      const total = validLines.reduce((s,l) => s + (l.receivedQty * l.rate), 0);
      const grn = {
        id: uid(),
        number: 'GRN-' + Date.now().toString().slice(-4),
        date: date,
        supplierId: po.supplierId,
        poId: po.id,
        lines: validLines,
        total: total,
        status: 'pending_invoice'
      };

      try {
        // 1. Post Ledger: Dr Raw Materials / Cr Accrued Payables
        const rmAcc = state.data.coa.find(a => a.code === '1200');
        const accAcc = state.data.coa.find(a => a.code === '2100');

        await ERP.ledger.post({
          date: grn.date,
          narration: `GRN ${grn.number} for PO ${po.number}`,
          lines: [
            { accountId: rmAcc.id, debit: total, credit: 0 },
            { accountId: accAcc.id, debit: 0, credit: total }
          ]
        });

        // 2. Add Stock
        for (const l of validLines) {
          const move = { id: uid(), itemId: l.itemId, qty: l.receivedQty, type: 'purchase', ref: grn.number };
          state.data.stockMoves.push(move);
          await dbPut('stockMoves', move);
        }

        // 3. Save GRN
        state.data.grns.push(grn);
        await dbPut('grns', grn);

        // 4. Update PO Status
        po.status = 'received';
        await dbPut('purchaseOrders', po);

        closeModal();
        handleRoute();
        toast('Stock Received & Accrued', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 4. PURCHASE INVOICES
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('purchase-invoices', 'Purchase Invoices', async () => {
    const list = [...state.data.purchaseInvoices].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(inv => {
      const sup = state.data.parties.find(p => p.id === inv.supplierId);
      return `
        <tr>
          <td class="mono"><strong>${esc(inv.number)}</strong></td>
          <td>${dateFmt(inv.date)}</td>
          <td>${sup ? esc(sup.name) : '—'}</td>
          <td class="num">${money(inv.total)}</td>
          <td class="num" style="color:var(--red)">${money(inv.balance)}</td>
          <td><span class="badge ${inv.status === 'paid' ? 'green' : 'red'}">${inv.status.toUpperCase()}</span></td>
          <td class="actions-cell">
            ${inv.balance > 0 ? `<button class="btn sm primary" data-action="inv-pay-supplier" data-id="${inv.id}">Pay</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>🧾 Purchase Invoices</h3>
          <button class="btn primary" data-action="pi-new">＋ New Invoice</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Inv #</th><th>Date</th><th>Supplier</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--text-3)">No purchase invoices.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('grn-invoice', (ev, grnId) => {
    const grn = state.data.grns.find(g => g.id === grnId);
    if (!grn) return;
    createPurchaseInvoice(grn);
  });

  __LS_registerAction('pi-new', () => {
    const grns = state.data.grns.filter(g => g.status === 'pending_invoice');
    if (!grns.length) return toast('No pending GRNs to invoice. Create a direct invoice if needed.', 'warn');
    createPurchaseInvoice(null, grns[0]); // Just open the first pending for simplicity
  });

  function createPurchaseInvoice(grn) {
    ensurePurchaseAccounts();
    const suppliers = state.data.parties.filter(p => p.type === 'supplier' || p.type === 'both');
    
    const isFromGRN = !!grn;
    const defaultSupId = grn ? grn.supplierId : '';
    
    openModal('Create Purchase Invoice', `
      ${isFromGRN ? `<div style="padding:12px; background:var(--blue-soft); color:var(--blue); border-radius:6px; margin-bottom:16px;">Linked to GRN: <strong>${esc(grn.number)}</strong></div>` : ''}
      
      <div class="field">
        <label>Supplier</label>
        <select id="pi-sup" ${isFromGRN ? 'disabled' : ''}>
          <option value="">— Select Supplier —</option>
          ${suppliers.map(s => `<option value="${s.id}" ${defaultSupId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      
      <div class="field"><label>Invoice Date</label><input type="date" id="pi-date" value="${today()}"></div>
      
      ${isFromGRN ? `
        <div style="margin-top:16px;">
          <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Billed Items (from GRN)</label>
          <table style="width:100%; font-size:13px;">
            <thead><tr><th style="text-align:left; padding:8px 0;">Material</th><th style="text-align:right;">Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Total</th></tr></thead>
            <tbody>
              ${grn.lines.map(l => {
                const item = state.data.items.find(x => x.id === l.itemId);
                return `<tr><td style="padding:4px 0;">${esc(item.name)}</td><td style="text-align:right;">${l.receivedQty}</td><td style="text-align:right;">${money(l.rate)}</td><td style="text-align:right; font-weight:bold;">${money(l.receivedQty * l.rate)}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div style="margin-top:16px; text-align:right; font-weight:bold; font-size:16px;">
          Total Invoice: <span id="pi-total">${money(grn.total)}</span>
        </div>
      ` : `
        <div class="field"><label>Total Amount</label><input type="number" id="pi-total-input" placeholder="0.00"></div>
      `}
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="pi-save">Post Invoice</button>`
    });

    document.getElementById('pi-save').onclick = async () => {
      const supId = isFromGRN ? grn.supplierId : document.getElementById('pi-sup').value;
      const date = document.getElementById('pi-date').value;
      const total = isFromGRN ? grn.total : num(document.getElementById('pi-total-input').value);
      
      if (!supId || total <= 0) return toast('Fill all fields.', 'error');

      const inv = {
        id: uid(),
        number: 'PI-' + Date.now().toString().slice(-4),
        date: date,
        supplierId: supId,
        grnId: isFromGRN ? grn.id : null,
        total: total,
        balance: total,
        status: 'unpaid'
      };

      try {
        // Post Ledger
        const debitCode = isFromGRN ? '2100' : '1200'; // If from GRN, clear accrual. If direct, hit RM.
        const debitAcc = state.data.coa.find(a => a.code === debitCode);
        const apAcc = state.data.coa.find(a => a.code === '2000');

        await ERP.ledger.post({
          date: inv.date,
          narration: `Purchase Invoice ${inv.number}`,
          lines: [
            { accountId: debitAcc.id, debit: total, credit: 0 },
            { accountId: apAcc.id, debit: 0, credit: total }
          ]
        });

        state.data.purchaseInvoices.push(inv);
        await dbPut('purchaseInvoices', inv);

        if (isFromGRN) {
          grn.status = 'invoiced';
          await dbPut('grns', grn);
        }

        closeModal();
        handleRoute();
        toast('Invoice Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 5. SUPPLIER PAYMENTS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('inv-pay-supplier', (ev, invId) => {
    const inv = state.data.purchaseInvoices.find(i => i.id === invId);
    if (!inv) return;
    openSupplierPaymentForm(inv);
  });

  function openSupplierPaymentForm(inv) {
    ensurePurchaseAccounts();
    const suppliers = state.data.parties.filter(p => p.type === 'supplier' || p.type === 'both');
    
    openModal('Pay Supplier', `
      <div class="field">
        <label>Supplier</label>
        <select id="sp-sup" disabled>
          ${suppliers.map(s => `<option value="${s.id}" ${inv.supplierId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      
      <div class="field"><label>Amount to Pay</label><input type="number" id="sp-amt" value="${inv.balance}"></div>
      
      <div class="field">
        <label>Paid From</label>
        <select id="sp-source">
          <option value="1000">Cash in Hand</option>
          <option value="1020">Bank Account</option>
        </select>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="sp-save">Post Payment</button>`
    });

    document.getElementById('sp-save').onclick = async () => {
      const amt = num(document.getElementById('sp-amt').value);
      const sourceCode = document.getElementById('sp-source').value;
      
      if (amt <= 0 || amt > inv.balance) return toast('Invalid payment amount.', 'error');

      const apAcc = state.data.coa.find(a => a.code === '2000');
      const cashAcc = state.data.coa.find(a => a.code === sourceCode);

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `Payment for Invoice ${inv.number}`,
          lines: [
            { accountId: apAcc.id, debit: amt, credit: 0 },
            { accountId: cashAcc.id, debit: 0, credit: amt }
          ]
        });

        inv.balance -= amt;
        if (inv.balance <= 0.01) inv.status = 'paid';
        else inv.status = 'partial';
        await dbPut('purchaseInvoices', inv);

        const payment = {
          id: uid(),
          number: 'SP-' + Date.now().toString().slice(-4),
          date: today(),
          invoiceId: inv.id,
          amount: amt,
          source: sourceCode
        };
        state.data.supplierPayments.push(payment);
        await dbPut('supplierPayments', payment);

        closeModal();
        handleRoute();
        toast('Payment Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

})();
</script>
<!-- =====================================================================
     PART 10 — DASHBOARD, SETTINGS & BACKUP (THE FINAL MODULE)
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'System', id: 'settings', ico: '⚙️', label: 'System Settings' });
  __LS_addNav({ group: 'System', id: 'backup', ico: '💾', label: 'Backup / Restore' });

  // ═══════════════════════════════════════════════════════════════════════
  // 2. THE LIVE DASHBOARD
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('dashboard', 'Dashboard', async () => {
    // Calculate KPIs
    let cash = 0, bank = 0, ar = 0, ap = 0, wip = 0;
    
    state.data.coa.forEach(acc => {
      const bal = ERP.ledger.getBalance(acc.id);
      if (acc.code === '1000') cash = bal;
      if (acc.code === '1010' || acc.code === '1020') bank += bal;
      if (acc.code === '1100') ar = bal;
      if (acc.code === '2000') ap = -bal;
      if (acc.code === '1220') wip = bal;
    });

    const revenue = -state.data.coa.filter(a => a.type === 'income').reduce((s, a) => s + ERP.ledger.getBalance(a.id), 0);
    const expenses = state.data.coa.filter(a => a.type === 'expense').reduce((s, a) => s + ERP.ledger.getBalance(a.id), 0);
    const profit = revenue - expenses;

    return `
      <div class="kpi-strip">
        <div class="kpi">
          <div class="k-label">Cash & Bank</div>
          <div class="k-value" style="color: var(--green)">${money(cash + bank)}</div>
          <div class="k-sub">Liquid Assets</div>
        </div>
        <div class="kpi">
          <div class="k-label">Accounts Receivable</div>
          <div class="k-value">${money(ar)}</div>
          <div class="k-sub">Owed by customers</div>
        </div>
        <div class="kpi">
          <div class="k-label">Accounts Payable</div>
          <div class="k-value" style="color: var(--red)">${money(ap)}</div>
          <div class="k-sub">Owed to suppliers</div>
        </div>
        <div class="kpi">
          <div class="k-label">WIP Value</div>
          <div class="k-value" style="color: var(--amber)">${money(wip)}</div>
          <div class="k-sub">Active Factory Jobs</div>
        </div>
      </div>

      <div class="kpi-strip">
        <div class="kpi">
          <div class="k-label">Total Revenue</div>
          <div class="k-value">${money(revenue)}</div>
          <div class="k-sub">All time sales</div>
        </div>
        <div class="kpi">
          <div class="k-label">Total Expenses</div>
          <div class="k-value">${money(expenses)}</div>
          <div class="k-sub">Materials, Labour & Overheads</div>
        </div>
        <div class="kpi" style="border: 2px solid var(--accent)">
          <div class="k-label">Net Profit</div>
          <div class="k-value" style="color: ${profit >= 0 ? 'var(--green)' : 'var(--red)'}">${money(profit)}</div>
          <div class="k-sub">Revenue - Expenses</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>🚀 Quick Actions</h3></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn primary" data-nav="jobs">+ New Job</button>
          <button class="btn primary" data-nav="invoices">+ New Sale</button>
          <button class="btn" data-nav="purchase-orders">+ New Purchase</button>
          <button class="btn" data-nav="pettycash">+ Petty Expense</button>
        </div>
      </div>
      
      <div class="card">
        <div class="card-head"><h3>ℹ️ System Status</h3></div>
        <div class="row" style="justify-content:space-between;">
          <div>
             <div class="small muted">User</div>
             <div>${esc(state.user?.email)}</div>
          </div>
          <div>
             <div class="small muted">Database</div>
             <div style="color:var(--green);font-weight:bold;">IndexedDB Connected</div>
          </div>
          <div>
             <div class="small muted">Cloud Sync</div>
             <div style="color:var(--green);font-weight:bold;">Firebase Active</div>
          </div>
        </div>
      </div>
    `;
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. SYSTEM SETTINGS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('settings', 'System Settings', async () => {
    const s = state.settings || {};
    return `
      <div class="card">
        <div class="card-head"><h3>Company Profile</h3></div>
        <div class="field">
          <label>Company Name</label>
          <input type="text" id="set-name" value="${esc(s.companyName || 'Lanka Slipper')}">
        </div>
        <div class="field">
          <label>Address</label>
          <input type="text" id="set-address" value="${esc(s.address || '')}">
        </div>
        <div class="field">
          <label>Currency Symbol</label>
          <input type="text" id="set-currency" value="${esc(s.currencySymbol || 'Rs')}">
        </div>
        <button class="btn primary" id="set-save">Save Settings</button>
      </div>
    `;
  });

  __LS_register('part10-settings-bind', () => {
    setTimeout(() => {
      const btn = document.getElementById('set-save');
      if (btn) {
        btn.onclick = async () => {
          const settings = {
            companyName: document.getElementById('set-name').value,
            address: document.getElementById('set-address').value,
            currencySymbol: document.getElementById('set-currency').value
          };
          state.settings = settings;
          // Save to local DB meta and Firebase (simplified for this demo)
          if (state.firebaseReady && auth.currentUser) {
             firestore.collection('erp_settings').doc('main').set(settings);
          }
          localStorage.setItem('erp_settings', JSON.stringify(settings));
          toast('Settings Saved', 'success');
        };
      }
    }, 100);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. BACKUP & RESTORE
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('backup', 'Backup / Restore', async () => {
    return `
      <div class="card">
        <div class="card-head"><h3>💾 Backup Data</h3></div>
        <p class="muted small" style="margin-bottom:16px;">Downloads a complete JSON file containing all your items, ledgers, jobs, and settings.</p>
        <button class="btn primary" data-action="backup-download">⬇ Download JSON Backup</button>
      </div>

      <div class="card">
        <div class="card-head"><h3>📤 Restore Data</h3></div>
        <p class="muted small" style="margin-bottom:16px;">Warning: This will overwrite all existing data in your browser.</p>
        <input type="file" id="restore-file" accept=".json" style="display:none;" onchange="window.restoreFromJSON(this)">
        <button class="btn danger" onclick="document.getElementById('restore-file').click()">Upload JSON Backup</button>
      </div>

      <div class="card">
        <div class="card-head"><h3>⚠️ Danger Zone</h3></div>
        <p class="muted small" style="margin-bottom:16px;">Wipe the entire database. This cannot be undone.</p>
        <button class="btn danger" data-action="wipe-db">Erase All Data</button>
      </div>
    `;
  });

  __LS_registerAction('backup-download', () => {
    const data = {};
    CONFIG.collections.forEach(col => {
      data[col] = state.data[col] || [];
    });
    data.settings = state.settings || {};

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Lanka_ERP_Backup_${today()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup Downloaded', 'success');
  });

  window.restoreFromJSON = function(input) {
    const file = input.files[0];
    if (!file) return;

    if (!confirm('This will overwrite ALL current data. Are you sure?')) return;

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        
        // Clear existing
        for (const col of CONFIG.collections) {
           const existing = await dbAll(col);
           for (const rec of existing) { await dbRemove(col, rec.id); }
        }

        // Insert new
        for (const col of CONFIG.collections) {
          if (data[col] && Array.isArray(data[col])) {
            for (const rec of data[col]) {
              await dbPut(col, rec, true); // skipCloud
            }
            state.data[col] = data[col];
          }
        }

        if (data.settings) {
          state.settings = data.settings;
          localStorage.setItem('erp_settings', JSON.stringify(data.settings));
        }

        toast('Data Restored! Reloading...', 'success');
        setTimeout(() => location.reload(), 1000);
      } catch (err) {
        toast('Invalid JSON file: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  };

  __LS_registerAction('wipe-db', async () => {
    if (!confirm('⚠️ THIS WILL PERMANENTLY DELETE ALL DATA. Are you absolutely sure?')) return;
    if (!confirm('This is your final warning. Proceed?')) return;

    for (const col of CONFIG.collections) {
      const existing = await dbAll(col);
      for (const rec of existing) { await dbRemove(col, rec.id); }
    }
    localStorage.removeItem('erp_settings');
    toast('Database Wiped. Reloading...', 'success');
    setTimeout(() => location.reload(), 1000);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 5. INITIALIZE (Load Settings on boot)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_register('part10-init', () => {
    try {
      const saved = localStorage.getItem('erp_settings');
      if (saved) state.settings = JSON.parse(saved);
      else state.settings = { companyName: 'Lanka Slipper', currencySymbol: 'Rs' };
    } catch (e) {}
  });

})();
</script>
<!-- =====================================================================
     PART 11 — ADVANCED JOB WORKSPACE & ALLOCATION ENGINE
===================================================================== -->

(function () {
  'use strict';

  // Update navigation to include the new Global Expenses screen
  __LS_addNav({ group: 'Factory', id: 'expenses', ico: '⚡', label: 'Factory Expenses' });

  // Ensure collections exist
  if (!state.data.factoryExpenses) state.data.factoryExpenses = [];

  // ═══════════════════════════════════════════════════════════════════════

  // ═══════════════════════════════════════════════════════════════════════

          <select id="j-cust">

        <div class="field"><label>Target Completion</label><input type="date" id="j-end" value="${new Date(Date.now() + 7 * 86400000).toISOString().slice(0,10)}"></div>
        
        <div class="field"><label>Priority</label>
          <select id="j-priority">
            <option value="Normal">Normal</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="field"><label>Estimated Labour (Rs)</label><input type="number" id="j-est-labour" placeholder="0"></div>
      </div>

      <div class="field"><label>Job Description / Notes</label>
        <textarea id="j-desc" rows="2" placeholder="Any special instructions for the factory floor..."></textarea>
      </div>
      
      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; font-size:14px; margin-bottom:12px; display:block; color:var(--accent);">Products to Manufacture</label>
        
        <input type="text" id="j-item-search" placeholder="Search finished goods..." style="padding:10px; border:1px solid var(--border); border-radius:6px; width:100%; margin-bottom:12px;">
        
        <table style="width:100%; font-size:13px;" id="j-items-table">
          <thead><tr><th style="text-align:left; padding:8px 0;">Article</th><th style="text-align:right;">Target Qty</th></tr></thead>
          <tbody id="j-items-body"></tbody>
        </table>
      </div>
    `, {
      size: 'xl2',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="j-create">Create Job</button>`
    });

    const itemSearch = document.getElementById('j-item-search');
    const itemsBody = document.getElementById('j-items-body');
    let selectedLines = {};

    function renderItems() {
      const q = itemSearch.value.toLowerCase();
      let list = fgItems.filter(i => i.name.toLowerCase().includes(q));
      
      itemsBody.innerHTML = list.map(item => `
        <tr>
          <td style="padding:8px 0;">${esc(item.name)} <div class="small muted mono">${esc(item.code)}</div></td>
          <td style="text-align:right;">
            <input type="number" class="j-qty" data-id="${item.id}" value="${selectedLines[item.id] || ''}" placeholder="0" style="width:80px; padding:6px; text-align:right; border:1px solid var(--border); border-radius:4px;">
          </td>
        </tr>
      `).join('') || '<tr><td colspan="2" class="muted">No items found.</td></tr>';

      document.querySelectorAll('.j-qty').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          const val = num(e.target.value);
          if (val > 0) selectedLines[id] = val;
          else delete selectedLines[id];
        };
      });
    }

    itemSearch.oninput = renderItems;
    renderItems();

    document.getElementById('j-create').onclick = async () => {
      const lines = Object.keys(selectedLines).map(id => ({ itemId: id, qty: selectedLines[id] }));
      if (!lines.length) return toast('Add at least one product.', 'error');

      const job = {
        id: uid(),
        number: 'JOB-' + Date.now().toString().slice(-4),
        title: document.getElementById('j-title').value.trim() || 'Production Run',
        date: today(),
        startDate: document.getElementById('j-start').value,
        targetDate: document.getElementById('j-end').value,
        priority: document.getElementById('j-priority').value,
        estLabour: num(document.getElementById('j-est-labour').value),
        description: document.getElementById('j-desc').value.trim(),
        customerId: document.getElementById('j-cust').value || null,
        lines: lines,
        status: 'in_progress'
      };

      state.data.jobs.push(job);
      await dbPut('jobs', job);
      closeModal();
      handleRoute();
      toast('Job Created Successfully', 'success');
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 2. THE JOB WORKSPACE (Clicking a Job)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('job-workspace', 'Job Workspace', async (ctx) => {
    const jobId = ctx.params.id;
    const job = state.data.jobs.find(j => j.id === jobId);
    if (!job) return '<div class="card">Job not found.</div>';

    // Calculate Actual Costs by scanning Journal Entries for this jobId
    let actualMat = 0, actualLab = 0, actualOh = 0;
    const transactions = [];

    state.data.journalEntries.forEach(je => {
      je.lines.forEach(l => {
        if (l.jobId === job.id) {
          if (l.accountCode === '1200') actualMat += l.debit; // WIP
          if (l.accountCode === '5020') actualLab += l.debit; // Labour
          if (l.accountCode === '5030') actualOh += l.debit;  // Overhead
          
          // Capture for the table
          const acc = state.data.coa.find(a => a.id === l.accountId);
          transactions.push({
            date: je.date,
            narration: je.narration,
            account: acc ? acc.name : 'Unknown',
            amount: l.debit
          });
        }
      });
    });

    const totalActual = actualMat + actualLab + actualOh;
    const customer = state.data.parties.find(p => p.id === job.customerId);

    let txRows = transactions.map(t => `
      <tr>
        <td>${dateFmt(t.date)}</td>
        <td>${esc(t.narration)}</td>
        <td>${esc(t.account)}</td>
        <td class="num">${money(t.amount)}</td>
      </tr>
    `).join('');

    return `
      <div class="page-head" style="margin-bottom:20px;">
        <div>
          <div class="page-title">${esc(job.number)}: ${esc(job.title)}</div>
          <div class="page-sub">${customer ? esc(customer.name) : 'Internal Stock'} · Priority: <span class="badge ${job.priority === 'Urgent' ? 'red' : job.priority === 'High' ? 'amber' : 'blue'}">${esc(job.priority)}</span></div>
        </div>
        <div class="page-actions">
          <button class="btn" data-nav="jobs">← Back to Jobs</button>
          ${job.status !== 'completed' ? `<button class="btn primary" data-action="job-complete-adv" data-id="${job.id}">✅ Complete Job</button>` : ''}
        </div>
      </div>

      <div class="kpi-strip">
        <div class="kpi"><div class="k-label">Total Actual Cost</div><div class="k-value" style="color:var(--accent)">${money(totalActual)}</div></div>
        <div class="kpi"><div class="k-label">Materials Used</div><div class="k-value">${money(actualMat)}</div></div>
        <div class="kpi"><div class="k-label">Direct Labour</div><div class="k-value">${money(actualLab)}</div></div>
        <div class="kpi"><div class="k-label">Overheads</div><div class="k-value">${money(actualOh)}</div></div>
      </div>

      <div class="grid g2">
        <!-- LEFT: Job Details & Actions -->
        <div>
          <div class="card">
            <div class="card-head"><h3>Job Details</h3></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:13px;">
              <div><div class="small muted">Start Date</div>${dateFmt(job.startDate)}</div>
              <div><div class="small muted">Target Date</div>${dateFmt(job.targetDate)}</div>
              <div style="grid-column:span 2;"><div class="small muted">Description</div>${esc(job.description) || '—'}</div>
            </div>
            <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
               <div class="small muted" style="margin-bottom:8px;">Target Products</div>
               ${job.lines.map(l => {
                 const itm = state.data.items.find(i => i.id === l.itemId);
                 return `<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;"><span>${esc(itm.name)}</span> <strong>${l.qty} pairs</strong></div>`;
               }).join('')}
            </div>
          </div>

          <div class="card" style="background:var(--surface-2);">
            <div class="card-head"><h3>Quick Actions</h3></div>
            <div style="display:grid; gap:10px;">
              <button class="btn" style="justify-content:flex-start; padding:12px;" data-action="job-issue-mat" data-id="${job.id}">📦 Issue Raw Materials</button>
              <button class="btn" style="justify-content:flex-start; padding:12px;" data-action="job-add-labour" data-id="${job.id}">👷 Add Direct Labour</button>
              <button class="btn" style="justify-content:flex-start; padding:12px;" data-action="job-add-oh" data-id="${job.id}">⚡ Add Overhead</button>
            </div>
          </div>
        </div>

        <!-- RIGHT: Transaction Log -->
        <div class="card">
          <div class="card-head"><h3>Transaction Log</h3></div>
          <div class="table-wrap" style="max-height:500px; overflow:auto;">
            <table>
              <thead><tr><th>Date</th><th>Narration</th><th>Type</th><th class="num">Amount</th></tr></thead>
              <tbody>${txRows || '<tr><td colspan="4" class="muted">No transactions recorded for this job.</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  });

  // Update the router to handle #/job-workspace/:id
  const origHandleRoute = window.handleRoute;
  window.handleRoute = async function() {
    const path = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const parts = path.split('/');
    
    if (parts[0] === 'job-workspace' && parts[1]) {
      state.view = path;
      const view = document.getElementById('view');
      view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">Loading Workspace...</div>';
      const html = await __LS_REGISTRY.routes['job-workspace'].fn({ params: { id: parts[1] } });
      view.innerHTML = html;
      document.getElementById('pageTitle').textContent = 'Job Workspace';
      return;
    }
    origHandleRoute();
  };

  // Redirect manage button to workspace
  __LS_registerAction('job-manage', (ev, id) => {
    location.hash = '#/job-workspace/' + id;
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. ADD OVERHEAD / LABOUR TO SPECIFIC JOB
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-add-labour', (ev, jobId) => {
    addJobCost(jobId, 'labour');
  });
  __LS_registerAction('job-add-oh', (ev, jobId) => {
    addJobCost(jobId, 'overhead');
  });

  function addJobCost(jobId, type) {
    const isLabour = type === 'labour';
    
    openModal(isLabour ? 'Add Direct Labour' : 'Add Factory Overhead', `
      <div class="field"><label>Description</label><input id="jc-desc" placeholder="${isLabour ? 'e.g. Stitching wages' : 'e.g. Electricity bill'}"></div>
      <div class="field"><label>Amount (Rs)</label><input type="number" id="jc-amt" placeholder="0.00"></div>
      
      <div style="margin-top:16px; padding:12px; background:var(--surface-2); border-radius:6px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> WIP</div>
        <div><strong>Cr:</strong> Cash/Bank (or Expense account)</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="jc-save">Post</button>`
    });

    document.getElementById('jc-save').onclick = async () => {
      const amt = num(document.getElementById('jc-amt').value);
      const desc = document.getElementById('jc-desc').value.trim();
      if (amt <= 0) return toast('Enter amount', 'error');

      const wipAcc = state.data.coa.find(a => a.code === '1220'); // WIP
      const crAccCode = isLabour ? '1000' : '5030'; // Cash for labour, Overhead account for OH
      const crAcc = state.data.coa.find(a => a.code === crAccCode);

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `${isLabour ? 'Labour' : 'Overhead'}: ${desc}`,
          lines: [
            { accountId: wipAcc.id, debit: amt, credit: 0, jobId: jobId },
            { accountId: crAcc.id, debit: 0, credit: amt, jobId: jobId }
          ]
        });
        closeModal();
        handleRoute(); // Refresh the workspace
        toast('Cost Added', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 4. GLOBAL FACTORY EXPENSES (ALLOCATION ENGINE)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('expenses', 'Factory Expenses', async () => {
    const list = [...state.data.factoryExpenses].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(e => `
      <tr>
        <td>${dateFmt(e.date)}</td>
        <td><strong>${esc(e.description)}</strong></td>
        <td>${esc(e.category)}</td>
        <td class="num">${money(e.amount)}</td>
        <td>
          ${e.jobId ? `<span class="badge blue">Allocated to Job</span>` : `<span class="badge gray">General Overhead</span>`}
        </td>
      </tr>
    `).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>⚡ Global Factory Expenses</h3>
          <button class="btn primary" data-action="global-expense-new">＋ Record Expense</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th>Allocation</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">No expenses recorded.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('global-expense-new', () => {
    const activeJobs = state.data.jobs.filter(j => j.status === 'in_progress');
    const expenseAccs = state.data.coa.filter(a => a.type === 'expense');

    openModal('Record & Allocate Expense', `
      <div class="field"><label>Description</label><input id="ge-desc" placeholder="e.g. Monthly Electricity Bill"></div>
      <div class="field"><label>Total Amount (Rs)</label><input type="number" id="ge-amt" placeholder="0.00"></div>
      <div class="field">
        <label>Expense Category (GL Account)</label>
        <select id="ge-cat">
          ${expenseAccs.map(a => `<option value="${a.id}">${esc(a.code)} - ${esc(a.name)}</option>`).join('')}
        </select>
      </div>

      <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Job Allocation</label>
        <select id="ge-alloc-type" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); margin-bottom:12px;">
          <option value="none">General Overhead (No specific job)</option>
          <option value="single">Assign 100% to one job</option>
          <option value="split">Split across multiple jobs (%)</option>
        </select>
        
        <div id="ge-single" style="display:none;">
          <select id="ge-job-single" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
            ${activeJobs.map(j => `<option value="${j.id}">${esc(j.number)} - ${esc(j.title)}</option>`).join('')}
          </select>
        </div>

        <div id="ge-split" style="display:none; background:var(--surface-2); padding:12px; border-radius:6px;">
          ${activeJobs.map(j => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span style="font-size:13px;">${esc(j.number)}</span>
              <input type="number" class="ge-split-pct" data-id="${j.id}" placeholder="%" style="width:60px; padding:4px; text-align:right; border:1px solid var(--border); border-radius:4px;">
            </div>
          `).join('')}
        </div>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="ge-save">Post Expense</button>`
    });

    document.getElementById('ge-alloc-type').onchange = (e) => {
      document.getElementById('ge-single').style.display = e.target.value === 'single' ? 'block' : 'none';
      document.getElementById('ge-split').style.display = e.target.value === 'split' ? 'block' : 'none';
    };

    document.getElementById('ge-save').onclick = async () => {
      const amt = num(document.getElementById('ge-amt').value);
      const desc = document.getElementById('ge-desc').value.trim();
      const expAccId = document.getElementById('ge-cat').value;
      const allocType = document.getElementById('ge-alloc-type').value;
      
      if (amt <= 0) return toast('Enter amount', 'error');

      const wipAcc = state.data.coa.find(a => a.code === '1220');
      const crAcc = state.data.coa.find(a => a.id === expAccId);

      const glLines = [];
      const expenseRecord = { id: uid(), date: today(), description: desc, amount: amt, category: crAcc.name };

      if (allocType === 'none') {
        // Dr Overhead / Cr Cash (Simplified: Dr Expense / Cr Cash)
        glLines.push({ accountId: crAcc.id, debit: amt, credit: 0 });
        glLines.push({ accountId: state.data.coa.find(a=>a.code==='1000').id, debit: 0, credit: amt });
        expenseRecord.jobId = null;
      } 
      else if (allocType === 'single') {
        const jobId = document.getElementById('ge-job-single').value;
        // Dr WIP / Cr Cash
        glLines.push({ accountId: wipAcc.id, debit: amt, credit: 0, jobId: jobId });
        glLines.push({ accountId: state.data.coa.find(a=>a.code==='1000').id, debit: 0, credit: amt });
        expenseRecord.jobId = jobId;
      } 
      else {
        // Split
        let totalPct = 0;
        const splits = [];
        document.querySelectorAll('.ge-split-pct').forEach(inp => {
          const pct = num(inp.value);
          if (pct > 0) {
            totalPct += pct;
            splits.push({ jobId: inp.dataset.id, amt: (amt * pct) / 100 });
          }
        });

        if (Math.abs(totalPct - 100) > 0.1) return toast('Percentages must equal 100%', 'error');

        splits.forEach(s => {
          glLines.push({ accountId: wipAcc.id, debit: s.amt, credit: 0, jobId: s.jobId });
        });
        glLines.push({ accountId: state.data.coa.find(a=>a.code==='1000').id, debit: 0, credit: amt });
        expenseRecord.jobId = 'SPLIT';
      }

      try {
        await ERP.ledger.post({
          date: expenseRecord.date,
          narration: `Expense: ${desc}`,
          lines: glLines
        });
        
        state.data.factoryExpenses.push(expenseRecord);
        await dbPut('factoryExpenses', expenseRecord);

        closeModal();
        handleRoute();
        toast('Expense Allocated & Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 5. COMPLETE JOB (Upgraded logic)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-complete-adv', (ev, jobId) => {
    const job = state.data.jobs.find(j => j.id === jobId);
    if (!job) return;

    // Calculate total cost by looking at WIP lines tagged to this job
    let totalWip = 0;
    state.data.journalEntries.forEach(je => {
      je.lines.forEach(l => {
        if (l.jobId === jobId && l.accountCode === '1220') totalWip += l.debit;
      });
    });

    const totalTargetQty = job.lines.reduce((s, l) => s + l.qty, 0);
    const costPerUnit = totalTargetQty > 0 ? totalWip / totalTargetQty : 0;

    openModal('Complete Job Production', `
      <p class="muted" style="margin-bottom:16px;">This will calculate the final cost per unit, update the Item Master, and move stock to Finished Goods.</p>
      
      <div class="kpi-strip">
        <div class="kpi"><div class="k-label">Total WIP Cost</div><div class="k-value">${money(totalWip)}</div></div>
        <div class="kpi"><div class="k-label">Total Units</div><div class="k-value">${totalTargetQty}</div></div>
        <div class="kpi" style="border-color:var(--green)"><div class="k-label">Cost Per Unit</div><div class="k-value" style="color:var(--green)">${money(costPerUnit)}</div></div>
      </div>

      <div class="field"><label>Confirm Produced Quantity</label><input type="number" id="c-qty" value="${totalTargetQty}"></div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="c-save" data-job="${jobId}" data-cost="${costPerUnit}">Complete & Transfer</button>`
    });

    document.getElementById('c-save').onclick = async (e) => {
      const qty = num(document.getElementById('c-qty').value);
      const unitCost = num(e.target.dataset.cost);
      
      const wipAccount = state.data.coa.find(a => a.code === '1220');
      const fgAccount = state.data.coa.find(a => a.code === '1230');
      const finalValue = qty * unitCost;

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `Production Completion for Job ${job.number}`,
          lines: [
            { accountId: fgAccount.id, debit: finalValue, credit: 0 },
            { accountId: wipAccount.id, debit: 0, credit: finalValue, jobId: job.id }
          ]
        });

        for (const line of job.lines) {
          const item = state.data.items.find(i => i.id === line.itemId);
          if (item) {
             item.cost = unitCost; 
             await dbPut('items', item);
          }
          const move = { id: uid(), itemId: line.itemId, qty: line.qty, type: 'production', jobId: job.id };
          state.data.stockMoves.push(move);
          await dbPut('stockMoves', move);
        }

        job.status = 'completed';
        await dbPut('jobs', job);

        closeModal();
        handleRoute();
        toast('Job Completed. Stock transferred to FG.', 'success');
      } catch (err) { toast(err.message, 'error'); }
    };
  });

})();
</script>
</body>
</html>
