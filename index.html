<!-- =====================================================================
     PART 4 — JOB COSTING & FACTORY PRODUCTION
===================================================================== -->
<script>
(function () {
  'use strict';

  // Register the new navigation item
  __LS_addNav({ group: 'Factory', id: 'jobs', ico: '🏭', label: 'Job Costing' });

  // Ensure we have a stockMoves collection for tracking physical inventory
  if (!state.data.stockMoves) state.data.stockMoves = [];

  // Helper to get current stock of an item
  function getStock(itemId) {
    let qty = 0;
    state.data.stockMoves.forEach(m => {
      if (m.itemId === itemId) qty += num(m.qty);
    });
    return qty;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 1. JOB MASTER LIST
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('jobs', 'Job Costing', async () => {
    const jobs = [...(state.data.jobs || [])].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = jobs.map(j => {
      const customer = state.data.parties.find(p => p.id === j.customerId);
      const totalCost = state.data.journalEntries
        .filter(je => je.jobId === j.id && je.lines.some(l => l.accountCode === '1220')) // Summing Dr to WIP
        .reduce((sum, je) => sum + (je.lines.find(l => l.accountCode === '1220')?.debit || 0), 0);

      return `
        <tr>
          <td class="mono"><strong>${esc(j.number)}</strong></td>
          <td>${esc(j.date)}</td>
          <td>${customer ? esc(customer.name) : 'Internal Stock'}</td>
          <td>${j.lines.map(l => {
             const itm = state.data.items.find(i => i.id === l.itemId);
             return `${l.qty}x ${itm ? itm.name : 'Unknown'}`;
          }).join('<br>')}</td>
          <td class="num">${money(totalCost)}</td>
          <td><span class="badge ${j.status === 'completed' ? 'green' : 'amber'}">${j.status.toUpperCase()}</span></td>
          <td class="actions-cell">
            ${j.status !== 'completed' ? `<button class="btn sm primary" data-action="job-manage" data-id="${j.id}">Manage</button>` : ''}
            <button class="btn sm" data-action="job-view" data-id="${j.id}">Details</button>
          </td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>🏭 Production Jobs</h3>
          <button class="btn primary" data-action="job-new">＋ New Job</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Job #</th><th>Date</th><th>Customer</th><th>Products</th><th class="num">WIP Cost</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--text-3)">No jobs yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 2. CREATE JOB (With Searchable Item Selection)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-new', () => {
    const customers = state.data.parties.filter(p => p.type === 'customer' || p.type === 'both');
    const fgItems = state.data.items.filter(i => i.type === 'fg' && !i.isParent);

    openModal('Create New Job', `
      <div class="field"><label>Customer (Optional)</label>
        <select id="j-cust">
          <option value="">— Internal Stock Job —</option>
          ${customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      
      <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Products to Manufacture</label>
        
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input type="text" id="j-item-search" placeholder="Search articles..." style="padding:8px; border:1px solid var(--border); border-radius:6px; flex:1;">
          <select id="j-item-cat" style="padding:8px; border:1px solid var(--border); border-radius:6px;">
            <option value="all">All Finished Goods</option>
          </select>
        </div>

        <table style="width:100%; font-size:13px;" id="j-items-table">
          <thead><tr><th style="text-align:left; padding:8px 0;">Article</th><th style="text-align:right;">Target Qty</th><th></th></tr></thead>
          <tbody id="j-items-body"></tbody>
        </table>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="j-create">Create Job</button>`
    });

    const itemSearch = document.getElementById('j-item-search');
    const itemsBody = document.getElementById('j-items-body');
    let selectedLines = {};

    function renderItems() {
      const q = itemSearch.value.toLowerCase();
      let list = fgItems.filter(i => i.name.toLowerCase().includes(q));
      
      itemsBody.innerHTML = list.map(item => `
        <tr>
          <td style="padding:8px 0;">${esc(item.name)} <div class="small muted mono">${esc(item.code)}</div></td>
          <td style="text-align:right;">
            <input type="number" class="j-qty" data-id="${item.id}" value="${selectedLines[item.id] || ''}" placeholder="0" style="width:80px; padding:6px; text-align:right; border:1px solid var(--border); border-radius:4px;">
          </td>
          <td style="width:30px;"></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted">No items found.</td></tr>';

      document.querySelectorAll('.j-qty').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          const val = num(e.target.value);
          if (val > 0) selectedLines[id] = val;
          else delete selectedLines[id];
        };
      });
    }

    itemSearch.oninput = renderItems;
    renderItems();

    document.getElementById('j-create').onclick = async () => {
      const lines = Object.keys(selectedLines).map(id => ({ itemId: id, qty: selectedLines[id] }));
      if (!lines.length) return toast('Add at least one product.', 'error');

      const job = {
        id: uid(),
        number: 'JOB-' + Date.now().toString().slice(-4),
        date: today(),
        customerId: document.getElementById('j-cust').value || null,
        lines: lines,
        status: 'in_progress'
      };

      state.data.jobs.push(job);
      await dbPut('jobs', job);
      closeModal();
      handleRoute();
      toast('Job Created', 'success');
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. MANAGE JOB (Issue Materials, Labour, Complete)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-manage', (ev, id) => {
    const job = state.data.jobs.find(j => j.id === id);
    if (!job) return;

    // Calculate current costs
    const getCost = (type) => {
      return state.data.journalEntries
        .filter(je => je.jobId === job.id && je.narration.includes(type))
        .reduce((sum, je) => sum + (je.lines.find(l => l.accountCode === '1220')?.debit || 0), 0);
    };

    const matCost = getCost('Material Issue');
    const labCost = getCost('Labour');
    const ohCost = getCost('Overhead');
    const totCost = matCost + labCost + ohCost;

    openModal('Manage Job: ' + job.number, `
      <div class="kpi-strip">
        <div class="kpi"><div class="k-label">Material Cost</div><div class="k-value" style="font-size:16px;">${money(matCost)}</div></div>
        <div class="kpi"><div class="k-label">Labour Cost</div><div class="k-value" style="font-size:16px;">${money(labCost)}</div></div>
        <div class="kpi"><div class="k-label">Overhead</div><div class="k-value" style="font-size:16px;">${money(ohCost)}</div></div>
        <div class="kpi" style="border:2px solid var(--accent)"><div class="k-label">Total WIP Cost</div><div class="k-value" style="font-size:16px;color:var(--accent)">${money(totCost)}</div></div>
      </div>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;">
        <button class="btn" style="padding:20px; flex-direction:column; gap:8px;" data-action="job-issue-mat" data-id="${job.id}">
          <span style="font-size:24px;">📦</span> Issue Materials
        </button>
        <button class="btn" style="padding:20px; flex-direction:column; gap:8px;" data-action="job-add-labour" data-id="${job.id}">
          <span style="font-size:24px;">👷</span> Add Labour / Overhead
        </button>
      </div>
      
      <div style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
        <button class="btn primary" style="width:100%; padding:12px;" data-action="job-complete" data-id="${job.id}">✅ Complete Job & Transfer to Finished Goods</button>
      </div>
    `, { size: 'lg', footer: `<button class="btn" data-close-modal>Close</button>` });
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. ISSUE MATERIALS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-issue-mat', (ev, jobId) => {
    const rmItems = state.data.items.filter(i => i.type === 'main');
    
    openModal('Issue Materials to Job', `
      <div class="field">
        <label>Select Material</label>
        <select id="m-item">
          <option value="">— Select Raw Material —</option>
          ${rmItems.map(i => `<option value="${i.id}">${esc(i.name)} (Stock: ${getStock(i.id)})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Quantity</label><input type="number" id="m-qty" placeholder="0"></div>
      <div class="field"><label>Rate (Cost per unit)</label><input type="number" id="m-rate" placeholder="0.00"></div>
      
      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px;">
        <div class="small muted">Ledger Impact:</div>
        <div style="font-weight:bold; margin-top:4px;">Dr: Work In Progress (WIP)</div>
        <div style="font-weight:bold;">Cr: Raw Materials</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="m-save" data-job="${jobId}">Post Issue</button>`
    });

    document.getElementById('m-item').onchange = (e) => {
      const item = state.data.items.find(i => i.id === e.target.value);
      if (item && item.cost) document.getElementById('m-rate').value = item.cost;
    };

    document.getElementById('m-save').onclick = async () => {
      const itemId = document.getElementById('m-item').value;
      const qty = num(document.getElementById('m-qty').value);
      const rate = num(document.getElementById('m-rate').value);
      
      if (!itemId || qty <= 0) return toast('Select item and valid quantity.', 'error');

      const amount = qty * rate;
      const wipAccount = state.data.coa.find(a => a.code === '1220');
      const rmAccount = state.data.coa.find(a => a.code === '1200');

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `Material Issue for Job`,
          jobId: jobId,
          lines: [
            { accountId: wipAccount.id, debit: amount, credit: 0 },
            { accountId: rmAccount.id, debit: 0, credit: amount }
          ]
        });

        // Deduct stock
        const move = { id: uid(), itemId, qty: -qty, type: 'issue', jobId };
        state.data.stockMoves.push(move);
        await dbPut('stockMoves', move);

        closeModal();
        toast('Materials Issued', 'success');
        handleRoute();
        // Re-open manage modal to see updated cost
        setTimeout(() => __LS_REGISTERED.actions['job-manage'](null, jobId), 100);

      } catch (e) { toast(e.message, 'error'); }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 5. ADD LABOUR / OVERHEAD
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-add-labour', (ev, jobId) => {
    openModal('Add Labour / Overhead', `
      <div class="field">
        <label>Type</label>
        <select id="l-type">
          <option value="Labour">Direct Labour (Wages)</option>
          <option value="Overhead">Factory Overhead (Electricity/Rent)</option>
        </select>
      </div>
      <div class="field"><label>Amount (Rs)</label><input type="number" id="l-amt" placeholder="0.00"></div>
      <div class="field"><label>Description</label><input id="l-desc" placeholder="e.g. Stitching wages for Job"></div>

      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px;">
        <div class="small muted">Ledger Impact:</div>
        <div style="font-weight:bold; margin-top:4px;">Dr: Work In Progress (WIP)</div>
        <div style="font-weight:bold;">Cr: Cash / Bank</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="l-save" data-job="${jobId}">Post</button>`
    });

    document.getElementById('l-save').onclick = async () => {
      const type = document.getElementById('l-type').value;
      const amt = num(document.getElementById('l-amt').value);
      const desc = document.getElementById('l-desc').value.trim();
      
      if (amt <= 0) return toast('Enter amount.', 'error');

      const wipAccount = state.data.coa.find(a => a.code === '1220');
      const cashAccount = state.data.coa.find(a => a.code === '1000'); // Assume paid from cash

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `${type}: ${desc}`,
          jobId: jobId,
          lines: [
            { accountId: wipAccount.id, debit: amt, credit: 0 },
            { accountId: cashAccount.id, debit: 0, credit: amt }
          ]
        });

        closeModal();
        toast(`${type} Added`, 'success');
        handleRoute();
        setTimeout(() => __LS_REGISTERED.actions['job-manage'](null, jobId), 100);

      } catch (e) { toast(e.message, 'error'); }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 6. COMPLETE JOB (Auto-Calculate Cost & Move to FG)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-complete', (ev, jobId) => {
    const job = state.data.jobs.find(j => j.id === jobId);
    if (!job) return;

    const totalWip = state.data.journalEntries
      .filter(je => je.jobId === job.id && je.lines.some(l => l.accountCode === '1220'))
      .reduce((sum, je) => sum + (je.lines.find(l => l.accountCode === '1220')?.debit || 0), 0);

    const totalTargetQty = job.lines.reduce((s, l) => s + l.qty, 0);
    const costPerUnit = totalTargetQty > 0 ? totalWip / totalTargetQty : 0;

    openModal('Complete Job Production', `
      <p class="muted" style="margin-bottom:16px;">This will calculate the final cost per unit, update the Item Master, and move stock to Finished Goods.</p>
      
      <div class="kpi-strip">
        <div class="kpi"><div class="k-label">Total WIP Cost</div><div class="k-value">${money(totalWip)}</div></div>
        <div class="kpi"><div class="k-label">Total Units</div><div class="k-value">${totalTargetQty}</div></div>
        <div class="kpi" style="border-color:var(--green)"><div class="k-label">Cost Per Unit</div><div class="k-value" style="color:var(--green)">${money(costPerUnit)}</div></div>
      </div>

      <div class="field"><label>Confirm Produced Quantity</label><input type="number" id="c-qty" value="${totalTargetQty}"></div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="c-save" data-job="${jobId}" data-cost="${costPerUnit}">Complete & Transfer</button>`
    });

    document.getElementById('c-save').onclick = async (e) => {
      const qty = num(document.getElementById('c-qty').value);
      const unitCost = num(e.target.dataset.cost);
      
      const wipAccount = state.data.coa.find(a => a.code === '1220');
      const fgAccount = state.data.coa.find(a => a.code === '1230');
      const finalValue = qty * unitCost;

      try {
        // 1. Post Ledger
        await ERP.ledger.post({
          date: today(),
          narration: `Production Completion for Job`,
          jobId: jobId,
          lines: [
            { accountId: fgAccount.id, debit: finalValue, credit: 0 },
            { accountId: wipAccount.id, debit: 0, credit: finalValue }
          ]
        });

        // 2. Update Items Cost & Stock
        for (const line of job.lines) {
          const item = state.data.items.find(i => i.id === line.itemId);
          if (item) {
             item.cost = unitCost; // Update actual cost
             await dbPut('items', item);
          }
          // Add FG stock
          const move = { id: uid(), itemId: line.itemId, qty: line.qty, type: 'production', jobId };
          state.data.stockMoves.push(move);
          await dbPut('stockMoves', move);
        }

        // 3. Mark Job Complete
        job.status = 'completed';
        await dbPut('jobs', job);

        closeModal();
        toast('Job Completed. Stock transferred to FG.', 'success');
        handleRoute();
      } catch (err) { toast(err.message, 'error'); }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 7. JOB DETAILS (View Cost Sheet)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('job-view', (ev, id) => {
    const job = state.data.jobs.find(j => j.id === id);
    if (!job) return;

    const entries = state.data.journalEntries.filter(je => je.jobId === job.id);
    let rows = entries.map(e => `
      <tr>
        <td>${dateFmt(e.date)}</td>
        <td>${esc(e.narration)}</td>
        <td class="num">${money(e.totalDr)}</td>
      </tr>
    `).join('');

    openModal('Cost Sheet: ' + job.number, `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Description</th><th class="num">Cost</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="3" class="muted">No costs recorded.</td></tr>'}</tbody>
        </table>
      </div>
    `, { size: 'lg', footer: `<button class="btn" data-close-modal>Close</button>` });
  });

})();
</script>
<!-- =====================================================================
     PART 5 — SALES, DELIVERY NOTES, INVOICES & RECEIPTS
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Sales', id: 'deliveries', ico: '🚚', label: 'Delivery Notes' });
  __LS_addNav({ group: 'Sales', id: 'invoices', ico: '🧾', label: 'Sales Invoices' });
  __LS_addNav({ group: 'Sales', id: 'receipts', ico: '💰', label: 'Customer Receipts' });

  // Ensure we have the sales collections
  if (!state.data.deliveries) state.data.deliveries = [];
  if (!state.data.salesInvoices) state.data.salesInvoices = [];
  if (!state.data.receipts) state.data.receipts = [];

  // Helper to get current stock of an FG item
  function getFGStock(itemId) {
    let qty = 0;
    (state.data.stockMoves || []).forEach(m => {
      if (m.itemId === itemId) qty += num(m.qty);
    });
    return qty;
  }

  // Helper to get total unpaid balance for a customer
  function getCustomerBalance(customerId) {
    return (state.data.salesInvoices || [])
      .filter(inv => inv.customerId === customerId && inv.status !== 'paid' && inv.status !== 'cancelled')
      .reduce((sum, inv) => sum + num(inv.balance), 0);
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 2. DELIVERY NOTES (D/N)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('deliveries', 'Delivery Notes', async () => {
    const list = [...state.data.deliveries].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(d => {
      const customer = state.data.parties.find(p => p.id === d.customerId);
      return `
        <tr>
          <td class="mono"><strong>${esc(d.number)}</strong></td>
          <td>${dateFmt(d.date)}</td>
          <td>${customer ? esc(customer.name) : 'Walk-in'}</td>
          <td class="num">${d.lines.reduce((s,l)=>s+l.qty, 0)} Pairs</td>
          <td class="num">${money(d.cogs)}</td>
          <td><span class="badge ${d.status === 'invoiced' ? 'green' : 'amber'}">${d.status.toUpperCase()}</span></td>
          <td class="actions-cell">
            ${d.status !== 'invoiced' ? `<button class="btn sm primary" data-action="dn-to-invoice" data-id="${d.id}">Create Invoice</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>🚚 Delivery Notes</h3>
          <button class="btn primary" data-action="dn-new">＋ New Delivery</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>D/N #</th><th>Date</th><th>Customer</th><th class="num">Qty</th><th class="num">COGS Value</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--text-3)">No deliveries yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('dn-new', () => {
    const customers = state.data.parties.filter(p => p.type === 'customer' || p.type === 'both');
    const fgItems = state.data.items.filter(i => i.type === 'fg' && !i.isParent && getFGStock(i.id) > 0);

    openModal('Create Delivery Note', `
      <div class="field">
        <label>Customer</label>
        <select id="dn-cust">
          <option value="">— Select Customer —</option>
          ${customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      
      <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Items to Dispatch</label>
        <input type="text" id="dn-search" placeholder="Search finished goods..." style="padding:8px; border:1px solid var(--border); border-radius:6px; width:100%; margin-bottom:8px;">
        
        <table style="width:100%; font-size:13px;" id="dn-table">
          <thead><tr><th style="text-align:left; padding:8px 0;">Article</th><th style="text-align:right;">In Stock</th><th style="text-align:right;">Qty to Deliver</th></tr></thead>
          <tbody id="dn-body"></tbody>
        </table>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="dn-save">Post Delivery</button>`
    });

    const search = document.getElementById('dn-search');
    const tbody = document.getElementById('dn-body');
    let selectedLines = {};

    function renderItems() {
      const q = search.value.toLowerCase();
      let list = fgItems.filter(i => i.name.toLowerCase().includes(q));
      
      tbody.innerHTML = list.map(item => `
        <tr>
          <td style="padding:8px 0;">${esc(item.name)} <div class="small muted mono">${esc(item.code)}</div></td>
          <td style="text-align:right; font-weight:600; color:var(--accent);">${getFGStock(item.id)}</td>
          <td style="text-align:right;">
            <input type="number" class="dn-qty" data-id="${item.id}" value="${selectedLines[item.id] || ''}" placeholder="0" style="width:80px; padding:6px; text-align:right; border:1px solid var(--border); border-radius:4px;" max="${getFGStock(item.id)}">
          </td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted">No stock available.</td></tr>';

      document.querySelectorAll('.dn-qty').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          let val = num(e.target.value);
          const max = getFGStock(id);
          if (val > max) { val = max; e.target.value = max; toast('Cannot exceed available stock.', 'warn'); }
          
          if (val > 0) selectedLines[id] = val;
          else delete selectedLines[id];
        };
      });
    }

    search.oninput = renderItems;
    renderItems();

    document.getElementById('dn-save').onclick = async () => {
      const custId = document.getElementById('dn-cust').value;
      const lines = Object.keys(selectedLines).map(id => ({ itemId: id, qty: selectedLines[id] }));
      
      if (!custId) return toast('Select a customer.', 'error');
      if (!lines.length) return toast('Add at least one item.', 'error');

      let totalCOGS = 0;
      const processedLines = lines.map(l => {
        const item = state.data.items.find(i => i.id === l.itemId);
        const cost = num(item.cost);
        totalCOGS += (l.qty * cost);
        return { ...l, cost };
      });

      const dn = {
        id: uid(),
        number: 'DN-' + Date.now().toString().slice(-4),
        date: today(),
        customerId: custId,
        lines: processedLines,
        cogs: totalCOGS,
        status: 'pending'
      };

      try {
        // Ledger: Dr COGS / Cr Finished Goods
        const cogsAcc = state.data.coa.find(a => a.code === '5000');
        const fgAcc = state.data.coa.find(a => a.code === '1230');
        
        await ERP.ledger.post({
          date: dn.date,
          narration: `COGS for Delivery ${dn.number}`,
          lines: [
            { accountId: cogsAcc.id, debit: totalCOGS, credit: 0 },
            { accountId: fgAcc.id, debit: 0, credit: totalCOGS }
          ]
        });

        // Deduct Stock
        for (const l of processedLines) {
          const move = { id: uid(), itemId: l.itemId, qty: -l.qty, type: 'delivery', ref: dn.number };
          state.data.stockMoves.push(move);
          await dbPut('stockMoves', move);
        }

        state.data.deliveries.push(dn);
        await dbPut('deliveries', dn);

        closeModal();
        handleRoute();
        toast('Delivery Note Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  });

  __LS_registerAction('dn-to-invoice', (ev, dnId) => {
    // Jump to invoice creation, passing the D/N ID
    const dn = state.data.deliveries.find(d => d.id === dnId);
    if (dn) openInvoiceForm(dn);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. SALES INVOICES
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('invoices', 'Sales Invoices', async () => {
    const list = [...state.data.salesInvoices].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(inv => {
      const customer = state.data.parties.find(p => p.id === inv.customerId);
      return `
        <tr>
          <td class="mono"><strong>${esc(inv.number)}</strong></td>
          <td>${dateFmt(inv.date)}</td>
          <td>${customer ? esc(customer.name) : 'Walk-in'}</td>
          <td class="num">${money(inv.total)}</td>
          <td class="num" style="color:var(--red)">${money(inv.balance)}</td>
          <td><span class="badge ${inv.status === 'paid' ? 'green' : inv.status === 'partial' ? 'amber' : 'red'}">${inv.status.toUpperCase()}</span></td>
          <td class="actions-cell">
            ${inv.balance > 0 ? `<button class="btn sm primary" data-action="inv-pay" data-id="${inv.id}">Receive Payment</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>🧾 Sales Invoices</h3>
          <button class="btn primary" data-action="inv-new">＋ New Invoice</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--text-3)">No invoices yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  function openInvoiceForm(dn) {
    const customers = state.data.parties.filter(p => p.type === 'customer' || p.type === 'both');
    const fgItems = state.data.items.filter(i => i.type === 'fg' && !i.isParent);
    
    // If from DN, prefill
    const isFromDN = !!dn;
    
    openModal('Create Sales Invoice', `
      ${isFromDN ? `<div style="padding:12px; background:var(--blue-soft); color:var(--blue); border-radius:6px; margin-bottom:16px;">Linked to Delivery Note: <strong>${esc(dn.number)}</strong></div>` : ''}
      
      <div class="field">
        <label>Customer</label>
        <select id="inv-cust" ${isFromDN ? 'disabled' : ''}>
          ${customers.map(c => `<option value="${c.id}" ${isFromDN && dn.customerId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>

      <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; font-size:13px; margin-bottom:8px; display:block;">Invoice Lines</label>
        ${!isFromDN ? `<input type="text" id="inv-search" placeholder="Search finished goods..." style="padding:8px; border:1px solid var(--border); border-radius:6px; width:100%; margin-bottom:8px;">` : ''}
        
        <table style="width:100%; font-size:13px;">
          <thead><tr><th style="text-align:left; padding:8px 0;">Article</th><th style="text-align:right;">Qty</th><th style="text-align:right;">Selling Price</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody id="inv-body"></tbody>
        </table>
      </div>
      
      <div style="margin-top:16px; padding:12px; background:var(--surface-2); border-radius:6px; display:flex; justify-content:space-between; font-weight:bold; font-size:16px;">
        <span>Total Invoice Amount:</span>
        <span id="inv-total">Rs 0.00</span>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="inv-save">Post Invoice</button>`
    });

    const tbody = document.getElementById('inv-body');
    let selectedLines = {};

    if (isFromDN) {
      dn.lines.forEach(l => {
        const item = state.data.items.find(i => i.id === l.itemId);
        selectedLines[l.itemId] = { qty: l.qty, price: item.price || 0 };
      });
    }

    function renderItems() {
      const searchEl = document.getElementById('inv-search');
      const q = searchEl ? searchEl.value.toLowerCase() : '';
      let list = fgItems.filter(i => i.name.toLowerCase().includes(q));
      
      let html = '';
      if (isFromDN) {
        // Only render items in the DN
        html = dn.lines.map(l => {
          const item = state.data.items.find(i => i.id === l.itemId);
          const row = selectedLines[l.itemId];
          return `
            <tr>
              <td style="padding:8px 0;">${esc(item.name)}</td>
              <td style="text-align:right;">${row.qty}</td>
              <td style="text-align:right;"><input type="number" class="inv-price" data-id="${item.id}" value="${row.price}" style="width:90px; padding:4px; text-align:right; border:1px solid var(--border);"></td>
              <td style="text-align:right; font-weight:bold;" class="inv-line-total">Rs 0.00</td>
            </tr>
          `;
        }).join('');
      } else {
        html = list.map(item => `
          <tr>
            <td style="padding:8px 0;">${esc(item.name)}</td>
            <td style="text-align:right;">
              <input type="number" class="inv-qty" data-id="${item.id}" value="${selectedLines[item.id]?.qty || ''}" placeholder="0" style="width:60px; padding:4px; text-align:right; border:1px solid var(--border);">
            </td>
            <td style="text-align:right;">
              <input type="number" class="inv-price" data-id="${item.id}" value="${item.price || ''}" placeholder="0" style="width:90px; padding:4px; text-align:right; border:1px solid var(--border);">
            </td>
            <td style="text-align:right; font-weight:bold;" class="inv-line-total">Rs 0.00</td>
          </tr>
        `).join('');
      }
      
      tbody.innerHTML = html || '<tr><td colspan="4" class="muted">No items.</td></tr>';
      bindInputs();
    }

    function bindInputs() {
      document.querySelectorAll('.inv-qty').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          const qty = num(e.target.value);
          const price = num(document.querySelector(`.inv-price[data-id="${id}"]`).value);
          if (!selectedLines[id]) selectedLines[id] = { qty: 0, price: 0 };
          selectedLines[id].qty = qty;
          selectedLines[id].price = price;
          calcTotal();
        };
      });

      document.querySelectorAll('.inv-price').forEach(inp => {
        inp.oninput = (e) => {
          const id = e.target.dataset.id;
          const price = num(e.target.value);
          if (!selectedLines[id]) selectedLines[id] = { qty: 0, price: 0 };
          selectedLines[id].price = price;
          if (isFromDN) selectedLines[id].qty = dn.lines.find(l => l.itemId === id).qty;
          calcTotal();
        };
      });
    }

    function calcTotal() {
      let total = 0;
      const rows = tbody.querySelectorAll('tr');
      rows.forEach(r => {
        const qtyInp = r.querySelector('.inv-qty');
        const priceInp = r.querySelector('.inv-price');
        if (qtyInp && priceInp) {
          const totalCell = r.querySelector('.inv-line-total');
          const lineTot = num(qtyInp.value) * num(priceInp.value);
          total += lineTot;
          if (totalCell) totalCell.textContent = money(lineTot);
        }
      });
      document.getElementById('inv-total').textContent = money(total);
    }

    if (!isFromDN) {
      document.getElementById('inv-search').oninput = renderItems;
    }
    renderItems();
    setTimeout(calcTotal, 100);

    document.getElementById('inv-save').onclick = async () => {
      const custId = document.getElementById('inv-cust').value;
      if (!custId) return toast('Select customer.', 'error');

      const lines = Object.keys(selectedLines)
        .filter(id => selectedLines[id].qty > 0)
        .map(id => ({ itemId: id, qty: selectedLines[id].qty, price: selectedLines[id].price }));
      
      if (!lines.length) return toast('Add at least one item.', 'error');

      const total = lines.reduce((s, l) => s + (l.qty * l.price), 0);
      const customer = state.data.parties.find(p => p.id === custId);
      
      // Credit Limit Check
      const currentBal = getCustomerBalance(custId);
      if (customer.creditLimit > 0 && (currentBal + total) > customer.creditLimit) {
        return toast(`Credit limit exceeded! Limit: ${money(customer.creditLimit)}, Owed: ${money(currentBal)}.`, 'error');
      }

      const inv = {
        id: uid(),
        number: 'INV-' + Date.now().toString().slice(-4),
        date: today(),
        customerId: custId,
        lines: lines,
        total: total,
        balance: total,
        status: 'unpaid',
        dnId: isFromDN ? dn.id : null
      };

      try {
        // Ledger: Dr Accounts Receivable / Cr Sales
        const arAcc = state.data.coa.find(a => a.code === '1100');
        const salesAcc = state.data.coa.find(a => a.code === '4000');
        
        await ERP.ledger.post({
          date: inv.date,
          narration: `Sales Invoice ${inv.number}`,
          lines: [
            { accountId: arAcc.id, debit: total, credit: 0 },
            { accountId: salesAcc.id, debit: 0, credit: total }
          ]
        });

        state.data.salesInvoices.push(inv);
        await dbPut('salesInvoices', inv);

        if (isFromDN) {
          dn.status = 'invoiced';
          await dbPut('deliveries', dn);
        }

        closeModal();
        handleRoute();
        toast('Invoice Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

  __LS_registerAction('inv-new', () => openInvoiceForm(null));

  // ═══════════════════════════════════════════════════════════════════════
  // 4. CUSTOMER RECEIPTS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('receipts', 'Customer Receipts', async () => {
    const list = [...state.data.receipts].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = list.map(r => {
      const customer = state.data.parties.find(p => p.id === r.customerId);
      return `
        <tr>
          <td class="mono"><strong>${esc(r.number)}</strong></td>
          <td>${dateFmt(r.date)}</td>
          <td>${customer ? esc(customer.name) : '—'}</td>
          <td>${esc(r.method)}</td>
          <td class="num">${money(r.amount)}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>💰 Customer Receipts</h3>
          <button class="btn primary" data-action="rec-new">＋ New Receipt</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Receipt #</th><th>Date</th><th>Customer</th><th>Method</th><th class="num">Amount</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">No receipts yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('inv-pay', (ev, invId) => openReceiptForm(invId));
  __LS_registerAction('rec-new', () => openReceiptForm(null));

  function openReceiptForm(invoiceId) {
    const customers = state.data.parties.filter(p => p.type === 'customer' || p.type === 'both');
    const inv = invoiceId ? state.data.salesInvoices.find(i => i.id === invoiceId) : null;

    openModal('Record Customer Receipt', `
      <div class="field">
        <label>Customer</label>
        <select id="rec-cust" ${inv ? 'disabled' : ''}>
          ${customers.map(c => `<option value="${c.id}" ${inv && inv.customerId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Amount Received (Rs)</label><input type="number" id="rec-amt" value="${inv ? inv.balance : ''}"></div>
      <div class="field">
        <label>Method</label>
        <select id="rec-method">
          <option value="Cash">Cash</option>
          <option value="Bank">Bank Transfer</option>
          <option value="Cheque">Cheque</option>
        </select>
      </div>
      ${inv ? `<div class="small muted" style="margin-top:8px;">Paying against Invoice: ${esc(inv.number)}</div>` : ''}
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="rec-save">Post Receipt</button>`
    });

    document.getElementById('rec-save').onclick = async () => {
      const custId = document.getElementById('rec-cust').value;
      const amount = num(document.getElementById('rec-amt').value);
      const method = document.getElementById('rec-method').value;
      
      if (!custId || amount <= 0) return toast('Fill all fields correctly.', 'error');

      try {
        const cashAccCode = method === 'Cash' ? '1000' : '1010';
        const cashAcc = state.data.coa.find(a => a.code === cashAccCode);
        const arAcc = state.data.coa.find(a => a.code === '1100');

        await ERP.ledger.post({
          date: today(),
          narration: `Receipt from customer`,
          lines: [
            { accountId: cashAcc.id, debit: amount, credit: 0 },
            { accountId: arAcc.id, debit: 0, credit: amount }
          ]
        });

        const rec = {
          id: uid(),
          number: 'REC-' + Date.now().toString().slice(-4),
          date: today(),
          customerId: custId,
          amount: amount,
          method: method,
          invoiceId: inv ? inv.id : null
        };
        state.data.receipts.push(rec);
        await dbPut('receipts', rec);

        // Update Invoice balance
        if (inv) {
          inv.balance -= amount;
          if (inv.balance <= 0.01) inv.status = 'paid';
          else inv.status = 'partial';
          await dbPut('salesInvoices', inv);
        } else {
          // If no specific invoice, allocate FIFO
          let remaining = amount;
          const unpaid = state.data.salesInvoices.filter(i => i.customerId === custId && i.balance > 0).sort((a,b)=>a.date.localeCompare(b.date));
          for (const ui of unpaid) {
             if (remaining <= 0) break;
             const pay = Math.min(remaining, ui.balance);
             ui.balance -= pay;
             ui.status = ui.balance <= 0.01 ? 'paid' : 'partial';
             await dbPut('salesInvoices', ui);
             remaining -= pay;
          }
        }

        closeModal();
        handleRoute();
        toast('Receipt Posted', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  }

})();
</script>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Banking', id: 'banks', ico: '🏦', label: 'Bank Accounts' });
  __LS_addNav({ group: 'Banking', id: 'pdc', ico: '📜', label: 'PDC Register' });
  __LS_addNav({ group: 'Banking', id: 'pettycash', ico: '💵', label: 'Petty Cash' });

  // Ensure collections exist
  if (!state.data.banks) state.data.banks = [];
  if (!state.data.pdc) state.data.pdc = [];

  // Helper to get account balance from ledger
  function getAccountBalance(code) {
    const acc = state.data.coa.find(a => a.code === code);
    if (!acc) return 0;
    return ERP.ledger.getBalance(acc.id);
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 2. BANK MASTER
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('banks', 'Bank Accounts', async () => {
    const list = state.data.banks;
    
    let rows = list.map(b => {
      const bal = getAccountBalance(b.coaCode || '1010');
      return `
        <tr>
          <td><strong>${esc(b.name)}</strong></td>
          <td>${esc(b.accountNo)}</td>
          <td>${esc(b.branch)}</td>
          <td class="num" style="font-weight:bold; color:var(--accent);">${money(bal)}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>🏦 Bank Accounts</h3>
          <button class="btn primary" data-action="bank-new">＋ Add Bank</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Bank Name</th><th>Account No</th><th>Branch</th><th class="num">Ledger Balance</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:var(--text-3)">No banks added yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('bank-new', () => {
    openModal('Add Bank Account', `
      <div class="field"><label>Bank Name</label><input id="b-name" placeholder="e.g. Sampath Bank"></div>
      <div class="field"><label>Account Number</label><input id="b-acc" placeholder="e.g. 123456789"></div>
      <div class="field"><label>Branch</label><input id="b-branch" placeholder="e.g. Colombo Fort"></div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="b-save">Save</button>`
    });

    document.getElementById('b-save').onclick = async () => {
      const name = document.getElementById('b-name').value.trim();
      const accountNo = document.getElementById('b-acc').value.trim();
      const branch = document.getElementById('b-branch').value.trim();

      if (!name) return toast('Name is required', 'error');

      const bank = { id: uid(), name, accountNo, branch };
      state.data.banks.push(bank);
      await dbPut('banks', bank);
      
      closeModal();
      handleRoute();
      toast('Bank added', 'success');
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. PETTY CASH (Strict Source Account Required)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('pettycash', 'Petty Cash', async () => {
    const pettyAcc = state.data.coa.find(a => a.code === '1010'); // Assuming Petty Cash
    const balance = pettyAcc ? ERP.ledger.getBalance(pettyAcc.id) : 0;

    // Get history of petty cash
    const entries = state.data.journalEntries.filter(je => 
      je.lines.some(l => l.accountId === pettyAcc?.id)
    ).sort((a,b) => b.date.localeCompare(a.date));

    let rows = entries.map(e => {
      const line = e.lines.find(l => l.accountId === pettyAcc?.id);
      const isTopUp = line.debit > 0;
      return `
        <tr>
          <td>${dateFmt(e.date)}</td>
          <td>${esc(e.narration)}</td>
          <td class="num" style="color:${isTopUp ? 'var(--green)' : 'var(--red)'}">${isTopUp ? '+' : '-'} ${money(isTopUp ? line.debit : line.credit)}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="kpi-strip">
        <div class="kpi">
          <div class="k-label">Petty Cash Balance</div>
          <div class="k-value" style="color:var(--accent)">${money(balance)}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>💵 Petty Cash Transactions</h3>
          <div>
            <button class="btn" data-action="pc-topup">⬆️ Top Up</button>
            <button class="btn primary" data-action="pc-pay">💸 Pay Expense</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3" style="text-align:center;color:var(--text-3)">No transactions yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  // TOP UP ACTION (FIXES THE SOURCE ACCOUNT ISSUE)
  __LS_registerAction('pc-topup', () => {
    const sourceAccounts = state.data.coa.filter(a => a.code === '1000' || a.code === '1020'); // Cash in Hand, Bank
    
    openModal('Top Up Petty Cash', `
      <div class="field"><label>Amount (Rs)</label><input type="number" id="pc-amt" placeholder="e.g. 5000"></div>
      
      <div class="field">
        <label>Transfer From (Source Account) <span class="req">*</span></label>
        <select id="pc-source">
          <option value="">— Select Source —</option>
          ${sourceAccounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}
        </select>
      </div>

      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> Petty Cash</div>
        <div><strong>Cr:</strong> Selected Source Account</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="pc-save">Transfer</button>`
    });

    document.getElementById('pc-save').onclick = async () => {
      const amt = num(document.getElementById('pc-amt').value);
      const sourceId = document.getElementById('pc-source').value;
      
      if (amt <= 0 || !sourceId) return toast('Enter amount and select source.', 'error');

      const pettyAcc = state.data.coa.find(a => a.code === '1010');
      
      try {
        await ERP.ledger.post({
          date: today(),
          narration: `Petty Cash Top Up`,
          lines: [
            { accountId: pettyAcc.id, debit: amt, credit: 0 },
            { accountId: sourceId, debit: 0, credit: amt }
          ]
        });
        closeModal();
        handleRoute();
        toast('Petty Cash Topped Up', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  });

  __LS_registerAction('pc-pay', () => {
    const expenseAccounts = state.data.coa.filter(a => a.type === 'expense');
    
    openModal('Pay Petty Cash Expense', `
      <div class="field"><label>Amount (Rs)</label><input type="number" id="pc-amt" placeholder="e.g. 500"></div>
      <div class="field">
        <label>Expense Category</label>
        <select id="pc-exp">
          ${expenseAccounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Description</label><input id="pc-desc" placeholder="e.g. Tea for workers"></div>

      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> Selected Expense Account</div>
        <div><strong>Cr:</strong> Petty Cash</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="pc-save">Pay</button>`
    });

    document.getElementById('pc-save').onclick = async () => {
      const amt = num(document.getElementById('pc-amt').value);
      const expId = document.getElementById('pc-exp').value;
      const desc = document.getElementById('pc-desc').value.trim();

      if (amt <= 0) return toast('Enter amount.', 'error');

      const pettyAcc = state.data.coa.find(a => a.code === '1010');

      try {
        await ERP.ledger.post({
          date: today(),
          narration: `Petty Expense: ${desc}`,
          lines: [
            { accountId: expId, debit: amt, credit: 0 },
            { accountId: pettyAcc.id, debit: 0, credit: amt }
          ]
        });
        closeModal();
        handleRoute();
        toast('Expense Paid', 'success');
      } catch (e) { toast(e.message, 'error'); }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. POST-DATED CHEQUES (PDC)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('pdc', 'PDC Register', async () => {
    const list = [...state.data.pdc].sort((a,b) => a.chequeDate.localeCompare(b.chequeDate));
    
    let rows = list.map(c => {
      const party = state.data.parties.find(p => p.id === c.partyId);
      let statusColor = c.status === 'pending' ? 'amber' : c.status === 'cleared' ? 'green' : 'red';
      let actionBtn = '';
      
      if (c.status === 'pending') {
        actionBtn = `<button class="btn sm primary" data-action="pdc-clear" data-id="${c.id}">Clear</button>`;
      }

      return `
        <tr>
          <td><span class="badge ${c.type === 'received' ? 'green' : 'blue'}">${c.type.toUpperCase()}</span></td>
          <td>${dateFmt(c.chequeDate)}</td>
          <td>${esc(c.chequeNo)}</td>
          <td>${esc(c.bankName)}</td>
          <td>${party ? esc(party.name) : '—'}</td>
          <td class="num">${money(c.amount)}</td>
          <td><span class="badge ${statusColor}">${c.status.toUpperCase()}</span></td>
          <td class="actions-cell">${actionBtn}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>📜 PDC Register</h3>
          <div>
            <button class="btn" data-action="pdc-receive">📥 Receive PDC</button>
            <button class="btn primary" data-action="pdc-issue">📤 Issue PDC</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Cheque Date</th><th>Cheque #</th><th>Bank</th><th>Party</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:var(--text-3)">No PDCs recorded.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('pdc-receive', () => {
    const customers = state.data.parties.filter(p => p.type === 'customer' || p.type === 'both');
    
    openModal('Receive PDC (Customer)', `
      <div class="field"><label>Customer</label>
        <select id="pdc-party">${customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Cheque Date</label><input type="date" id="pdc-date" value="${today()}"></div>
      <div class="field"><label>Bank Name</label><input id="pdc-bank" placeholder="e.g. Sampath Bank"></div>
      <div class="field"><label>Cheque Number</label><input id="pdc-no"></div>
      <div class="field"><label>Amount (Rs)</label><input type="number" id="pdc-amt"></div>

      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> PDC Holding Account</div>
        <div><strong>Cr:</strong> Accounts Receivable</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="pdc-save">Save PDC</button>`
    });

    document.getElementById('pdc-save').onclick = async () => {
      const partyId = document.getElementById('pdc-party').value;
      const date = document.getElementById('pdc-date').value;
      const bankName = document.getElementById('pdc-bank').value.trim();
      const chequeNo = document.getElementById('pdc-no').value.trim();
      const amount = num(document.getElementById('pdc-amt').value);

      if (!amount || !chequeNo) return toast('Fill all fields.', 'error');

      const pdc = { id: uid(), type: 'received', partyId, chequeDate: date, bankName, chequeNo, amount, status: 'pending' };
      state.data.pdc.push(pdc);
      await dbPut('pdc', pdc);

      // Note: We can create a "PDC Holding" COA account if needed. For simplicity, we'll just wait until clearing to hit AR.
      closeModal();
      handleRoute();
      toast('PDC Received', 'success');
    };
  });

  __LS_registerAction('pdc-issue', () => {
    const suppliers = state.data.parties.filter(p => p.type === 'supplier' || p.type === 'both');
    
    openModal('Issue PDC (Supplier)', `
      <div class="field"><label>Supplier</label>
        <select id="pdc-party">${suppliers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Cheque Date</label><input type="date" id="pdc-date" value="${today()}"></div>
      <div class="field"><label>Bank Name</label><input id="pdc-bank" placeholder="e.g. HNB"></div>
      <div class="field"><label>Cheque Number</label><input id="pdc-no"></div>
      <div class="field"><label>Amount (Rs)</label><input type="number" id="pdc-amt"></div>

      <div style="padding:12px; background:var(--surface-2); border-radius:6px; margin-top:16px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> Accounts Payable</div>
        <div><strong>Cr:</strong> PDC Holding Account</div>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="pdc-save">Save PDC</button>`
    });

    document.getElementById('pdc-save').onclick = async () => {
      const partyId = document.getElementById('pdc-party').value;
      const date = document.getElementById('pdc-date').value;
      const bankName = document.getElementById('pdc-bank').value.trim();
      const chequeNo = document.getElementById('pdc-no').value.trim();
      const amount = num(document.getElementById('pdc-amt').value);

      if (!amount || !chequeNo) return toast('Fill all fields.', 'error');

      const pdc = { id: uid(), type: 'issued', partyId, chequeDate: date, bankName, chequeNo, amount, status: 'pending' };
      state.data.pdc.push(pdc);
      await dbPut('pdc', pdc);

      closeModal();
      handleRoute();
      toast('PDC Issued', 'success');
    };
  });

  __LS_registerAction('pdc-clear', async (ev, id) => {
    const pdc = state.data.pdc.find(x => x.id === id);
    if (!pdc) return;

    if (!confirm(`Mark Cheque #${pdc.chequeNo} as CLEARED? This will update the Bank and Ledger.`)) return;

    try {
      const bankAcc = state.data.coa.find(a => a.code === '1020'); // Default Bank
      const arAcc = state.data.coa.find(a => a.code === '1100');
      const apAcc = state.data.coa.find(a => a.code === '2000');

      if (pdc.type === 'received') {
        // Customer cheque cleared -> Bank goes up, AR goes down
        await ERP.ledger.post({
          date: today(),
          narration: `PDC Cleared: ${pdc.chequeNo}`,
          lines: [
            { accountId: bankAcc.id, debit: pdc.amount, credit: 0 },
            { accountId: arAcc.id, debit: 0, credit: pdc.amount }
          ]
        });
      } else {
        // Our cheque cleared -> AP goes down, Bank goes down
        await ERP.ledger.post({
          date: today(),
          narration: `PDC Cleared: ${pdc.chequeNo}`,
          lines: [
            { accountId: apAcc.id, debit: pdc.amount, credit: 0 },
            { accountId: bankAcc.id, debit: 0, credit: pdc.amount }
          ]
        });
      }

      pdc.status = 'cleared';
      await dbPut('pdc', pdc);
      
      handleRoute();
      toast('Cheque Cleared & Ledger Updated', 'success');
    } catch (e) { toast(e.message, 'error'); }
  });

})();
</script>
<!-- =====================================================================
     PART 7 — PAYROLL, ATTENDANCE & EPF/ETF
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Payroll', id: 'attendance', ico: '📅', label: 'Attendance' });
  __LS_addNav({ group: 'Payroll', id: 'wage-runs', ico: '💸', label: 'Wage Runs' });

  // Ensure collections exist
  if (!state.data.attendance) state.data.attendance = [];
  if (!state.data.payrollRuns) state.data.payrollRuns = [];

  // Ensure EPF/ETF Accounts exist in CoA
  function ensurePayrollAccounts() {
    const reqAccounts = [
      { code: '2200', name: 'EPF Payable', type: 'liability' },
      { code: '2210', name: 'ETF Payable', type: 'liability' }
    ];
    let added = false;
    reqAccounts.forEach(req => {
      if (!state.data.coa.find(a => a.code === req.code)) {
        const newAcc = { id: uid(), code: req.code, name: req.name, type: req.type, isGroup: false, active: true };
        state.data.coa.push(newAcc);
        dbPut('coa', newAcc);
        added = true;
      }
    });
    if (added) toast('Added EPF/ETF accounts to Chart of Accounts.', 'success');
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 2. ATTENDANCE GRID
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('attendance', 'Attendance', async () => {
    const todayStr = today();
    const employees = state.data.employees.filter(e => e.active !== false);
    
    // Load existing attendance for today
    const existing = state.data.attendance.filter(a => a.date === todayStr);
    const attMap = {};
    existing.forEach(a => attMap[a.employeeId] = a);

    return `
      <div class="card">
        <div class="card-head">
          <h3>📅 Attendance for ${dateFmt(todayStr)}</h3>
          <div>
            <input type="date" id="att-date" value="${todayStr}" style="padding:8px; border-radius:8px; border:1px solid var(--border);">
            <button class="btn primary" data-action="att-save">Save Attendance</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Employee</th><th>Type</th><th>Status</th><th class="num">OT Hours</th></tr></thead>
            <tbody id="att-body">
              ${employees.map(e => {
                const a = attMap[e.id] || { status: 'present', ot: 0 };
                return `
                  <tr data-emp="${e.id}">
                    <td><strong>${esc(e.name)}</strong></td>
                    <td><span class="badge ${e.wageType === 'monthly' ? 'blue' : e.wageType === 'daily' ? 'amber' : 'purple'}">${esc(e.wageType).toUpperCase()}</span></td>
                    <td>
                      <select class="att-status" style="padding:6px; border-radius:4px; border:1px solid var(--border);">
                        <option value="present" ${a.status === 'present' ? 'selected' : ''}>Present</option>
                        <option value="absent" ${a.status === 'absent' ? 'selected' : ''}>Absent</option>
                        <option value="half" ${a.status === 'half' ? 'selected' : ''}>Half Day</option>
                      </select>
                    </td>
                    <td class="num"><input type="number" class="att-ot" value="${a.ot || ''}" placeholder="0" style="width:70px; padding:6px; text-align:right; border:1px solid var(--border); border-radius:4px;"></td>
                  </tr>
                `;
              }).join('') || '<tr><td colspan="4" class="muted">No employees found.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('att-save', async () => {
    const dateStr = document.getElementById('att-date').value || today();
    const rows = document.querySelectorAll('#att-body tr[data-emp]');
    
    for (const row of rows) {
      const empId = row.dataset.emp;
      const status = row.querySelector('.att-status').value;
      const ot = num(row.querySelector('.att-ot').value);
      
      // Check if exists
      let record = state.data.attendance.find(a => a.date === dateStr && a.employeeId === empId);
      if (record) {
        record.status = status;
        record.ot = ot;
      } else {
        record = { id: uid(), date: dateStr, employeeId: empId, status, ot };
        state.data.attendance.push(record);
      }
      await dbPut('attendance', record);
    }
    toast('Attendance saved', 'success');
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 3. WAGE RUNS (PAYROLL PROCESSING)
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('wage-runs', 'Wage Runs', async () => {
    const runs = [...state.data.payrollRuns].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = runs.map(r => `
      <tr>
        <td class="mono"><strong>${esc(r.number)}</strong></td>
        <td>${dateFmt(r.date)}</td>
        <td>${dateFmt(r.periodStart)} to ${dateFmt(r.periodEnd)}</td>
        <td class="num">${money(r.totalGross)}</td>
        <td class="num" style="color:var(--accent);font-weight:bold;">${money(r.totalNet)}</td>
        <td><button class="btn sm" data-action="run-view" data-id="${r.id}">View Payslips</button></td>
      </tr>
    `).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>💸 Wage Runs</h3>
          <button class="btn primary" data-action="run-new">＋ New Wage Run</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Run #</th><th>Date Processed</th><th>Period</th><th class="num">Total Gross</th><th class="num">Net Paid</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-3)">No wage runs yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('run-new', () => {
    ensurePayrollAccounts();
    
    const activeJobs = state.data.jobs.filter(j => j.status === 'in_progress');
    
    // Get default period (last 7 days)
    const end = today();
    const start = new Date(Date.now() - 6 * 86400000).toISOString().slice(0,10);

    openModal('Process New Wage Run', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label>Period Start</label><input type="date" id="wr-start" value="${start}"></div>
        <div class="field"><label>Period End</label><input type="date" id="wr-end" value="${end}"></div>
      </div>
      
      <div style="margin-top:16px;">
        <label style="font-weight:600;font-size:13px;margin-bottom:8px;display:block;">Job Allocation (%)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" id="wr-jobs">
          ${activeJobs.length ? activeJobs.map(j => `
            <div class="field">
              <label>${esc(j.number)}</label>
              <input type="number" class="wr-job-pct" data-id="${j.id}" placeholder="0" style="padding:6px;text-align:right;">
            </div>
          `).join('') : '<div class="muted">No active jobs. Wages will post to Factory Overhead.</div>'}
        </div>
      </div>

      <div style="margin-top:16px; padding:12px; background:var(--surface-2); border-radius:6px; font-size:12px;">
        <div class="muted">Ledger Impact:</div>
        <div><strong>Dr:</strong> WIP (Allocated) / Overhead (Unallocated)</div>
        <div><strong>Dr:</strong> Labour Expense (Employer EPF/ETF)</div>
        <div><strong>Cr:</strong> EPF Payable / ETF Payable / Cash (Net)</div>
      </div>
    `, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="wr-calc">Calculate & Preview</button>`
    });

    document.getElementById('wr-calc').onclick = () => {
      const pStart = document.getElementById('wr-start').value;
      const pEnd = document.getElementById('wr-end').value;
      
      if (!pStart || !pEnd) return toast('Select period dates', 'error');

      const emps = state.data.employees.filter(e => e.active !== false);
      if (!emps.length) return toast('No employees found', 'error');

      // Calculate wages
      const lines = [];
      let totalGross = 0, totalEpfEmp = 0, totalEpfCo = 0, totalEtf = 0, totalNet = 0;

      for (const emp of emps) {
        // Get attendance in period
        const atts = state.data.attendance.filter(a => a.employeeId === emp.id && a.date >= pStart && a.date <= pEnd);
        let present = 0, half = 0, otHrs = 0;
        
        atts.forEach(a => {
          if (a.status === 'present') present++;
          else if (a.status === 'half') half += 0.5;
          otHrs += num(a.ot);
        });
        const totalDays = present + half;

        let basic = 0;
        if (emp.wageType === 'monthly') {
          // Assume 26 working days/month average
          basic = (emp.baseRate / 26) * totalDays;
        } else if (emp.wageType === 'daily') {
          basic = emp.baseRate * totalDays;
        } else if (emp.wageType === 'piece') {
          // For simplicity, assume attendance = pieces produced
          basic = emp.baseRate * totalDays;
        }

        const hourlyRate = (basic / 8) || 0; // 8hr shift
        const otPay = otHrs * hourlyRate * 1.5;
        
        const gross = basic + otPay;
        const epfEmp = gross * 0.08;
        const epfCo = gross * 0.12;
        const etf = gross * 0.03;
        const net = gross - epfEmp;

        totalGross += gross;
        totalEpfEmp += epfEmp;
        totalEpfCo += epfCo;
        totalEtf += etf;
        totalNet += net;

        lines.push({ empId: emp.id, empName: emp.name, basic, otPay, gross, epfEmp, epfCo, etf, net });
      }

      // Render Preview
      const body = `
        <div class="kpi-strip">
          <div class="kpi"><div class="k-label">Gross Pay</div><div class="k-value">${money(totalGross)}</div></div>
          <div class="kpi"><div class="k-label">Total EPF (8%+12%)</div><div class="k-value">${money(totalEpfEmp + totalEpfCo)}</div></div>
          <div class="kpi"><div class="k-label">Total ETF (3%)</div><div class="k-value">${money(totalEtf)}</div></div>
          <div class="kpi" style="border-color:var(--green)"><div class="k-label">Net Payable</div><div class="k-value" style="color:var(--green)">${money(totalNet)}</div></div>
        </div>
        <div class="table-wrap" style="max-height:300px; overflow:auto;">
          <table>
            <thead><tr><th>Employee</th><th class="num">Basic</th><th class="num">OT</th><th class="num">Gross</th><th class="num">EPF (8%)</th><th class="num">Net Pay</th></tr></thead>
            <tbody>${lines.map(l => `
              <tr>
                <td>${esc(l.empName)}</td>
                <td class="num">${money(l.basic)}</td>
                <td class="num">${money(l.otPay)}</td>
                <td class="num">${money(l.gross)}</td>
                <td class="num">${money(l.epfEmp)}</td>
                <td class="num" style="font-weight:bold;">${money(l.net)}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
        <div style="margin-top:20px; text-align:right;">
          <button class="btn primary" id="wr-post">Post Payroll to Ledger</button>
        </div>
      `;

      openModal('Wage Run Preview', body, { size: 'lg' });

      document.getElementById('wr-post').onclick = async () => {
        // Gather job allocations
        const allocs = [];
        document.querySelectorAll('.wr-job-pct').forEach(inp => {
          const pct = num(inp.value);
          if (pct > 0) allocs.push({ jobId: inp.dataset.id, pct });
        });

        const totalAllocPct = allocs.reduce((s,a) => s + a.pct, 0);
        if (totalAllocPct > 100) return toast('Total allocation exceeds 100%', 'error');

        // Prepare Ledger Lines
        const wipAcc = state.data.coa.find(a => a.code === '1220');
        const ohAcc = state.data.coa.find(a => a.code === '5030');
        const epfAcc = state.data.coa.find(a => a.code === '2200');
        const etfAcc = state.data.coa.find(a => a.code === '2210');
        const cashAcc = state.data.coa.find(a => a.code === '1000'); // Assume paid via cash

        const totalLabourCost = totalGross + totalEpfCo + totalEtf; // Employer cost
        const glLines = [];

        // 1. Debit WIP for allocated amount
        let totalAllocatedCost = 0;
        allocs.forEach(a => {
          const amt = (totalLabourCost * a.pct) / 100;
          glLines.push({ accountId: wipAcc.id, debit: amt, credit: 0, narration: `Labour for Job` });
          totalAllocatedCost += amt;
        });

        // 2. Debit Overhead for remainder
        const unallocated = totalLabourCost - totalAllocatedCost;
        if (unallocated > 0.01) {
          glLines.push({ accountId: ohAcc.id, debit: unallocated, credit: 0, narration: `Unallocated Wages` });
        }

        // 3. Credit Liabilities & Cash
        glLines.push({ accountId: epfAcc.id, debit: 0, credit: totalEpfEmp + totalEpfCo });
        glLines.push({ accountId: etfAcc.id, debit: 0, credit: totalEtf });
        glLines.push({ accountId: cashAcc.id, debit: 0, credit: totalNet });

        try {
          await ERP.ledger.post({
            date: today(),
            narration: `Wage Run: ${pStart} to ${pEnd}`,
            lines: glLines
          });

          // Save Run
          const run = {
            id: uid(),
            number: 'PR-' + Date.now().toString().slice(-4),
            date: today(),
            periodStart: pStart,
            periodEnd: pEnd,
            lines: lines,
            totalGross, totalNet
          };
          state.data.payrollRuns.push(run);
          await dbPut('payrollRuns', run);

          closeModal();
          handleRoute();
          toast('Payroll Posted Successfully', 'success');
        } catch (e) { toast(e.message, 'error'); }
      };
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. VIEW PAYSLIPS
  // ═══════════════════════════════════════════════════════════════════════
  __LS_registerAction('run-view', (ev, id) => {
    const run = state.data.payrollRuns.find(r => r.id === id);
    if (!run) return;

    const body = `
      <div class="table-wrap" style="max-height:400px; overflow:auto;">
        <table>
          <thead><tr><th>Employee</th><th class="num">Basic</th><th class="num">OT</th><th class="num">Gross</th><th class="num">EPF</th><th class="num">Net Paid</th></tr></thead>
          <tbody>
            ${run.lines.map(l => `
              <tr>
                <td><strong>${esc(l.empName)}</strong></td>
                <td class="num">${money(l.basic)}</td>
                <td class="num">${money(l.otPay)}</td>
                <td class="num">${money(l.gross)}</td>
                <td class="num" style="color:var(--red)">${money(l.epfEmp)}</td>
                <td class="num" style="font-weight:bold; color:var(--green);">${money(l.net)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    openModal('Wage Run Details - ' + run.number, body, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Close</button><button class="btn primary" onclick="window.print()">🖨 Print Payslips</button>`
    });
  });

})();
</script>
<!-- =====================================================================
     PART 8 — FINANCIAL REPORTS ENGINE
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. NAVIGATION REGISTRATION
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Reports', id: 'rpt-tb', ico: '⚖️', label: 'Trial Balance' });
  __LS_addNav({ group: 'Reports', id: 'rpt-pnl', ico: '📈', label: 'Profit & Loss' });
  __LS_addNav({ group: 'Reports', id: 'rpt-bs', ico: '🏛️', label: 'Balance Sheet' });
  __LS_addNav({ group: 'Reports', id: 'rpt-cf', ico: '💸', label: 'Cash Flow' });

  // Helper to get balances for a date range
  function getBalance(accountId, fromDate, toDate) {
    let bal = 0;
    state.data.journalEntries.forEach(je => {
      if (fromDate && je.date < fromDate) return;
      if (toDate && je.date > toDate) return;
      je.lines.forEach(l => {
        if (l.accountId === accountId) {
          bal += (l.debit - l.credit);
        }
      });
    });
    return bal;
  }

  // Print helper
  function printReport(title, htmlContent) {
    const win = window.open('', '_blank');
    win.document.write(`
      <html><head><title>${title}</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 40px; color: #333; font-size: 14px; }
        h2 { text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; color: #666; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; }
        th { text-align: left; background: #f9f9f9; }
        .num { text-align: right; }
        .total { font-weight: bold; border-top: 2px solid #333; border-bottom: 2px solid #333; background: #f4f4f4; }
        .section { font-weight: bold; margin-top: 20px; padding-bottom: 5px; border-bottom: 1px solid #333; }
        @media print { body { padding: 0; } }
      </style></head><body>
      <h2>${title}</h2>
      <div class="sub">Generated on ${dateFmt(today())}</div>
      ${htmlContent}
      <script>window.onload = function() { window.print(); window.close(); }<\/script>
      </body></html>
    `);
    win.document.close();
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 2. TRIAL BALANCE
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('rpt-tb', 'Trial Balance', async () => {
    return `
      <div class="card">
        <div class="card-head">
          <h3>⚖️ Trial Balance</h3>
          <button class="btn primary" data-action="print-tb">🖨 Print</button>
        </div>
        <div class="table-wrap">
          <table id="tb-table">
            <thead><tr><th>Code</th><th>Account Name</th><th>Type</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
            <tbody id="tb-body"></tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_register('part8-tb-bind', () => {
    setTimeout(() => {
      const tbody = document.getElementById('tb-body');
      if (!tbody) return;

      let totalDr = 0, totalCr = 0;
      let rows = '';

      const accounts = [...state.data.coa].sort((a,b) => a.code.localeCompare(b.code));

      accounts.forEach(acc => {
        const bal = getBalance(acc.id);
        if (Math.abs(bal) < 0.01) return; // Skip zero balances

        let dr = 0, cr = 0;
        if (bal > 0) { dr = bal; totalDr += bal; }
        else { cr = -bal; totalCr += -bal; }

        rows += `
          <tr>
            <td class="mono">${esc(acc.code)}</td>
            <td>${esc(acc.name)}</td>
            <td><span class="badge gray">${esc(acc.type).toUpperCase()}</span></td>
            <td class="num">${dr ? money(dr) : ''}</td>
            <td class="num">${cr ? money(cr) : ''}</td>
          </tr>
        `;
      });

      tbody.innerHTML = rows + `
        <tr style="font-weight:bold; background:var(--surface-2); border-top:2px solid var(--border);">
          <td colspan="3" style="text-align:right;">TOTAL</td>
          <td class="num" style="color:var(--accent);">${money(totalDr)}</td>
          <td class="num" style="color:var(--accent);">${money(totalCr)}</td>
        </tr>
        <tr>
          <td colspan="5" style="text-align:center; font-weight:bold; color:${Math.abs(totalDr - totalCr) < 0.01 ? 'var(--green)' : 'var(--red)'}; padding:12px;">
