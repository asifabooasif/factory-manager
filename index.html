<!-- =====================================================================
     PART 5 — SALES, PURCHASES, BANKING & FINANCIAL REPORTS
===================================================================== -->
<script>
(function(){
'use strict';
const ERP = window.ERP;
if (!ERP) return;
const {h, toast, modal, table, page} = ERP.ui;
const {money, date, fmtDate} = ERP.util;

/* =====================================================================
   1. DELIVERY NOTES (D/N)
===================================================================== */
ERP.screens.deliveries = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const dns = await ERP.db.all('deliveries');
    const tbl = table({ columns: [
      { label:'D/N #', key:'number', class:'mono' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Customer', key:'customerId', render:async (v) => (await ERP.db.get('parties', v))?.name || 'Walk-in' },
      { label:'Total Pairs', key:'lines', render:v => v.reduce((a,b)=>a+b.qty, 0) },
      { label:'Status', key:'status', render:v => h('span',{class:'badge ' + (v==='invoiced'?'ok':'warn')}, v.toUpperCase()) },
      { label:'', render:r => h('button', {class:'btn btn-sm', onclick:()=>viewDN(r)}, 'View') }
    ], rows: dns.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No deliveries found.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const viewDN = async (dn) => {
    const rows = await Promise.all(dn.lines.map(async l => ({ 
      item: (await ERP.db.get('items', l.itemId))?.name, 
      qty: l.qty, 
      cost: l.rate 
    })));
    modal({ title:'D/N ' + dn.number, content: table({ columns: [
      {label:'Item',key:'item'}, {label:'Qty',key:'qty',align:'right'}, {label:'Cost (Rs)',key:'cost',align:'right',render:v=>money(v)}
    ], rows }), actions:[{label:'Close', primary:true}] });
  };

  const openForm = async () => {
    const customers = await ERP.db.all('parties');
    const fgItems = (await ERP.db.all('items')).filter(i => i.type === 'fg' && !i.isParent);

    const custSel = h('select', {class:'select'}, h('option',{value:''},'— Select Customer —'), ...customers.map(c => h('option',{value:c.id}, c.name)));
    const state = { lines: [] };
    const grid = h('div');

    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Article'), h('th',{width:'150px'},'Qty to Deliver'), h('th',{width:'40px'},''))));
      const tb = h('tbody');
      
      state.lines.forEach((l, i) => {
        const sel = h('select', {class:'select', onchange:e=>l.itemId=e.target.value}, h('option',{value:''},'— Select Article —'), ...fgItems.map(it=>h('option',{value:it.id, selected:l.itemId===it.id}, it.name)));
        const qty = h('input', {class:'input', type:'number', value:l.qty||'', oninput:e=>l.qty=Number(e.target.value)});
        tb.appendChild(h('tr', null, h('td',null,sel), h('td',null,qty), h('td',null, h('button',{class:'btn btn-sm', onclick:()=>{state.lines.splice(i,1);renderLines();}},'×'))));
      });
      tbl.appendChild(tb);
      grid.appendChild(tbl);
      grid.appendChild(h('button', {class:'btn btn-sm', style:{marginTop:'8px'}, onclick:()=>{state.lines.push({itemId:'',qty:1});renderLines();}}, '+ Add Item'));
    };
    renderLines();

    modal({
      title: 'Create Delivery Note', size: 'lg',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Customer'), custSel),
        h('div', {style:{marginTop:'16px'}}, h('label', {style:{fontWeight:'bold'}}, 'Items to Dispatch'), grid)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Delivery', primary:true, onClick: async c=>{
          const valid = state.lines.filter(l => l.itemId && l.qty > 0);
          if(!custSel.value || !valid.length) return toast('Select customer and items', 'err');

          let totalCOGS = 0;
          const linesWithCost = [];

          for(const l of valid) {
            const itm = await ERP.db.get('items', l.itemId);
            const cost = itm.cost || 0;
            totalCOGS += (l.qty * cost);
            linesWithCost.push({ itemId: l.itemId, qty: l.qty, rate: cost });

            await ERP.db.put('stockMoves', { date:date(), itemId:l.itemId, warehouseId:'wh_fg', qty:-l.qty, rate:cost, refType:'Delivery' });
          }

          if(totalCOGS > 0) {
            await ERP.db.put('journalEntries', { date:date(), narration:'COGS for Delivery', source:'Delivery', lines:[
              { accountCode:'5000', accountName:'Cost of Goods Sold', debit:totalCOGS, credit:0 }, 
              { accountCode:'1230', accountName:'Finished Goods', debit:0, credit:totalCOGS }
            ]});
          }

          await ERP.db.put('deliveries', {
            number:'DN-'+Date.now().toString().slice(-4), date:date(), customerId:custSel.value,
            lines:linesWithCost, status:'pending'
          });
          c(); render(); toast('Delivery Note Created');
        }}
      ]
    });
  };

  render();
  return page('Delivery Notes', 'Dispatch goods to customers', [h('button',{class:'btn btn-primary',onclick:openForm},'+ New Delivery')], host);
};

/* =====================================================================
   2. SALES INVOICES & RECEIPTS
===================================================================== */
ERP.screens.salesInvoices = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const invs = await ERP.db.all('salesInvoices');
    const tbl = table({ columns: [
      { label:'Invoice #', key:'number', class:'mono' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Customer', key:'customerId', render:async (v) => (await ERP.db.get('parties', v))?.name || 'Walk-in' },
      { label:'Total Amount', key:'total', align:'right', render:v => money(v) },
      { label:'Balance', key:'balance', align:'right', render:v => money(v) },
      { label:'Status', key:'status', render:v => h('span',{class:'badge ' + (v==='paid'?'ok':v==='partial'?'warn':'danger')}, v.toUpperCase()) },
      { label:'', render:r => h('div', {style:{display:'flex', gap:'4px'}},
        h('button', {class:'btn btn-sm', onclick:()=>{ window.print(); }}, 'Print'),
        r.balance > 0 ? h('button', {class:'btn btn-sm btn-primary', onclick:()=>openReceipt(r)}, 'Receive') : null
      )}
    ], rows: invs.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No invoices found.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = async () => {
    const customers = await ERP.db.all('parties');
    const fgItems = (await ERP.db.all('items')).filter(i => i.type === 'fg' && !i.isParent);

    const custSel = h('select', {class:'select'}, h('option',{value:''},'— Select Customer —'), ...customers.map(c => h('option',{value:c.id}, c.name)));
    const state = { lines: [] };
    const grid = h('div');

    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Article'), h('th',{width:'100px'},'Qty'), h('th',{width:'120px'},'Rate'), h('th',{width:'40px'},''))));
      const tb = h('tbody');
      
      state.lines.forEach((l, i) => {
        const sel = h('select', {class:'select', onchange:e=>l.itemId=e.target.value}, h('option',{value:''},'— Select Article —'), ...fgItems.map(it=>h('option',{value:it.id, selected:l.itemId===it.id}, it.name)));
        const qty = h('input', {class:'input', type:'number', value:l.qty||'', oninput:e=>l.qty=Number(e.target.value)});
        const rate = h('input', {class:'input', type:'number', value:l.rate||'', oninput:e=>l.rate=Number(e.target.value)});
        tb.appendChild(h('tr', null, h('td',null,sel), h('td',null,qty), h('td',null,rate), h('td',null, h('button',{class:'btn btn-sm', onclick:()=>{state.lines.splice(i,1);renderLines();}},'×'))));
      });
      tbl.appendChild(tb);
      grid.appendChild(tbl);
      grid.appendChild(h('button', {class:'btn btn-sm', style:{marginTop:'8px'}, onclick:()=>{state.lines.push({itemId:'',qty:1,rate:0});renderLines();}}, '+ Add Item'));
    };
    renderLines();

    modal({
      title: 'Create Sales Invoice', size: 'lg',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Customer'), custSel),
        h('div', {style:{marginTop:'16px'}}, h('label', {style:{fontWeight:'bold'}}, 'Billed Items'), grid)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Invoice', primary:true, onClick: async c=>{
          const valid = state.lines.filter(l => l.itemId && l.qty > 0 && l.rate > 0);
          if(!custSel.value || !valid.length) return toast('Select customer and valid items', 'err');

          const cust = await ERP.db.get('parties', custSel.value);
          let total = valid.reduce((a,b)=>a+(b.qty*b.rate), 0);

          const allInvs = await ERP.db.all('salesInvoices');
          const unpaid = allInvs.filter(i => i.customerId === custSel.value && i.balance > 0).reduce((a,b)=>a+b.balance, 0);
          if(cust.creditLimit && (unpaid + total) > cust.creditLimit) {
            if(!confirm(`Credit limit exceeded! Limit: ${money(cust.creditLimit)}, Owed: ${money(unpaid)}. Proceed?`)) return;
          }

          await ERP.db.put('journalEntries', { date:date(), narration:'Sales Invoice', source:'Invoice', lines:[
            { accountCode:'1100', accountName:'Accounts Receivable', debit:total, credit:0 }, 
            { accountCode:'4000', accountName:'Sales Revenue', debit:0, credit:total }
          ]});

          await ERP.db.put('salesInvoices', {
            number:'INV-'+Date.now().toString().slice(-4), date:date(), customerId:custSel.value,
            lines:valid, total, balance:total, status:'unpaid'
          });

          c(); render(); toast('Invoice Created');
        }}
      ]
    });
  };

  const openReceipt = (inv) => {
    const amtIn = h('input', {class:'input', type:'number', value:inv.balance});
    modal({
      title: 'Record Payment', size: 'sm',
      content: h('div', null,
        h('p', {style:{marginBottom:'16px'}}, `Invoice: ${inv.number} | Balance: ${money(inv.balance)}`),
        h('div', {class:'field'}, h('label',null,'Amount Received'), amtIn)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Receipt', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          if(!amt) return toast('Enter amount', 'err');
          
          await ERP.db.put('journalEntries', { date:date(), narration:'Receipt for ' + inv.number, source:'Receipt', lines:[
            { accountCode:'1000', accountName:'Cash', debit:amt, credit:0 }, 
            { accountCode:'1100', accountName:'Accounts Receivable', debit:0, credit:amt }
          ]});

          const newBal = inv.balance - amt;
          await ERP.db.put('salesInvoices', { ...inv, balance: newBal, status: newBal <= 0 ? 'paid' : 'partial' });
          await ERP.db.put('receipts', { date:date(), invoiceId:inv.id, amount:amt });

          c(); render(); toast('Payment Recorded');
        }}
      ]
    });
  };

  render();
  return page('Sales Invoices', 'Bill customers and manage AR', [h('button',{class:'btn btn-primary',onclick:openForm},'+ New Invoice')], host);
};

/* =====================================================================
   3. PURCHASE INVOICES (AP)
===================================================================== */
ERP.screens.purchases = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const invs = await ERP.db.all('purchaseInvoices');
    const tbl = table({ columns: [
      { label:'Inv #', key:'number', class:'mono' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Supplier', key:'supplierId', render:async (v) => (await ERP.db.get('parties', v))?.name || 'Unknown' },
      { label:'Total', key:'total', align:'right', render:v => money(v) },
      { label:'', render:r => h('button', {class:'btn btn-sm', onclick:()=>payBill(r)}, 'Pay') }
    ], rows: invs.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No purchase invoices.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = async () => {
    const suppliers = (await ERP.db.all('parties')).filter(p => p.type === 'supplier' || p.type === 'both');
    const rmItems = (await ERP.db.all('items')).filter(i => i.type === 'main' || i.type === 'accessory');

    const supSel = h('select', {class:'select'}, h('option',{value:''},'— Select Supplier —'), ...suppliers.map(c => h('option',{value:c.id}, c.name)));
    const state = { lines: [] };
    const grid = h('div');

    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Material'), h('th',{width:'100px'},'Qty'), h('th',{width:'120px'},'Rate'), h('th',{width:'40px'},''))));
      const tb = h('tbody');
      
      state.lines.forEach((l, i) => {
        const sel = h('select', {class:'select', onchange:e=>l.itemId=e.target.value}, h('option',{value:''},'— Select Material —'), ...rmItems.map(it=>h('option',{value:it.id, selected:l.itemId===it.id}, it.name)));
        const qty = h('input', {class:'input', type:'number', value:l.qty||'', oninput:e=>l.qty=Number(e.target.value)});
        const rate = h('input', {class:'input', type:'number', value:l.rate||'', oninput:e=>l.rate=Number(e.target.value)});
        tb.appendChild(h('tr', null, h('td',null,sel), h('td',null,qty), h('td',null,rate), h('td',null, h('button',{class:'btn btn-sm', onclick:()=>{state.lines.splice(i,1);renderLines();}},'×'))));
      });
      tbl.appendChild(tb);
      grid.appendChild(tbl);
      grid.appendChild(h('button', {class:'btn btn-sm', style:{marginTop:'8px'}, onclick:()=>{state.lines.push({itemId:'',qty:1,rate:0});renderLines();}}, '+ Add Material'));
    };
    renderLines();

    modal({
      title: 'Record Purchase Invoice', size: 'lg',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Supplier'), supSel),
        h('div', {style:{marginTop:'16px'}}, h('label', {style:{fontWeight:'bold'}}, 'Purchased Materials'), grid)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Invoice', primary:true, onClick: async c=>{
          const valid = state.lines.filter(l => l.itemId && l.qty > 0 && l.rate > 0);
          if(!supSel.value || !valid.length) return toast('Select supplier and items', 'err');

          let total = valid.reduce((a,b)=>a+(b.qty*b.rate), 0);

          await ERP.db.put('journalEntries', { date:date(), narration:'Purchase Invoice', source:'PI', lines:[
            { accountCode:'1200', accountName:'Raw Materials', debit:total, credit:0 }, 
            { accountCode:'2000', accountName:'Accounts Payable', debit:0, credit:total }
          ]});

          for(const l of valid) {
            await ERP.db.put('stockMoves', { date:date(), itemId:l.itemId, warehouseId:'wh_rm', qty:l.qty, rate:l.rate, refType:'Purchase' });
            const itm = await ERP.db.get('items', l.itemId);
            if(itm) await ERP.db.put('items', { ...itm, cost: l.rate }); // Update latest cost
          }

          await ERP.db.put('purchaseInvoices', {
            number:'PI-'+Date.now().toString().slice(-4), date:date(), supplierId:supSel.value,
            lines:valid, total, balance:total, status:'unpaid'
          });

          c(); render(); toast('Purchase Invoice Created');
        }}
      ]
    });
  };

  const payBill = (inv) => {
    const amtIn = h('input', {class:'input', type:'number', value:inv.balance});
    modal({
      title: 'Pay Supplier', size: 'sm',
      content: h('div', null, h('div', {class:'field'}, h('label',null,'Amount to Pay'), amtIn)),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Payment', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          if(!amt) return toast('Enter amount', 'err');
          
          await ERP.db.put('journalEntries', { date:date(), narration:'Payment to Supplier', source:'Payment', lines:[
            { accountCode:'2000', accountName:'Accounts Payable', debit:amt, credit:0 }, 
            { accountCode:'1000', accountName:'Cash', debit:0, credit:amt }
          ]});

          const newBal = inv.balance - amt;
          await ERP.db.put('purchaseInvoices', { ...inv, balance: newBal, status: newBal <= 0 ? 'paid' : 'partial' });
          c(); render(); toast('Payment Recorded');
        }}
      ]
    });
  };

  render();
  return page('Purchase Invoices', 'Manage Supplier Payables', [h('button',{class:'btn btn-primary',onclick:openForm},'+ New Bill')], host);
};

/* =====================================================================
   4. ADVANCED FINANCIAL REPORTS
===================================================================== */
ERP.screens.ledger = function() {
  const host = h('div');
  const accSel = h('select', {class:'select', style:{maxWidth:'300px'}}, h('option',{value:''},'— Select Ledger Account —'));
  
  ERP.db.all('coa').then(coas => {
    coas.sort((a,b)=>a.code.localeCompare(b.code)).forEach(a => accSel.appendChild(h('option',{value:a.code}, a.code + ' - ' + a.name)));
  });

  const tableHost = h('div');
  const render = async () => {
    tableHost.innerHTML = '';
    const code = accSel.value;
    if(!code) return;

    const coa = await ERP.db.get('coa', code);
    if(!coa) return;

    const entries = await ERP.db.all('journalEntries');
    const filtered = entries.filter(j => j.lines.some(l => l.accountCode === code));
    
    let bal = 0;
    const rows = filtered.sort((a,b)=>a.date.localeCompare(b.date)).map(e => {
      const line = e.lines.find(l => l.accountCode === code);
      bal += (line.debit - line.credit);
      return { date: e.date, narration: e.narration, debit: line.debit, credit: line.credit, bal };
    });

    tableHost.appendChild(table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Narration', key:'narration' },
      { label:'Debit', key:'debit', align:'right', render:v => v ? money(v) : '' },
      { label:'Credit', key:'credit', align:'right', render:v => v ? money(v) : '' },
      { label:'Balance', key:'bal', align:'right', render:v => h('b',null,money(v)) }
    ], rows }));
  };
  accSel.onchange = render;

  host.appendChild(h('div', {class:'page-head'}, h('div', null, h('div', {class:'page-title'}, 'General Ledger'), h('div', {class:'page-sub'}, 'Searchable double-entry ledger')), h('div', null, accSel)));
  host.appendChild(h('div',{class:'card'},h('div',{class:'card-body p0'},tableHost)));
  return host;
};

ERP.screens.trialBalance = async function() {
  const accounts = await ERP.db.all('coa');
  const entries = await ERP.db.all('journalEntries');
  
  const rows = [];
  let totDr = 0, totCr = 0;

  accounts.forEach(a => {
    let dr = 0, cr = 0;
    entries.forEach(j => j.lines.forEach(l => { if(l.accountCode === a.code) { dr += l.debit; cr += l.credit; } }));
    const net = dr - cr;
    if(Math.abs(net) < 0.01) return;
    if(net > 0) { totDr += net; rows.push({ name: a.name, dr: net, cr: 0 }); }
    else { totCr += -net; rows.push({ name: a.name, dr: 0, cr: -net }); }
  });

  return page('Trial Balance', 'System balance check', [], 
    h('div',{class:'card'}, h('div',{class:'card-body p0'}, 
      table({ columns: [
        { label:'Account', key:'name' }, { label:'Debit', key:'dr', align:'right', render:v => v ? money(v) : '' },
        { label:'Credit', key:'cr', align:'right', render:v => v ? money(v) : '' }
      ], rows }),
      h('div', {style:{padding:'16px', background:'var(--surface2)', borderTop:'2px solid var(--line)', display:'flex', justifyContent:'space-between', fontWeight:'bold'}},
        h('span', null, 'Total'), h('span', null, `Dr: ${money(totDr)} | Cr: ${money(totCr)}`)
      )
    ))
  );
};

ERP.screens.pnl = async function() {
  const accounts = await ERP.db.all('coa');
  const entries = await ERP.db.all('journalEntries');
  let rev = 0, exp = 0;
  const rows = [];

  accounts.forEach(a => {
    let dr = 0, cr = 0;
    entries.forEach(j => j.lines.forEach(l => { if(l.accountCode === a.code) { dr += l.debit; cr += l.credit; } }));
    
    if(a.type === 'income') { const bal = cr - dr; if(bal) { rev += bal; rows.push({ name: a.name, type: 'Income', bal }); } }
    if(a.type === 'expense') { const bal = dr - cr; if(bal) { exp += bal; rows.push({ name: a.name, type: 'Expense', bal }); } }
  });

  return page('Profit & Loss', 'Income statement', [], 
    h('div',{class:'card'}, h('div',{class:'card-body p0'}, 
      table({ columns: [
        { label:'Account', key:'name' }, { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v==='Income'?'ok':'danger')}, v) },
        { label:'Amount', key:'bal', align:'right', render:v => money(v) }
      ], rows }),
      h('div', {style:{padding:'16px', background:'var(--brandsoft)', color:'var(--brand)', display:'flex', justifyContent:'space-between', fontWeight:'bold', fontSize:'18px'}},
        h('span', null, 'Net Profit'), h('span', null, money(rev - exp))
      )
    ))
  );
};

ERP.screens.bs = async function() {
  const accounts = await ERP.db.all('coa');
  const entries = await ERP.db.all('journalEntries');
  let assets = 0, liab = 0, eq = 0;
  let rev = 0, exp = 0;

  accounts.forEach(a => {
    let dr = 0, cr = 0;
    entries.forEach(j => j.lines.forEach(l => { if(l.accountCode === a.code) { dr += l.debit; cr += l.credit; } }));
    if(a.type === 'income') rev += (cr - dr);
    if(a.type === 'expense') exp += (dr - cr);
  });
  const netProfit = rev - exp;

  const rows = [];
  accounts.forEach(a => {
    let dr = 0, cr = 0;
    entries.forEach(j => j.lines.forEach(l => { if(l.accountCode === a.code) { dr += l.debit; cr += l.credit; } }));
    const bal = dr - cr;

    if(a.type === 'asset' && Math.abs(bal) > 0.01) { assets += bal; rows.push({ name: a.name, type: 'Asset', bal }); }
    if(a.type === 'liability' && Math.abs(bal) > 0.01) { liab += -bal; rows.push({ name: a.name, type: 'Liability', bal: -bal }); }
    if(a.type === 'equity' && Math.abs(bal) > 0.01) { eq += -bal; rows.push({ name: a.name, type: 'Equity', bal: -bal }); }
  });
  eq += netProfit;

  return page('Balance Sheet', 'Financial position', [], 
    h('div',{class:'card'}, h('div',{class:'card-body p0'}, 
      table({ columns: [
        { label:'Account', key:'name' }, { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v==='Asset'?'ok':v==='Liability'?'warn':'brand')}, v) },
        { label:'Amount', key:'bal', align:'right', render:v => money(v) }
      ], rows }),
      h('div', {style:{padding:'16px', background:'var(--surface2)', borderTop:'2px solid var(--line)', display:'flex', justifyContent:'space-between', fontWeight:'bold'}},
        h('span', null, 'Total Assets: ' + money(assets)), 
        h('span', null, 'Total Liab + Eq: ' + money(liab + eq))
      )
    ))
  );
};

const renderRouterP5 = async function() {
  const path = location.hash.replace('#/', '') || 'home';
  const view = document.getElementById('view');
  view.innerHTML = '';
  
  const map = {
    'home': ERP.screens.dashboard,
    'masters/coa': ERP.screens.coa,
    'masters/items': ERP.screens.items,
    'masters/parties': ERP.screens.parties,
    'masters/employees': ERP.screens.employees,
    'banking/pdc': ERP.screens.pdc,
    'jobs': ERP.screens.jobs,
    'vouchers': ERP.screens.vouchers,
    'payroll/inputs': ERP.screens.payrollInputs,
    'payroll/runs': ERP.screens.wageRuns,
    'petty-cash': ERP.screens.pettyCash,
    'sales/deliveries': ERP.screens.deliveries,
    'sales/invoices': ERP.screens.salesInvoices,
    'purchases': ERP.screens.purchases,
    'accounting/ledger': ERP.screens.ledger,
    'accounting/tb': ERP.screens.trialBalance,
    'accounting/pnl': ERP.screens.pnl,
    'accounting/bs': ERP.screens.bs
  };

  if (map[path]) {
    view.appendChild(await map[path]());
    document.getElementById('tbTitle').textContent = document.querySelector(`.sb-item[onclick*="${path}"]`)?.textContent || 'Dashboard';
  } else {
    view.appendChild(ERP.ui.page('Under Construction', 'Coming next...', [], ERP.ui.h('div', { class: 'card card-body' }, 'Please wait.')));
  }
  ERP.layout.buildNav();
};
