<!DOCTYPE html>
<html lang="en" data-theme="professional">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lanka Slipper - Enterprise ERP</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   THEME TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13.5px; --fs-lg: 15px; --fs-xl: 18px;
  --fs-2xl: 22px; --fs-3xl: 28px;
  --sidebar-w: 250px; --topbar-h: 60px; --content-max: 1600px;
  --t-fast: 0.12s ease; --t-base: 0.18s ease;
}
[data-theme="professional"] {
  --bg: #fafaff; --surface: #ffffff; --surface-2: #f6f4fb; --surface-3: #eeebf7;
  --border: #e5e1f0; --border-2: #f0edf7; --border-3: #d4cde6;
  --text: #1a1533; --text-2: #403a5c; --text-3: #78718f; --text-4: #a8a2bd;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-soft: #f5f0ff; --accent-text: #6d28d9;
  --green: #10b981; --green-soft: #e9fbf3;
  --amber: #f59e0b; --amber-soft: #fef7e7;
  --red: #ef4444; --red-soft: #fef1f1;
  --blue: #3b82f6; --blue-soft: #eff6ff;
  --shadow-sm: 0 1px 2px rgba(26,21,51,.05);
  --shadow-md: 0 4px 12px rgba(26,21,51,.08);
  --shadow-lg: 0 20px 45px -12px rgba(26,21,51,.2);
  --sidebar-bg: linear-gradient(180deg, #150b30 0%, #2a1758 60%, #3b1d7a 100%);
  --sidebar-text: #e4ddf4; --sidebar-text-2: #9e95bc;
  --sidebar-hover: rgba(255,255,255,.07); --sidebar-active: rgba(124,58,237,.35);
  --sidebar-border: rgba(255,255,255,.08);
}
[data-theme="dark"] {
  --bg: #0a0618; --surface: #12092b; --surface-2: #180d36; --surface-3: #1e1140;
  --border: #2a1a55; --border-2: #1f1142; --border-3: #3a2470;
  --text: #f0eaff; --text-2: #c4b8e4; --text-3: #8e82b8; --text-4: #625a88;
  --accent: #a78bfa; --accent-hover: #c4b5fd; --accent-soft: #241548; --accent-text: #c4b5fd;
  --green: #34d399; --green-soft: #0a2e22;
  --amber: #fbbf24; --amber-soft: #2a1d05;
  --red: #f87171; --red-soft: #2a0e0e;
  --blue: #60a5fa; --blue-soft: #0f1e3d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 60px -12px rgba(0,0,0,.7);
  --sidebar-bg: linear-gradient(180deg, #0a0618 0%, #180d36 100%);
  --sidebar-text: #c4b8e4; --sidebar-text-2: #625a88;
  --sidebar-hover: rgba(167,139,250,.1); --sidebar-active: rgba(167,139,250,.25);
  --sidebar-border: rgba(167,139,250,.15);
}

/* ═══════════════════════════════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4 { font-weight: 600; letter-spacing: -.01em; }
button, input, select, textarea { font-family: inherit; font-size: inherit; outline: none; border: none; background: none; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--text-3); }
.small { font-size: var(--fs-xs); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════════════════════════════════ */
.login-wrap {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--sidebar-bg); padding: var(--sp-6);
}
.login-wrap.hidden { display: none; }
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 44px 40px 36px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center;
}
.login-logo {
  width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff; display: grid; place-items: center; font-size: 30px;
}
.login-card h1 { font-size: var(--fs-2xl); font-weight: 700; margin-bottom: 4px; }
.login-card .tagline { font-size: var(--fs-md); color: var(--text-3); margin-bottom: 28px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 18px; border-radius: var(--r-md);
  border: 1px solid var(--border-3); background: var(--surface);
  color: var(--text); font-weight: 500; font-size: var(--fs-md);
}
.google-btn:hover:not(:disabled) { background: var(--surface-2); }
.google-btn:disabled { opacity: .5; cursor: not-allowed; }
.google-btn svg { width: 18px; height: 18px; flex: 0 0 18px; }

/* ═══════════════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════════════ */
.app { display: flex; min-height: 100vh; }
.app.hidden { display: none; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--sidebar-bg); color: var(--sidebar-text);
  height: 100vh; position: sticky; top: 0; overflow-y: auto;
  display: flex; flex-direction: column; padding: 20px 12px;
  border-right: 1px solid var(--sidebar-border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-logo {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px;
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  display: grid; place-items: center; font-size: 16px;
}
.brand-text { min-width: 0; }
.brand-name { font-weight: 600; font-size: var(--fs-md); color: #fff; line-height: 1.2; }
.brand-sub { font-size: var(--fs-xs); color: var(--sidebar-text-2); margin-top: 2px; }
.nav-group { margin-bottom: 18px; }
.nav-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--sidebar-text-2); padding: 6px 10px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: var(--fs-md);
  cursor: pointer; transition: background var(--t-fast);
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 500; }
.nav-item .ico { width: 18px; text-align: center; font-size: 14px; }
.sidebar-user {
  margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: rgba(255,255,255,.05); border: 1px solid var(--sidebar-border);
}
.user-avatar {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%;
  background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm);
  overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { min-width: 0; }
.user-name { font-size: var(--fs-sm); color: #fff; font-weight: 500; }
.user-role { font-size: 10.5px; color: var(--sidebar-text-2); text-transform: uppercase; letter-spacing: .05em; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); padding: 0 22px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; z-index: 30;
}
.topbar-title { font-size: var(--fs-lg); font-weight: 600; }
.topbar-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 1px; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.content { flex: 1; padding: 24px 22px 60px; max-width: var(--content-max); width: 100%; }

/* ═══════════════════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-weight: 500; font-size: var(--fs-sm);
  transition: background var(--t-fast), border-color var(--t-fast); white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--surface); border-color: var(--red); color: var(--red); }
.btn.danger:hover:not(:disabled) { background: var(--red-soft); }
.btn.sm { padding: 6px 11px; font-size: var(--fs-xs); }
.btn.icon { padding: 0; width: 36px; height: 36px; justify-content: center; border-radius: var(--r-full); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.card-head h3 { font-size: var(--fs-lg); }

.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px 16px; position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), #ec4899); }
.k-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.k-value { font-size: var(--fs-2xl); font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.k-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 4px; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
thead th { background: var(--surface-2); text-align: left; padding: 10px 14px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text-2); }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); margin-bottom: 14px; }
.field input, .field select, .field textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text); font-size: var(--fs-md); width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .req { color: var(--red); }

/* Modals */
#modalWrap { position: fixed; inset: 0; z-index: 500; display: none; }
#modalWrap.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(26,21,51,.5); backdrop-filter: blur(4px); }
.modal { position: relative; background: var(--surface); border-radius: var(--r-xl); max-width: 600px; width: calc(100% - 32px); margin: 5vh auto; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .15s ease; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal.lg { max-width: 900px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: var(--fs-lg); }
.modal-body { padding: 22px; overflow: auto; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }
.icon-btn { width: 30px; height: 30px; border-radius: var(--r-sm); display: inline-grid; place-items: center; color: var(--text-3); font-size: 14px; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }

/* Toasts */
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 9000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; padding: 12px 16px; border-radius: var(--r-md); background: var(--text); color: var(--surface); font-size: var(--fs-sm); font-weight: 500; box-shadow: var(--shadow-lg); max-width: 380px; animation: slideIn var(--t-base); }
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════════════════

<script>
'use strict';

const CONFIG = {

  },
  adminEmail: "asifabooasif@gmail.com",
  dbName: "lanka_erp_v1",
  collections: [
    'coa', 'banks', 'items', 'parties', 'employees', 'jobs',
    'cheques', 'journalEntries', 'stockMoves', 'vouchers',
    'pettyCash', 'purchaseOrders', 'salesInvoices', 'trash'
  ]
};

const ROLES = {
  owner:   { level: 100, perms: { write: true,  approve: true,  delete: true,  users: true,  settings: true  } },
  admin:   { level: 90,  perms: { write: true,  approve: true,  delete: true,  users: true,  settings: true  } },
  viewer:  { level: 10,  perms: { write: false, approve: false, delete: false, users: false, settings: false } }
};

const state = {
  user: null, role: 'viewer', view: 'dashboard',
  settings: null, data: {}, firebaseReady: false
};
window.__LS__ = state;

const REGISTRY = { routes: {}, nav: [], actions: {}, inits: [] };
window.__LS_REGISTRY = REGISTRY;

window.__LS_addRoute = (id, title, fn) => { REGISTRY.routes[id] = { title, fn }; };
window.__LS_addNav = (item) => { REGISTRY.nav.push(item); };
window.__LS_registerAction = (id, fn) => { REGISTRY.actions[id] = fn; };
window.__LS_register = (id, fn) => { REGISTRY.inits.push({ id, fn }); };

const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const arr = v => Array.isArray(v) ? v : [];

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function today() {
  const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
const nowISO = () => new Date().toISOString();
function dateFmt(v) {
  if (!v) return '—';
  try { const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v); if (isNaN(d.getTime())) return String(v); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); } catch { return String(v); }
}
function money(v) {
  return 'Rs ' + Math.abs(num(v)).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}
window.toast = toast;

function openModal(title, contentHTML, opts) {
  opts = opts || {};
  const wrap = document.getElementById('modalWrap');
  wrap.innerHTML = `
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal ${opts.size || ''}" style="max-width:${opts.width || 600}px">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close-modal>✕</button></div>
      <div class="modal-body">${contentHTML}</div>
      ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}
    </div>`;
  wrap.classList.add('open');
}
window.openModal = openModal;

function closeModal() {
  const wrap = document.getElementById('modalWrap');
  wrap.classList.remove('open'); wrap.innerHTML = '';
}
window.closeModal = closeModal;

document.addEventListener('click', e => { if (e.target.closest('[data-close-modal]')) closeModal(); });
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S02 — FIREBASE & LOCAL DB ENGINE
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
let firebaseApp = null, auth = null, firestore = null;

function initFirebase() {
  try {
    if (!window.firebase) throw new Error('Firebase SDK failed to load');
    if (!firebase.apps.length) firebaseApp = firebase.initializeApp(CONFIG.firebase);
    else firebaseApp = firebase.app();
    auth = firebase.auth(firebaseApp);
    firestore = firebase.firestore(firebaseApp);
    state.firebaseReady = true;
    return true;
  } catch (e) { console.error(e); toast('Firebase Init Failed', 'error'); return false; }
}

function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(CONFIG.dbName, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      CONFIG.collections.forEach(col => {
        if (!db.objectStoreNames.contains(col)) db.createObjectStore(col, { keyPath: 'id' });
      });
    };
    req.onsuccess = e => { window._db = e.target.result; resolve(); };
    req.onerror = () => resolve();
  });
}

function dbAll(col) {
  return new Promise(res => {
    if (!window._db) return res([]);
    const req = window._db.transaction(col).objectStore(col).getAll();
    req.onsuccess = () => res(req.result || []);
  });
}

async function dbPut(col, obj, skipCloud) {
  if (!obj.id) obj.id = uid();
  obj.updatedAt = nowISO();
  return new Promise(res => {
    if (!window._db) return res(obj);
    const tx = window._db.transaction(col, 'readwrite');
    tx.objectStore(col).put(obj);
    tx.oncomplete = () => {
      if (!skipCloud && state.firebaseReady && auth.currentUser) {
        firestore.collection('erp_data').doc(col + '_' + obj.id).set(obj);
      }
      res(obj);
    };
  });
}

async function dbRemove(col, id) {
  return new Promise(res => {
    if (!window._db) return res();
    const tx = window._db.transaction(col, 'readwrite');
    tx.objectStore(col).delete(id);
    tx.oncomplete = () => {
      if (state.firebaseReady && auth.currentUser) {
        firestore.collection('erp_data').doc(col + '_' + id).delete();
      }
      res();
    };
  });
}
</script>

<script>
function renderNav() {
  const el = document.getElementById('nav');
  let html = '';
  let currentGroup = '';

  REGISTRY.nav.forEach(item => {
    if (item.group !== currentGroup) {
      if (currentGroup !== '') html += '</div>';
      html += `<div class="nav-group"><div class="nav-label">${item.group}</div>`;
      currentGroup = item.group;
    }
    html += `
      <div class="nav-item ${state.view === item.id ? 'active' : ''}" data-nav="${item.id}">
        <span class="ico">${item.ico}</span>
        <span>${esc(item.label)}</span>
      </div>`;
  });
  if (currentGroup !== '') html += '</div>';
  el.innerHTML = html;
}

function navigate(view) {
  location.hash = '#/' + view;
}

async function handleRoute() {
  const path = location.hash.replace(/^#\/?/, '') || 'dashboard';
  state.view = path;
  const route = REGISTRY.routes[path] || REGISTRY.routes['dashboard'];
  
  renderNav();
  
  const view = document.getElementById('view');
  view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">Loading...</div>';
  
  try {
    if (route && route.fn) {
      const content = await route.fn();
      view.innerHTML = content;
      document.getElementById('pageTitle').textContent = route.title;
    }
  } catch (e) {
    view.innerHTML = `<div class="card" style="color:var(--red)">Render Error: ${esc(e.message)}</div>`;
    console.error(e);
  }
}

window.addEventListener('hashchange', handleRoute);

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  
  const action = e.target.closest('[data-action]');
  if (action) {
    const fn = REGISTRY.actions[action.dataset.action];
    if (fn) fn(e, action.dataset.id);
  }
});

function renderUser() {
  if (!state.user) return;
  const el = document.getElementById('sidebarUser');
  const initials = (state.user.displayName || 'U').charAt(0);
  el.innerHTML = `
    <div class="user-avatar">${state.user.photoURL ? `<img src="${esc(state.user.photoURL)}">` : initials}</div>
    <div class="user-info">
      <div class="user-name">${esc(state.user.displayName)}</div>
      <div class="user-role">${state.role}</div>
    </div>
  `;
}
</script>

     S05 — AUTH & BOOT
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
async function boot() {
  await initDB();
  
  // Load data from IndexedDB into memory
  for (const col of CONFIG.collections) {
    state.data[col] = await dbAll(col);
  }

  if (!initFirebase()) {
    document.getElementById('googleBtnText').textContent = 'Firebase Failed';
    return;
  }

  document.getElementById('googleBtn').onclick = async () => {
    const btn = document.getElementById('googleBtn');
    btn.disabled = true;
    document.getElementById('googleBtnText').textContent = 'Connecting...';
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false;
      document.getElementById('googleBtnText').textContent = 'Continue with Google';
    }
  };

  auth.onAuthStateChanged(user => {
    if (user) {
      state.user = user;
      state.role = user.email === CONFIG.adminEmail ? 'owner' : 'admin';
      
      document.getElementById('loginWrap').classList.add('hidden');
      document.getElementById('appRoot').classList.remove('hidden');
      
      renderUser();
      handleRoute();
      
      // Run registered scripts
      REGISTRY.inits.forEach(init => {
        try { init.fn(); } catch (e) { console.error(e); }
      });
    } else {
      document.getElementById('loginWrap').classList.remove('hidden');
      document.getElementById('appRoot').classList.add('hidden');
      state.user = null;
    }
  });

  document.getElementById('themeBtn').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'professional' ? 'dark' : 'professional');
  };

  document.getElementById('signOutBtn').onclick = () => {
    if (confirm('Sign out?')) auth.signOut();
  };
}

boot();
</script>
<!-- =====================================================================
     PART 2 — DOUBLE-ENTRY ACCOUNTING ENGINE
===================================================================== -->
<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 1. THE CORE LEDGER ENGINE (Strict Double-Entry)
  // ═══════════════════════════════════════════════════════════════════════
  window.ERP = window.ERP || {};
  
  ERP.ledger = {
    post: async function (data) {
      const date = data.date || today();
      const lines = data.lines || [];
      
      let totalDr = 0;
      let totalCr = 0;
      const validLines = [];

      // Validate lines
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        const acct = state.data.coa.find(a => a.id === l.accountId);
        if (!acct) throw new Error('Line ' + (i+1) + ': Account not found.');
        
        const dr = num(l.debit);
        const cr = num(l.credit);
        
        if (dr === 0 && cr === 0) continue; // Skip empty lines
        if (dr > 0 && cr > 0) throw new Error('Line ' + (i+1) + ': Cannot have both Debit and Credit.');
        
        totalDr += dr;
        totalCr += cr;
        
        validLines.push({
          accountId: acct.id,
          accountCode: acct.code,
          accountName: acct.name,
          debit: dr,
          credit: cr,
          narration: l.narration || ''
        });
      }

      if (validLines.length < 2) {
        throw new Error('A journal entry must have at least 2 lines.');
      }

      // Strict Enforcement
      if (Math.abs(totalDr - totalCr) > 0.001) {
        throw new Error('Unbalanced entry: Dr (' + money(totalDr) + ') ≠ Cr (' + money(totalCr) + ')');
      }

      // Save to Database
      const entry = {
        id: uid(),
        date: date,
        reference: data.reference || '',
        narration: data.narration || '',
        lines: validLines,
        totalDr: totalDr,
        totalCr: totalCr,
        createdAt: nowISO()
      };

      state.data.journalEntries.push(entry);
      await dbPut('journalEntries', entry);
      return entry;
    },
    
    // Get balance of a specific account
    getBalance: function (accountId, uptoDate) {
      let bal = 0;
      state.data.journalEntries.forEach(je => {
        if (uptoDate && je.date > uptoDate) return;
        je.lines.forEach(l => {
          if (l.accountId === accountId) {
            bal += (l.debit - l.credit);
          }
        });
      });
      return bal;
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 2. AUTO-SEED CHART OF ACCOUNTS
  // ═══════════════════════════════════════════════════════════════════════
  async function seedCOA() {
    if (state.data.coa && state.data.coa.length > 0) return;

    const defaultAccounts = [
      // Assets
      { code: '1000', name: 'Cash in Hand', type: 'asset' },
      { code: '1010', name: 'Bank Account', type: 'asset' },
      { code: '1100', name: 'Accounts Receivable', type: 'asset' },
      { code: '1200', name: 'Raw Materials', type: 'asset' },
      { code: '1220', name: 'Work In Progress (WIP)', type: 'asset' },
      { code: '1230', name: 'Finished Goods', type: 'asset' },
      // Liabilities
      { code: '2000', name: 'Accounts Payable', type: 'liability' },
      { code: '2100', name: 'Accrued Expenses', type: 'liability' },
      // Equity
      { code: '3000', name: 'Owner Capital', type: 'equity' },
      // Income
      { code: '4000', name: 'Sales Revenue', type: 'income' },
      { code: '4900', name: 'Other Income', type: 'income' },
      // Expenses
      { code: '5000', name: 'Cost of Goods Sold', type: 'expense' },
      { code: '5020', name: 'Direct Labour', type: 'expense' },
      { code: '5030', name: 'Factory Overhead', type: 'expense' },
      { code: '5040', name: 'Wastage Loss', type: 'expense' },
      { code: '6000', name: 'Administration Expenses', type: 'expense' }
    ];

    for (const acc of defaultAccounts) {
      const record = {
        id: uid(),
        code: acc.code,
        name: acc.name,
        type: acc.type,
        isGroup: false,
        active: true
      };
      state.data.coa.push(record);
      await dbPut('coa', record);
    }
    toast('Default Chart of Accounts seeded.', 'success');
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 3. CHART OF ACCOUNTS VIEW
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addNav({ group: 'Accounting', id: 'coa', ico: '📒', label: 'Chart of Accounts' });
  __LS_addNav({ group: 'Accounting', id: 'journal', ico: '📝', label: 'Journal Entries' });
  __LS_addNav({ group: 'Accounting', id: 'ledger', ico: '📖', label: 'General Ledger' });

  __LS_addRoute('coa', 'Chart of Accounts', async () => {
    const accounts = state.data.coa.sort((a,b) => a.code.localeCompare(b.code));
    
    let rows = accounts.map(a => `
      <tr>
        <td class="mono">${esc(a.code)}</td>
        <td><strong>${esc(a.name)}</strong></td>
        <td><span class="badge" style="background:var(--surface-2)">${esc(a.type).toUpperCase()}</span></td>
        <td class="num">${money(ERP.ledger.getBalance(a.id))}</td>
      </tr>
    `).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>Chart of Accounts</h3>
          <button class="btn primary" data-action="coa-new">＋ New Account</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Code</th><th>Account Name</th><th>Type</th><th class="num">Current Balance</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('coa-new', () => {
    openModal('New Account', `
      <div class="field"><label>Code</label><input id="coa-code" placeholder="e.g. 1050"></div>
      <div class="field"><label>Name</label><input id="coa-name" placeholder="e.g. Petty Cash"></div>
      <div class="field"><label>Type</label>
        <select id="coa-type">
          <option value="asset">Asset</option>
          <option value="liability">Liability</option>
          <option value="equity">Equity</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
    `, {
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="coa-save">Save</button>`
    });

    document.getElementById('coa-save').onclick = async () => {
      const code = document.getElementById('coa-code').value.trim();
      const name = document.getElementById('coa-name').value.trim();
      const type = document.getElementById('coa-type').value;
      if (!code || !name) return toast('Code and Name required', 'error');

      const rec = { id: uid(), code, name, type, isGroup: false, active: true };
      state.data.coa.push(rec);
      await dbPut('coa', rec);
      closeModal();
      handleRoute();
      toast('Account created', 'success');
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 4. JOURNAL ENTRIES VIEW
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('journal', 'Journal Entries', async () => {
    const entries = [...state.data.journalEntries].sort((a,b) => b.date.localeCompare(a.date));
    
    let rows = entries.map(e => `
      <tr>
        <td>${dateFmt(e.date)}</td>
        <td class="mono">${esc(e.reference) || '—'}</td>
        <td>${esc(e.narration)}</td>
        <td class="num">${money(e.totalDr)}</td>
        <td><button class="btn sm" data-action="journal-view" data-id="${e.id}">View</button></td>
      </tr>
    `).join('');

    return `
      <div class="card">
        <div class="card-head">
          <h3>Journal Entries</h3>
          <button class="btn primary" data-action="journal-new">＋ New Journal</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Reference</th><th>Narration</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">No entries yet.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  __LS_registerAction('journal-view', (ev, id) => {
    const e = state.data.journalEntries.find(x => x.id === id);
    if (!e) return;
    
    let rows = e.lines.map(l => `
      <tr>
        <td>${esc(l.accountName)}</td>
        <td>${esc(l.narration)}</td>
        <td class="num">${l.debit ? money(l.debit) : ''}</td>
        <td class="num">${l.credit ? money(l.credit) : ''}</td>
      </tr>
    `).join('');

    openModal('Journal Details', `
      <div style="margin-bottom:16px;">
        <div class="small muted">Date</div><div>${dateFmt(e.date)}</div>
        <div class="small muted" style="margin-top:8px;">Narration</div><div>${esc(e.narration)}</div>
      </div>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:8px 0;">Account</th><th style="text-align:left;">Narration</th><th style="text-align:right;">Debit</th><th style="text-align:right;">Credit</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="border-top:2px solid var(--border); font-weight:bold;"><td colspan="2" style="padding-top:8px;">Total</td><td class="num" style="padding-top:8px;">${money(e.totalDr)}</td><td class="num" style="padding-top:8px;">${money(e.totalCr)}</td></tr></tfoot>
      </table>
    `, { size: 'lg', footer: `<button class="btn" data-close-modal>Close</button>` });
  });

  __LS_registerAction('journal-new', () => {
    let lineCount = 2;
    
    const buildLine = (idx) => `
      <div class="j-line" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:8px; margin-bottom:8px;">
        <select class="j-acc" data-idx="${idx}">
          <option value="">— Select Account —</option>
          ${state.data.coa.sort((a,b)=>a.code.localeCompare(b.code)).map(a => `<option value="${a.id}">${a.code} - ${a.name}</option>`).join('')}
        </select>
        <input type="number" class="j-dr" placeholder="Debit" step="0.01">
        <input type="number" class="j-cr" placeholder="Credit" step="0.01">
      </div>
    `;

    const body = `
      <div class="field"><label>Date</label><input type="date" id="j-date" value="${today()}"></div>
      <div class="field"><label>Narration</label><input id="j-narr" placeholder="e.g. Owner capital introduced"></div>
      <div style="margin-top:16px; font-weight:bold; font-size:12px; margin-bottom:8px;">Lines</div>
      <div id="j-lines">${buildLine(0)}${buildLine(1)}</div>
      <button class="btn sm" id="j-add" style="margin-top:8px;">+ Add Line</button>
      
      <div style="margin-top:20px; padding:12px; background:var(--surface-2); border-radius:8px; display:flex; justify-content:space-between; font-weight:bold;">
        <span>Total Dr: <span id="j-tot-dr">0.00</span></span>
        <span>Total Cr: <span id="j-tot-cr">0.00</span></span>
        <span id="j-diff" style="color:var(--green);">Balanced</span>
      </div>
    `;

    openModal('New Journal Entry', body, {
      size: 'lg',
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="j-save">Post Entry</button>`
    });

    const linesHost = document.getElementById('j-lines');
    
    // Add line
    document.getElementById('j-add').onclick = () => {
      linesHost.insertAdjacentHTML('beforeend', buildLine(lineCount++));
      bindLines();
    };

    // Auto-calculate
    function bindLines() {
      document.querySelectorAll('.j-dr').forEach(inp => {
        inp.oninput = (e) => {
          if (num(e.target.value) > 0) {
            const crInp = e.target.nextElementSibling;
            if (crInp) crInp.value = '';
          }
          calc();
        };
      });
      document.querySelectorAll('.j-cr').forEach(inp => {
        inp.oninput = (e) => {
          if (num(e.target.value) > 0) {
            const drInp = e.target.previousElementSibling;
            if (drInp) drInp.value = '';
          }
          calc();
        };
      });
    }
    
    function calc() {
      let dr = 0, cr = 0;
      document.querySelectorAll('.j-dr').forEach(i => dr += num(i.value));
      document.querySelectorAll('.j-cr').forEach(i => cr += num(i.value));
      
      document.getElementById('j-tot-dr').textContent = money(dr);
      document.getElementById('j-tot-cr').textContent = money(cr);
      
      const diff = Math.abs(dr - cr);
      const el = document.getElementById('j-diff');
      if (diff < 0.01 && dr > 0) {
        el.textContent = 'Balanced';
        el.style.color = 'var(--green)';
      } else {
        el.textContent = 'Diff: ' + money(diff);
        el.style.color = 'var(--red)';
      }
    }
    bindLines();

    // Save
    document.getElementById('j-save').onclick = async () => {
      const date = document.getElementById('j-date').value;
      const narration = document.getElementById('j-narr').value.trim();
      const lines = [];

      const rows = linesHost.querySelectorAll('.j-line');
      rows.forEach(r => {
        const acc = r.querySelector('.j-acc').value;
        const dr = num(r.querySelector('.j-dr').value);
        const cr = num(r.querySelector('.j-cr').value);
        if (acc && (dr > 0 || cr > 0)) {
          lines.push({ accountId: acc, debit: dr, credit: cr });
        }
      });

      try {
        await ERP.ledger.post({ date, narration, lines });
        closeModal();
        handleRoute();
        toast('Journal posted successfully', 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    };
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 5. GENERAL LEDGER VIEW
  // ═══════════════════════════════════════════════════════════════════════
  __LS_addRoute('ledger', 'General Ledger', async () => {
    return `
      <div class="card">
        <div class="card-head">
          <h3>General Ledger</h3>
          <select id="ledger-acc" style="padding:8px; border-radius:8px; border:1px solid var(--border);">
            <option value="">— Select Account —</option>
            ${state.data.coa.sort((a,b)=>a.code.localeCompare(b.code)).map(a => `<option value="${a.id}">${a.code} - ${a.name}</option>`).join('')}
          </select>
        </div>
        <div id="ledger-body" style="min-height:200px;"></div>
      </div>
    `;
  });

  __LS_register('part2-ledger-bind', () => {
    setTimeout(() => {
      const sel = document.getElementById('ledger-acc');
      if (!sel) return;
      
      sel.onchange = () => {
        const accId = sel.value;
        const body = document.getElementById('ledger-body');
        
        if (!accId) { body.innerHTML = '<div class="empty">Select an account to view transactions.</div>'; return; }

        const entries = state.data.journalEntries.filter(je => je.lines.some(l => l.accountId === accId)).sort((a,b)=>a.date.localeCompare(b.date));
        
        let runBal = 0;
        let rows = entries.map(e => {
          const line = e.lines.find(l => l.accountId === accId);
          runBal += (line.debit - line.credit);
          return `
            <tr>
              <td>${dateFmt(e.date)}</td>
              <td>${esc(e.reference) || '—'}</td>
              <td>${esc(e.narration)}</td>
              <td class="num">${line.debit ? money(line.debit) : ''}</td>
              <td class="num">${line.credit ? money(line.credit) : ''}</td>
              <td class="num" style="font-weight:bold;">${money(runBal)}</td>
            </tr>
          `;
        }).join('');

        body.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Ref</th><th>Narration</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-3)">No transactions for this account.</td></tr>'}</tbody>
            </table>
          </div>
        `;
      };
    }, 100);
  });

  // ═══════════════════════════════════════════════════════════════════════
  // 6. INITIALIZE
  // ═══════════════════════════════════════════════════════════════════════
  __LS_register('part2-init', async () => {
    await seedCOA();
    handleRoute(); // Refresh if needed
  });

})();
</script>

<script>

  __LS_registerAction('item-new', () => {
    openModal('Create New Item', `
      <div class="field"><label>Item Type</label>

    const typeSel = document.getElementById('i-type');

    const hasMatrixCb = document.getElementById('i-has-matrix');

      colors.forEach(c => {
        sizes.forEach(s => {
          const sku = `${baseCode}-${c.slice(0,3).toUpperCase()}-${s}`.replace(/\s+/g, '');

      if (type === 'fg' && hasMatrixCb.checked) {
        if (!generatedVariants.length) return toast('Click "Generate Preview" first.', 'error');
        
        // Save Parent
        const parentId = uid();
        const parent = { id: parentId, name, code, type: 'fg', isParent: true, cost: 0 };
        state.data.items.push(parent);
        await dbPut('items', parent);

        // Save Variants
        for (const v of generatedVariants) {

            id: uid(),

            name: `${name} - ${v.color} - ${v.size}`,
            code: v.code,
            type: 'fg',

        await dbPut('items', item);
        toast('Item saved', 'success');

      closeModal();
      handleRoute();
