<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanka Slipper - Enterprise ERP (Massive)</title>
<style>
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface2: #f9fafc;
  --line: #e3e8ef; --line2: #eef1f6;
  --text: #101828; --text2: #344054; --muted: #667085; --muted2: #98a2b3;
  --sb: #0d1729; --sb2: #16233a; --sbt: #c2cbdc; --sba: #1f6feb;
  --brand: #1f6feb; --brand2: #1554c0; --brandsoft: #eaf1fe;
  --ok: #0f9d58; --oksoft: #e6f6ee; --warn: #c47f17; --warnsoft: #fdf4e3;
  --danger: #d92d20; --dangersoft: #feeceb;
  --r: 10px; --sh: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --shlg: 0 12px 32px rgba(16,24,40,.14);
  --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #cfd6e2; border-radius: 8px; border: 2px solid var(--bg); }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 260px; flex: 0 0 260px; background: var(--sb); color: var(--sbt); display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 60; }
.sb-head { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid rgba(255,255,255,.07); }
.sb-logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #1f6feb, #4f9cf9); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
.sb-title { font-size: 14px; font-weight: 700; color: #fff; }
.sb-sub { font-size: 11px; color: #7f8ca6; }
.sb-nav { flex: 1; overflow-y: auto; padding: 10px 8px 24px; }
.sb-group { margin-top: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.sb-group-h { display: flex; justify-content: space-between; padding: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: #68789a; font-weight: 700; cursor: pointer; }
.sb-group-h:hover { color: #93a3c2; }
.sb-items { display: none; padding-bottom: 8px; }
.sb-group.open .sb-items { display: block; }
.sb-group.open .sb-group-h { color: #fff; }
.sb-item { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 7px; color: var(--sbt); font-size: 13px; cursor: pointer; margin-bottom: 2px; }
.sb-item:hover { background: var(--sb2); color: #fff; }
.sb-item.active { background: var(--sba); color: #fff; font-weight: 600; }
.sb-item .dot { width: 5px; height: 5px; border-radius: 50%; background: #4a5b78; }
.sb-item.active .dot { background: #fff; }

.main { flex: 1; min-width: 0; margin-left: 260px; display: flex; flex-direction: column; }
.topbar { height: 58px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
.tb-title { font-size: 16px; font-weight: 650; }
.tb-spacer { flex: 1; }
.tb-chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 600; color: var(--text2); }
.tb-user { display: flex; align-items: center; gap: 10px; margin-left: 15px; font-size: 13px; font-weight: 600; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; }

.view { padding: 24px; flex: 1; }

/* UI Elements */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.page-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text2); }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand2); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
.card-head { padding: 16px; border-bottom: 1px solid var(--line2); font-weight: 650; font-size: 14px; }
.card-body { padding: 16px; }
.card-body.p0 { padding: 0; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media(max-width: 1100px) { .g4, .g3 { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 768px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--sh); }
.kpi-l { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.kpi-v { font-size: 24px; font-weight: 700; margin-top: 8px; color: var(--brand); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th { text-align: left; padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--line); font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
table.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--line2); }
table.tbl tbody tr:hover { background: #fafbfd; }

.badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.badge.ok { background: var(--oksoft); color: var(--ok); }
.badge.warn { background: var(--warnsoft); color: var(--warn); }
.badge.danger { background: var(--dangersoft); color: var(--danger); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text2); }
.input, .select, .textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--brand); }
.input[readonly] { background: var(--surface2); color: var(--muted); }

/* Modal */
.modal-veil { position: fixed; inset: 0; background: rgba(16,24,40,.6); display: grid; place-items: center; z-index: 300; padding: 20px; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shlg); animation: pop .15s ease; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal.lg { max-width: 900px; }
.modal.xl { max-width: 1100px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line2); font-weight: 700; font-size: 16px; }
.modal-x { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 16px 20px; border-top: 1px solid var(--line2); display: flex; justify-content: flex-end; gap: 10px; background: var(--surface2); border-radius: 0 0 12px 12px; }

/* Toasts */
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 500; }
.toast { background: #101828; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shlg); animation: slide .2s ease; }
.toast.ok { background: var(--ok); }
.toast.err { background: var(--danger); }
@keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Auth Overlay */
.auth-overlay { position: fixed; inset: 0; background: var(--sb); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
.auth-box { background: var(--surface); color: var(--text); padding: 40px; border-radius: 14px; text-align: center; box-shadow: var(--shlg); width: 100%; max-width: 400px; }
.btn-google { background: #fff; color: #333; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 20px; }
.btn-google:hover { background: #f9f9f9; }
</style>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="authOverlay" class="auth-overlay" style="display:none;">
  <div class="auth-box">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#1f6feb,#4f9cf9);display:grid;place-items:center;margin:0 auto 20px;font-size:28px;font-weight:800;color:#fff;">LS</div>
    <h2 style="margin-bottom:10px;">Lanka Slipper ERP</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">Sign in to sync your factory data securely.</p>
    <button class="btn-google" id="btnGoogleLogin">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Sign in with Google
    </button>
  </div>
</div>

<div class="app" id="app" style="visibility:hidden;">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-logo">LS</div>
      <div><div class="sb-title">Lanka Slipper</div><div class="sb-sub">Enterprise ERP</div></div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="tb-title" id="tbTitle">Dashboard</div>
      <div class="tb-spacer"></div>
      <div class="tb-chip" id="tbFactory">Factory Main</div>
      <div class="tb-user"><div class="avatar" id="tbAvatar">A</div> <span id="tbUserName">Admin</span></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

const ERP = window.ERP = window.ERP || {};
ERP.ctx = { user: null };

ERP.config = {
  dbName: 'lanka_enterprise_v3',
  currency: { symbol: 'Rs', decimals: 2 },
  collections: [
    // Masters
    'coa', 'items', 'parties', 'employees', 'machines',
    // Job Costing
    'jobs', 'jobCosts', 'vouchers', 'wastages',
    // PDC & Banking
    'pdc_received', 'pdc_issued', 'bank_reconciliation',
    // Inventory & Purchasing
    'stockMoves', 'purchaseOrders', 'grns', 'purchaseInvoices', 'purchaseReturns',
    // Sales
    'salesOrders', 'deliveries', 'salesInvoices', 'salesReturns',
    // Payroll
    'attendance', 'payrollRuns', 'advances',
    // Financials
    'journalEntries', 'pettyCash', 'fixedAssets'
  ]
};

/* =====================================================================
   1. MASSIVE DATABASE ENGINE (IndexedDB + Firebase Sync)
===================================================================== */
ERP.db = (function() {
  const dbName = ERP.config.dbName;
  const dbVersion = 1;
  let dbInstance = null;

  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(dbName, dbVersion);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        ERP.config.collections.forEach(col => {
          if (!db.objectStoreNames.contains(col)) db.createObjectStore(col, { keyPath: 'id' });
        });
      };
      req.onsuccess = e => { dbInstance = e.target.result; resolve(); };
      req.onerror = e => reject(e);
    });
  }

  function getStore(col, mode = 'readonly') {
    return dbInstance.transaction(col, mode).objectStore(col);
  }

  return {
    init: initDB,
    all: (col) => new Promise(res => {
      const req = getStore(col).getAll();
      req.onsuccess = () => res(req.result);
    }),
    get: (col, id) => new Promise(res => {
      const req = getStore(col).get(id);
      req.onsuccess = () => res(req.result);
    }),
    put: async (col, obj) => {
      if (!obj.id) obj.id = 'rec_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      obj.updatedAt = Date.now();
      await new Promise(res => {
        const req = getStore(col, 'readwrite').put(obj);
        req.onsuccess = () => res();
      });
      // Sync to Firebase
      if(ERP.ctx.user) {
        const db = firebase.firestore();
        db.collection('users').doc(ERP.ctx.user.uid).collection('erp_data').doc(col + '_' + obj.id).set(obj);
      }
      return obj;
    },
    remove: async (col, id) => {
      await new Promise(res => {
        const req = getStore(col, 'readwrite').delete(id);
        req.onsuccess = () => res();
      });
      if(ERP.ctx.user) {
        const db = firebase.firestore();
        db.collection('users').doc(ERP.ctx.user.uid).collection('erp_data').doc(col + '_' + id).delete();
      }
    }
  };
})();

/* =====================================================================
   2. UI KIT (Advanced)
===================================================================== */
ERP.ui = (function() {
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => {
      const v = attrs[k];
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false) el.setAttribute(k, v);
    });
    children.forEach(c => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(x => {
         if (x instanceof Node) el.appendChild(x);
         else el.appendChild(document.createTextNode(String(x)));
      });
      else if (c instanceof Node) el.appendChild(c);
      else el.appendChild(document.createTextNode(String(c)));
    });
    return el;
  }

  function toast(msg, type) {
    const el = h('div', { class: 'toast ' + (type || '') }, msg);
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function modal(cfg) {
    const veil = h('div', { class: 'modal-veil' });
    const box = h('div', { class: 'modal ' + (cfg.size || '') });
    box.appendChild(h('div', { class: 'modal-head' }, cfg.title, h('button', { class: 'modal-x', onclick: () => veil.remove() }, '×')));
    const body = h('div', { class: 'modal-body' });
    if (typeof cfg.content === 'string') body.innerHTML = cfg.content;
    else body.appendChild(cfg.content);
    box.appendChild(body);
    
    if (cfg.actions) {
      const foot = h('div', { class: 'modal-foot' });
      cfg.actions.forEach(a => foot.appendChild(h('button', { class: 'btn ' + (a.primary ? 'btn-primary' : ''), onclick: () => a.onClick(() => veil.remove()) }, a.label)));
      box.appendChild(foot);
    }
    veil.appendChild(box);
    document.getElementById('modalRoot').appendChild(veil);
    return { close: () => veil.remove(), el: veil };
  }

  function table(cfg) {
    const t = h('table', { class: 'tbl' });
    const tr = h('tr');
    cfg.columns.forEach(c => tr.appendChild(h('th', { style: { textAlign: c.align || 'left' } }, c.label)));
    t.appendChild(h('thead', null, tr));
    
    const tb = h('tbody');
    if (!cfg.rows || !cfg.rows.length) {
      tb.appendChild(h('tr', null, h('td', { colspan: cfg.columns.length, style: { textAlign: 'center', color: 'var(--muted)' } }, cfg.empty || 'No records found.')));
    } else {
      cfg.rows.forEach(r => {
        const row = h('tr');
        cfg.columns.forEach(c => {
          const val = c.render ? c.render(r[c.key], r) : r[c.key];
          const td = h('td', { style: { textAlign: c.align || 'left' } });
          if (val instanceof Node) td.appendChild(val);
          else td.textContent = val || '';
          row.appendChild(td);
        });
        tb.appendChild(row);
      });
    }
    t.appendChild(tb);
    return t;
  }

  function page(title, subtitle, actions, content) {
    return h('div', null,
      h('div', { class: 'page-head' },
        h('div', null, h('div', { class: 'page-title' }, title), h('div', { class: 'page-sub' }, subtitle || '')),
        h('div', { style: { display: 'flex', gap: '10px' } }, ...(actions || []))
      ),
      content
    );
  }

  return { h, toast, modal, table, page };
})();

/* =====================================================================
   3. UTILS
===================================================================== */
ERP.util = {
  money: (n) => ERP.config.currency.symbol + ' ' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2 }),
  date: () => new Date().toISOString().split('T')[0],
  fmtDate: (d) => d ? d.split('-').reverse().join('/') : '-'
};

/* =====================================================================
   4. ROUTER & NAVIGATION (Massive Structure)
===================================================================== */
ERP.nav = [
  { group: 'Overview', items: [{ l: 'Dashboard', r: 'home' }] },
  { group: 'Masters', items: [
    { l: 'Chart of Accounts', r: 'masters/coa' },
    { l: 'Items (Matrix)', r: 'masters/items' },
    { l: 'Parties', r: 'masters/parties' },
    { l: 'Employees', r: 'masters/employees' }
  ]},
  { group: 'Job Costing', items: [
    { l: 'Jobs (Orders)', r: 'jobs' },
    { l: 'Factory Vouchers', r: 'vouchers' }
  ]},
  { group: 'Banking & PDC', items: [
    { l: 'PDC Register (In/Out)', r: 'banking/pdc' },
    { l: 'Bank Reconciliation', r: 'banking/reconciliation' }
  ]},
  { group: 'Sales & Purchases', items: [
    { l: 'Sales Invoices', r: 'sales/invoices' },
    { l: 'Delivery Notes', r: 'sales/deliveries' },
    { l: 'Purchase Invoices', r: 'purchases/invoices' }
  ]},
  { group: 'Accounts', items: [
    { l: 'General Ledger', r: 'accounting/ledger' },
    { l: 'Trial Balance', r: 'accounting/tb' },
    { l: 'Profit & Loss', r: 'accounting/pnl' },
    { l: 'Balance Sheet', r: 'accounting/bs' }
  ]}
];

ERP.layout = {
  buildNav: function() {
    const el = document.getElementById('sbNav'); el.innerHTML = '';
    const path = location.hash.replace('#/', '') || 'home';
    
    ERP.nav.forEach(g => {
      const isCurrent = g.items.some(i => i.r === path);
      const grp = ERP.ui.h('div', { class: 'sb-group' + (isCurrent ? ' open' : '') });
      
      grp.appendChild(ERP.ui.h('div', { class: 'sb-group-h', onclick: () => { grp.classList.toggle('open'); }}, 
        ERP.ui.h('span', null, g.group), ERP.ui.h('span', null, '▾')));
      
      const items = ERP.ui.h('div', { class: 'sb-items' });
      g.items.forEach(i => {
        items.appendChild(ERP.ui.h('div', { class: 'sb-item' + (path === i.r ? ' active' : ''), onclick: () => location.hash = '#/' + i.r },
          ERP.ui.h('span', { class: 'dot' }), ERP.ui.h('span', null, i.l)
        ));
      });
      grp.appendChild(items);
      el.appendChild(grp);
    });
  }
};

ERP.router = function() {
  const path = location.hash.replace('#/', '') || 'home';
  const view = document.getElementById('view');
  view.innerHTML = '';
  
  // Screens will be injected here in subsequent parts
  const map = {
    'home': ERP.screens.dashboard
  };

  if (map[path]) {
    view.appendChild(map[path]());
    document.getElementById('tbTitle').textContent = document.querySelector(`.sb-item[onclick*="${path}"]`)?.textContent || 'Dashboard';
  } else {
    view.appendChild(ERP.ui.page('Under Construction', 'This massive module will be built in the next parts.', [], 
      ERP.ui.h('div', { class: 'card card-body' }, 'Waiting for next script...')));
  }
  ERP.layout.buildNav();
};
window.addEventListener('hashchange', ERP.router);

/* =====================================================================
   5. SCREENS
===================================================================== */
ERP.screens = {};

ERP.screens.dashboard = function() {
  return ERP.ui.page('Dashboard', 'Enterprise Overview', [], 
    ERP.ui.h('div', { class: 'grid g4' },
      ERP.ui.h('div', { class: 'kpi' }, ERP.ui.h('div', { class: 'kpi-l' }, 'System Status'), ERP.ui.h('div', { class: 'kpi-v', style: { color: 'var(--ok)' } }, 'Online')),
      ERP.ui.h('div', { class: 'kpi' }, ERP.ui.h('div', { class: 'kpi-l' }, 'Cloud Sync'), ERP.ui.h('div', { class: 'kpi-v' }, ERP.ctx.user ? 'Connected' : 'Offline')),
      ERP.ui.h('div', { class: 'kpi' }, ERP.ui.h('div', { class: 'kpi-l' }, 'Database'), ERP.ui.h('div', { class: 'kpi-v' }, 'IndexedDB')),
      ERP.ui.h('div', { class: 'kpi' }, ERP.ui.h('div', { class: 'kpi-l' }, 'User'), ERP.ui.h('div', { class: 'kpi-v', style:{fontSize:'16px'} }, ERP.ctx.user?.displayName || '-'))
    )
  );
};

/* =====================================================================
   6. FIREBASE AUTH & BOOT
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCemkHwGDXgINLKSZAGebuXufJV1Vgc6NI",
  authDomain: "factory-manager-1b5fa.firebaseapp.com",
  projectId: "factory-manager-1b5fa",
  storageBucket: "factory-manager-1b5fa.firebasestorage.app",
  messagingSenderId: "869478675654",
  appId: "1:869478675654:web:a2ff3d1b2c1e215b5893c7",
  measurementId: "G-TWGLLG6RGE"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById('btnGoogleLogin').onclick = function() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert(err.message));
};

auth.onAuthStateChanged(async (user) => {
  if (user) {
    ERP.ctx.user = user;
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('app').style.visibility = 'visible';
    document.getElementById('tbUserName').textContent = user.displayName;
    document.getElementById('tbAvatar').textContent = user.displayName.charAt(0).toUpperCase();

    // Initialize DB
    await ERP.db.init();

    // Initial Pull from Cloud if local is empty
    if (!localStorage.getItem('erp_synced_v3_' + user.uid)) {
      ERP.ui.toast('Pulling your massive data from Cloud...', 'ok');
      const db = firebase.firestore();
      const snap = await db.collection('users').doc(user.uid).collection('erp_data').get();
      if (!snap.empty) {
         // Clear IndexedDB for this user
         for (const col of ERP.config.collections) {
            const items = await ERP.db.all(col);
            for (const item of items) { await ERP.db.remove(col, item.id); }
         }
         
         // Pull new
         for (const doc of snap.docs) {
            const data = doc.data();
            const col = doc.id.split('_')[0];
            if (ERP.config.collections.includes(col)) {
               await ERP.db.put(col, data);
            }
         }
      }
      localStorage.setItem('erp_synced_v3_' + user.uid, 'true');
      window.location.reload();
    }

    if (!location.hash) location.hash = '#/home';
    ERP.router();
  } else {
    document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('app').style.visibility = 'hidden';
  }
});

})();
</script>

<script>
(function(){
'use strict';
const ERP = window.ERP;
if (!ERP) return;
const {h, toast, modal, table, page} = ERP.ui;
const {money, date, fmtDate} = ERP.util;

/* =====================================================================
   1. CHART OF ACCOUNTS
===================================================================== */
ERP.screens.coa = function() {
  const render = async () => {
    const rows = await ERP.db.all('coa');
    return table({ columns: [
      { label:'Code', key:'code', class:'mono' },
      { label:'Account Name', key:'name' },
      { label:'Type', key:'type', render:v => h('span',{class:'badge ok'}, v.toUpperCase()) },
      { label:'', render:r => h('button', {class:'btn btn-sm', onclick:() => openForm(r)}, 'Edit') }
    ], rows: rows.sort((a,b)=>a.code.localeCompare(b.code)), empty: 'No accounts found.' });
  };

  const openForm = (existing) => {
    const form = h('div');
    const inputs = {};
    const fields = [
      { name: 'code', label: 'Account Code' },
      { name: 'name', label: 'Account Name' },
      { name: 'type', label: 'Type', type: 'select', options: [
        { value: 'asset', label: 'Asset' }, { value: 'liability', label: 'Liability' },
        { value: 'equity', label: 'Equity' }, { value: 'income', label: 'Income' },
        { value: 'expense', label: 'Expense' }
      ]}
    ];

    fields.forEach(f => {
      let inp;
      if (f.type === 'select') {
        inp = h('select', { class: 'select' }, ...f.options.map(o => h('option', { value: o.value, selected: existing && existing[f.name]===o.value }, o.label)));
      } else {
        inp = h('input', { class: 'input', type: f.type || 'text', value: existing ? existing[f.name] : '' });
      }
      inputs[f.name] = inp;
      form.appendChild(h('div', { class: 'field' }, h('label', null, f.label), inp));
    });

    modal({
      title: (existing ? 'Edit ' : 'New ') + 'Account',
      content: form,
      actions: [
        { label: 'Cancel', onClick: c => c() },
        { label: 'Save', primary: true, onClick: async c => {
          const data = existing ? { ...existing } : {};
          fields.forEach(f => data[f.name] = inputs[f.name].value);
          await ERP.db.put('coa', data);
          c(); ERP.router(); toast('Account Saved');
        }}
      ]
    });
  };

  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  render().then(tbl => host.querySelector('.card-body').appendChild(tbl));

  return page('Chart of Accounts', 'General Ledger Master', [h('button', { class: 'btn btn-primary', onclick: () => openForm() }, '+ New Account')], host);
};

/* =====================================================================
   2. ADVANCED ITEMS MATRIX
===================================================================== */
ERP.screens.items = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const rows = await ERP.db.all('items');
    const tbl = table({ columns: [
      { label:'Article / SKU', key:'code', class:'mono' },
      { label:'Item Name', key:'name' },
      { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v==='fg'?'ok':v==='main'?'warn':'brand')}, v.toUpperCase()) },
      { label:'Color', key:'color' },
      { label:'Size', key:'size' },
      { label:'Last Job Cost', key:'cost', render:v => v ? money(v) : h('span',{style:{color:'var(--muted)'}}, 'Pending') },
      { label:'', render:r => r.isParent ? h('span',{class:'hint'},'Matrix Parent') : h('button', {class:'btn btn-sm', onclick:() => openForm(r)}, 'Edit') }
    ], rows: rows.sort((a,b)=>a.name.localeCompare(b.name)), empty: 'No items found.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = (existing) => {
    if(existing && existing.isParent) return toast('Cannot edit parent directly. Edit variants.', 'warn');
    
    const isEdit = !!existing;
    const base = existing || { type: 'fg' };
    
    const form = h('div');
    const inputs = {};
    
    const fields = [
      { name: 'articleNo', label: 'Article No' },
      { name: 'name', label: 'Base Item Name (e.g., Classic Slipper)' },
      { name: 'type', label: 'Category', type: 'select', options: [
        { value: 'main', label: 'Main Material' }, { value: 'accessory', label: 'Accessory' }, { value: 'fg', label: 'Finished Good' }
      ]}
    ];

    fields.forEach(f => {
      let inp;
      if (f.type === 'select') {
        inp = h('select', { class: 'select', onchange: e => {
            matrixSection.style.display = e.target.value === 'fg' && !isEdit ? 'block' : 'none';
        }}, ...f.options.map(o => h('option', { value: o.value, selected: base[f.name]===o.value }, o.label)));
      } else {
        inp = h('input', { class: 'input', type: f.type || 'text', value: base[f.name] || '' });
      }
      inputs[f.name] = inp;
      form.appendChild(h('div', { class: 'field' }, h('label', null, f.label), inp));
    });

    const matrixSection = h('div', { style: { display: base.type === 'fg' && !isEdit ? 'block' : 'none', marginTop: '16px', padding: '16px', background: 'var(--surface2)', borderRadius: '8px' } });
    const hasMatrixCb = h('input', { type: 'checkbox', checked: true });
    matrixSection.appendChild(h('label', { class: 'check', style: { marginBottom: '12px', fontWeight: 'bold' } }, hasMatrixCb, ' Generate Color / Size Variants'));

    const colorsIn = h('input', { class: 'input', placeholder: 'e.g., Black, Brown, Navy' });
    const sizesIn = h('input', { class: 'input', placeholder: 'e.g., 6, 7, 8, 9, 10' });
    
    matrixSection.appendChild(h('div', { class: 'grid g2', style: { marginBottom: '16px' } },
      h('div', { class: 'field' }, h('label', null, 'Colors (comma separated)'), colorsIn),
      h('div', { class: 'field' }, h('label', null, 'Sizes (comma separated)'), sizesIn)
    ));

    const matrixBtn = h('button', { class: 'btn btn-primary btn-sm', onclick: () => generateMatrix() }, 'Preview Matrix');
    const matrixHost = h('div', { style: { marginTop: '16px' } });
    matrixSection.appendChild(matrixBtn);
    matrixSection.appendChild(matrixHost);
    form.appendChild(matrixSection);

    let generatedVariants = [];

    function generateMatrix() {
      matrixHost.innerHTML = '';
      const colors = colorsIn.value.split(',').map(s=>s.trim()).filter(Boolean);
      const sizes = sizesIn.value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!colors.length || !sizes.length) return toast('Enter colors and sizes', 'err');

      const art = inputs['articleNo'].value || 'ART';
      const tbl = h('table', { class: 'tbl' });
      tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Color'), h('th',null,'Size'), h('th',null,'SKU / Barcode'))));
      const tb = h('tbody');
      
      generatedVariants = [];
      colors.forEach(color => {
        sizes.forEach(size => {
          const sku = `${art}-${color.slice(0,3).toUpperCase()}-${size}`.replace(/\s+/g, '');
          generatedVariants.push({ color, size, sku });
          tb.appendChild(h('tr', null, h('td',null,color), h('td',null,size), h('td',{class:'mono'},sku)));
        });
      });
      tbl.appendChild(tb);
      matrixHost.appendChild(tbl);
    }

    modal({
      title: isEdit ? 'Edit Item' : 'Create New Item',
      content: form,
      actions: [
        { label: 'Cancel', onClick: c => c() },
        { label: 'Save', primary: true, onClick: async c => {
          if(!inputs['name'].value) return toast('Name required', 'err');
          
          if (!isEdit && inputs['type'].value === 'fg' && hasMatrixCb.checked) {
            const parentId = 'item_' + Date.now().toString(36);
            await ERP.db.put('items', { 
              id: parentId, isParent: true, name: inputs['name'].value, 
              articleNo: inputs['articleNo'].value, type: 'fg', hasMatrix: true 
            });
            if(!generatedVariants.length) return toast('Click Preview Matrix first', 'err');
            
            for(const v of generatedVariants) {
              await ERP.db.put('items', {
                name: `${inputs['name'].value} - ${v.color} - ${v.size}`,
                articleNo: inputs['articleNo'].value,
                code: v.sku, barcode: v.sku,
                color: v.color, size: v.size,
                type: 'fg', cost: 0, parentId: parentId
              });
            }
            toast('Matrix Generated & Saved', 'ok');
          } else {
            const data = existing ? { ...existing } : {};
            fields.forEach(f => data[f.name] = inputs[f.name].value);
            if(!existing) data.cost = 0;
            await ERP.db.put('items', data);
            toast('Item Saved', 'ok');
          }
          c(); render();
        }}
      ]
    });
  };

  render();
  return page('Items Master', 'Products & Materials', [h('button', { class: 'btn btn-primary', onclick: () => openForm() }, '+ New Item')], host);
};

/* =====================================================================
   4. PDC & CHEQUE MANAGEMENT ENGINE
===================================================================== */
ERP.screens.pdc = function() {
  let activeTab = 'received';
  const host = h('div');

  const renderTabs = () => {
    const tabs = h('div', {class:'tabs'},
      h('button', {class:'tab ' + (activeTab==='received'?'active':''), onclick:()=>{activeTab='received'; renderTabs();}}, 'PDC Received (In)'),
      h('button', {class:'tab ' + (activeTab==='issued'?'active':''), onclick:()=>{activeTab='issued'; renderTabs();}}, 'PDC Issued (Out)')
    );
    return tabs;
  };

  const renderBody = async () => {
    const bodyHost = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
    
    if (activeTab === 'received') {
      const rows = await ERP.db.all('pdc_received');
      const tbl = table({ columns: [
        { label:'Date Recv', key:'dateReceived', render:v => fmtDate(v) },
        { label:'Cheque Date', key:'chequeDate', render:v => h('b',null,fmtDate(v)) },
        { label:'Customer', key:'partyId', render:v => ERP.db.get('parties', v)?.name },
        { label:'Bank', key:'bankName' },
        { label:'Chq No', key:'chequeNo', class:'mono' },
        { label:'Amount', key:'amount', align:'right', render:v => money(v) },
        { label:'Status', key:'status', render:v => h('span',{class:'badge ' + (v==='pending'?'warn':v==='cleared'?'ok':v==='endorsed'?'brand':'danger')}, v.toUpperCase()) },
        { label:'', render:r => r.status === 'pending' ? h('div', {style:{display:'flex', gap:'4px'}},
            h('button', {class:'btn btn-sm btn-primary', onclick:()=>clearPDC(r)}, 'Clear'),
            h('button', {class:'btn btn-sm', onclick:()=>endorsePDC(r)}, 'Endorse'),
            h('button', {class:'btn btn-sm btn-danger', onclick:()=>bouncePDC(r)}, 'Bounce')
          ) : null }
      ], rows: rows.sort((a,b)=>b.dateReceived.localeCompare(a.dateReceived)), empty: 'No PDCs received.' });
      bodyHost.querySelector('.card-body').appendChild(tbl);
    } else {
      const rows = await ERP.db.all('pdc_issued');
      const tbl = table({ columns: [
        { label:'Date Issued', key:'dateIssued', render:v => fmtDate(v) },
        { label:'Cheque Date', key:'chequeDate', render:v => h('b',null,fmtDate(v)) },
        { label:'Supplier', key:'partyId', render:v => ERP.db.get('parties', v)?.name },
        { label:'Bank', key:'bankName' },
        { label:'Chq No', key:'chequeNo', class:'mono' },
        { label:'Amount', key:'amount', align:'right', render:v => money(v) },
        { label:'Status', key:'status', render:v => h('span',{class:'badge ' + (v==='pending'?'warn':v==='cleared'?'ok':'danger')}, v.toUpperCase()) },
        { label:'', render:r => r.status === 'pending' ? h('div', {style:{display:'flex', gap:'4px'}},
            h('button', {class:'btn btn-sm btn-primary', onclick:()=>clearIssued(r)}, 'Clear'),
            h('button', {class:'btn btn-sm btn-danger', onclick:()=>bounceIssued(r)}, 'Bounce')
          ) : null }
      ], rows: rows.sort((a,b)=>b.dateIssued.localeCompare(a.dateIssued)), empty: 'No PDCs issued.' });
      bodyHost.querySelector('.card-body').appendChild(tbl);
    }
    host.innerHTML = '';
    host.appendChild(renderTabs());
    host.appendChild(bodyHost);
  };

  const openForm = () => {
    const isRecv = activeTab === 'received';
    const parties = ERP.db.all('parties'); // Assume loaded synchronously for form rendering for now
    
    const partySel = h('select', {class:'select'}, h('option',{value:''},'— Select Party —'), ...parties.map(p => h('option',{value:p.id}, p.name)));
    const dateRecv = h('input', {class:'input', type:'date', value:date()});
    const chqDate = h('input', {class:'input', type:'date', value:date()});
    const chqNo = h('input', {class:'input', placeholder:'Cheque Number'});
    const bank = h('input', {class:'input', placeholder:'Bank Name'});
    const amtIn = h('input', {class:'input', type:'number', placeholder:'Amount'});

    modal({
      title: 'Record PDC ' + (isRecv ? 'Received' : 'Issued'), size:'md',
      content: h('div', null,
        h('div', {class:'grid g2'},
          h('div', {class:'field'}, h('label',null, isRecv ? 'Customer' : 'Supplier'), partySel),
          h('div', {class:'field'}, h('label',null, isRecv ? 'Date Received' : 'Date Issued'), dateRecv)
        ),
        h('div', {class:'grid g2'},
          h('div', {class:'field'}, h('label',null,'Cheque Date'), chqDate),
          h('div', {class:'field'}, h('label',null,'Cheque Number'), chqNo)
        ),
        h('div', {class:'grid g2'},
          h('div', {class:'field'}, h('label',null,'Bank Name'), bank),
          h('div', {class:'field'}, h('label',null,'Amount'), amtIn)
        )
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Save', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          if(!partySel.value || !amt) return toast('Select party and amount', 'err');
          
          const col = isRecv ? 'pdc_received' : 'pdc_issued';
          await ERP.db.put(col, {
            dateReceived: isRecv ? dateRecv.value : null,
            dateIssued: !isRecv ? dateRecv.value : null,
            chequeDate: chqDate.value,
            partyId: partySel.value,
            chequeNo: chqNo.value,
            bankName: bank.value,
            amount: amt,
            status: 'pending'
          });
          c(); renderBody(); toast('PDC Recorded');
        }}
      ]
    });
  };

  // PDC Actions
  const clearPDC = async (pdc) => {
    // Dr Bank / Cr AR
    await ERP.db.put('journalEntries', {
      date: date(), narration: 'PDC Cleared - ' + pdc.chequeNo, source: 'PDC',
      lines: [
        { accountCode: '1010', accountName: 'Bank Account', debit: pdc.amount, credit: 0 },
        { accountCode: '1100', accountName: 'Accounts Receivable', debit: 0, credit: pdc.amount }
      ]
    });
    await ERP.db.put('pdc_received', { ...pdc, status: 'cleared' });
    renderBody(); toast('PDC Cleared & Ledger Updated');
  };

  const bouncePDC = async (pdc) => {
    // Dr AR / Cr AR (No net change, but keep record) - or just mark bounced. 
    // For simplicity, just mark bounced so it's no longer considered.
    await ERP.db.put('pdc_received', { ...pdc, status: 'bounced' });
    renderBody(); toast('PDC Bounced');
  };

  const endorsePDC = async (pdc) => {
    const suppliers = ERP.db.all('parties').filter(p => p.type === 'supplier' || p.type === 'both');
    const supSel = h('select', {class:'select'}, h('option',{value:''},'— Select Supplier —'), ...suppliers.map(p => h('option',{value:p.id}, p.name)));

    modal({
      title: 'Endorse Cheque to Supplier', size:'sm',
      content: h('div', null,
        h('p', {style:{marginBottom:'16px'}}, `Endorse Cheque ${pdc.chequeNo} (${money(pdc.amount)}) to a supplier.`),
        h('div', {class:'field'}, h('label',null,'Supplier'), supSel)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Endorse', primary:true, onClick: async c=>{
          if(!supSel.value) return toast('Select supplier', 'err');
          
          // 1. Mark received as endorsed
          await ERP.db.put('pdc_received', { ...pdc, status: 'endorsed' });
          
          // 2. Create issued record
          await ERP.db.put('pdc_issued', {
            dateIssued: date(),
            chequeDate: pdc.chequeDate,
            partyId: supSel.value,
            chequeNo: pdc.chequeNo,
            bankName: pdc.bankName,
            amount: pdc.amount,
            status: 'pending',
            endorsedFrom: pdc.id
          });

          // 3. Ledger Post (Dr AP / Cr AR)
          await ERP.db.put('journalEntries', {
            date: date(), narration: 'Endorsed Chq ' + pdc.chequeNo, source: 'PDC',
            lines: [
              { accountCode: '2000', accountName: 'Accounts Payable', debit: pdc.amount, credit: 0 },
              { accountCode: '1100', accountName: 'Accounts Receivable', debit: 0, credit: pdc.amount }
            ]
          });

          c(); renderBody(); toast('Cheque Endorsed successfully');
        }}
      ]
    });
  };

  const clearIssued = async (pdc) => {
    // Dr AP / Cr Bank
    await ERP.db.put('journalEntries', {
      date: date(), narration: 'Issued PDC Cleared - ' + pdc.chequeNo, source: 'PDC',
      lines: [
        { accountCode: '2000', accountName: 'Accounts Payable', debit: pdc.amount, credit: 0 },
        { accountCode: '1010', accountName: 'Bank Account', debit: 0, credit: pdc.amount }
      ]
    });
    await ERP.db.put('pdc_issued', { ...pdc, status: 'cleared' });
    renderBody(); toast('Issued PDC Cleared');
  };

  const bounceIssued = async (pdc) => {
    await ERP.db.put('pdc_issued', { ...pdc, status: 'bounced' });
    renderBody(); toast('Issued PDC Bounced');
  };

  renderBody();
  return page('PDC & Cheque Register', 'Manage Post-Dated Cheques', [h('button', {class:'btn btn-primary', onclick: openForm}, '+ New PDC')], host);
};

/* =====================================================================
   5. ROUTER UPDATE
===================================================================== */
const renderRouterP2 = async function() {
  const path = location.hash.replace('#/', '') || 'home';
  const view = document.getElementById('view');
  view.innerHTML = '';
  
  if(ERP.screens[path.replace(/\//g, '_')]) {
    view.appendChild(await ERP.screens[path.replace(/\//g, '_')]());
  } else {
    // If not mapped via underscore, fallback to manual mapping
    const map = {
      'home': ERP.screens.dashboard,
      'masters/coa': ERP.screens.coa,
      'masters/items': ERP.screens.items,
      'masters/parties': ERP.screens.parties,
      'banking/pdc': ERP.screens.pdc
    };
    if (map[path]) {
      view.appendChild(await map[path]());
      document.getElementById('tbTitle').textContent = document.querySelector(`.sb-item[onclick*="${path}"]`)?.textContent || 'Dashboard';
    } else {
      view.appendChild(ERP.ui.page('Under Construction', 'Coming in next parts.', [], ERP.ui.h('div', { class: 'card card-body' }, 'Please wait.')));
    }
  }
  ERP.layout.buildNav();
};

window.removeEventListener('hashchange', ERP.router);
ERP.router = renderRouterP2;

<!-- =====================================================================
     PART 3 — MASSIVE JOB COSTING & PRODUCTION ENGINE
===================================================================== -->
<script>
(function(){
'use strict';
const ERP = window.ERP;
if (!ERP) return;
const {h, toast, modal, table, page} = ERP.ui;
const {money, date, fmtDate} = ERP.util;

/* =====================================================================
   1. JOB MASTER (ORDERS)
===================================================================== */
ERP.screens.jobs = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const jobs = await ERP.db.all('jobs');
    const tbl = table({ columns: [
      { label:'Job #', key:'number', class:'mono' },
      { label:'Customer', key:'customerId', render:v => v ? 'Customer Loaded' : 'Internal Stock' },
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Articles', key:'lines', render:v => v.map(l => `${l.itemName} (${l.qty} prs)`).join(', ') },
      { label:'Status', key:'status', render:v => h('span',{class:'badge ' + (v==='completed'?'ok':'warn')}, v.toUpperCase()) },
      { label:'', render:r => h('div', {style:{display:'flex', gap:'4px'}},
        h('button', {class:'btn btn-sm btn-primary', onclick:() => viewCostSheet(r)}, 'Cost Sheet'),
        r.status !== 'completed' ? h('button', {class:'btn btn-sm', onclick:() => releaseGoods(r)}, 'Release') : null
      )}
    ], rows: jobs.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No Jobs created yet.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = async () => {
    const customers = await ERP.db.all('parties');
    const fgItems = (await ERP.db.all('items')).filter(i => i.type === 'fg' && !i.isParent);
    
    if(!fgItems.length) return toast('Create Finished Goods first', 'err');

    const custSel = h('select', {class:'select'}, h('option',{value:''},'— Select Customer (Optional) —'), ...customers.map(c => h('option',{value:c.id}, c.name)));
    const state = { lines: [] };
    const grid = h('div');

    const renderLines = () => {
      grid.innerHTML = '';
      const tbl = h('table', {class:'tbl'});
      tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Article / Product'), h('th',{width:'150px'},'Target Qty (Pairs)'), h('th',{width:'40px'},''))));
      const tb = h('tbody');
      
      state.lines.forEach((l, i) => {
        const sel = h('select', {class:'select', onchange:e=>{l.itemId=e.target.value; l.itemName=fgItems.find(x=>x.id===e.target.value)?.name;}}, h('option',{value:''},'— Select Article —'), ...fgItems.map(it=>h('option',{value:it.id, selected:l.itemId===it.id}, it.name)));
        const qty = h('input', {class:'input', type:'number', value:l.qty||'', oninput:e=>l.qty=Number(e.target.value)});
        tb.appendChild(h('tr', null, h('td',null,sel), h('td',null,qty), h('td',null, h('button',{class:'btn btn-sm', onclick:()=>{state.lines.splice(i,1);renderLines();}},'×'))));
      });
      tbl.appendChild(tb);
      grid.appendChild(tbl);
      grid.appendChild(h('button', {class:'btn btn-sm', style:{marginTop:'8px'}, onclick:()=>{state.lines.push({itemId:'',qty:0});renderLines();}}, '+ Add Article to Job'));
    };
    renderLines();

    modal({
      title: 'Create New Job (Production Order)', size: 'lg',
      content: h('div', null,
        h('div', {class:'field'}, h('label', null, 'Customer'), custSel),
        h('div', {style:{marginTop:'16px'}}, h('label', {style:{fontWeight:'bold'}}, 'Products for this Job'), grid)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Create Job', primary:true, onClick: async c=>{
          const validLines = state.lines.filter(l => l.itemId && l.qty > 0);
          if(!validLines.length) return toast('Select at least one article and quantity', 'err');
          
          await ERP.db.put('jobs', { 
            number:'JOB-'+Date.now().toString().slice(-4), 
            customerId: custSel.value || null,
            date: date(),
            lines: validLines,
            status:'in_progress'
          });
          c(); render(); toast('Job Created');
        }}
      ]
    });
  };

  render();
  return page('Job Costing', 'Manage Factory Orders & Production', [h('button',{class:'btn btn-primary',onclick:openForm},'+ New Job')], host);
};

/* =====================================================================
   2. FACTORY VOUCHERS (EXPENSES & ALLOCATION)
===================================================================== */
ERP.screens.vouchers = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const vouchers = await ERP.db.all('vouchers');
    const tbl = table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v==='material'?'warn':v==='wages'?'ok':v==='wastage'?'danger':'brand')}, v.toUpperCase()) },
      { label:'Description', key:'description' },
      { label:'Allocation', key:'allocations', render:v => v.length ? v.map(a => `Job (${money(a.amount)})`).join(', ') : 'General Overhead' },
      { label:'Total Amount', key:'totalAmount', align:'right', render:v => money(v) }
    ], rows: vouchers.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No transactions recorded yet.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = async () => {
    const activeJobs = (await ERP.db.all('jobs')).filter(j => j.status === 'in_progress');
    
    const typeSel = h('select', {class:'select', onchange: e => toggleFields(e.target.value)}, 
      h('option',{value:'expense'},'Factory Expense'),
      h('option',{value:'wages'},'Labour Wages'),
      h('option',{value:'material'},'Issue Raw Materials'),
      h('option',{value:'wastage'},'Record Wastage / Damage')
    );
    
    const descIn = h('input', {class:'input', placeholder:'Voucher # / Description'});
    const amtIn = h('input', {class:'input', type:'number', placeholder:'Total Amount'});
    
    const matBlock = h('div', {style:{display:'none', padding:'12px', background:'var(--surface2)', marginBottom:'16px'}});
    const rmItems = (await ERP.db.all('items')).filter(i => i.type === 'main' || i.type === 'accessory');
    const matSel = h('select', {class:'select'}, ...rmItems.map(i => h('option',{value:i.id}, i.name)));
    const matQty = h('input', {class:'input', type:'number', placeholder:'Qty'});
    matBlock.appendChild(h('div', {class:'grid g2'}, 
      h('div', {class:'field'}, h('label',null,'Raw Material'), matSel),
      h('div', {class:'field'}, h('label',null,'Quantity'), matQty)
    ));

    const wasteBlock = h('div', {style:{display:'none', padding:'12px', background:'var(--surface2)', marginBottom:'16px'}});
    const wasteAddToJob = h('select', {class:'select'}, 
      h('option',{value:'yes'},'Yes, inflate Job Cost'), 
      h('option',{value:'no'},'No, post as general Factory Loss')
    );
    wasteBlock.appendChild(h('div', {class:'field'}, h('label',null,'Include this loss in Product Cost?'), wasteAddToJob));

    const allocBlock = h('div', {style:{marginTop:'16px', borderTop:'1px solid var(--line)', paddingTop:'16px'}});
    const allocMode = h('select', {class:'select', onchange: e => renderAlloc(e.target.value)},
      h('option',{value:'none'},'Global (No Job Allocation)'),
      h('option',{value:'single'},'Allocate to ONE Job'),
      h('option',{value:'split'},'SPLIT across Multiple Jobs (%)')
    );
    const allocHost = h('div', {style:{marginTop:'12px'}});
    let allocations = []; 

    const renderAlloc = (mode) => {
      allocHost.innerHTML = '';
      allocations = [];
      if (mode === 'none' || !activeJobs.length) return;

      if (mode === 'single') {
        const sel = h('select', {class:'select'});
        activeJobs.forEach(j => sel.appendChild(h('option',{value:j.id}, j.number)));
        sel.onchange = e => allocations = [{ jobId: e.target.value, percent: 100 }];
        allocHost.appendChild(h('div', {class:'field'}, h('label',null,'Select Job'), sel));
        if(activeJobs.length) allocations = [{ jobId: activeJobs[0].id, percent: 100 }];
      }

      if (mode === 'split') {
        const grid = h('div', {class:'grid g2'});
        activeJobs.forEach(j => {
          const pct = h('input', {class:'input', type:'number', placeholder:'%', onchange: e => {
            const existing = allocations.find(a => a.jobId === j.id);
            if (existing) existing.percent = Number(e.target.value);
            else allocations.push({ jobId: j.id, percent: Number(e.target.value) });
          }});
          grid.appendChild(h('div', {class:'field'}, h('label',null,j.number), pct));
        });
        allocHost.appendChild(grid);
      }
    };
    renderAlloc('none');

    const toggleFields = (type) => {
      matBlock.style.display = type === 'material' ? 'block' : 'none';
      wasteBlock.style.display = type === 'wastage' ? 'block' : 'none';
      if(type === 'material') amtIn.readOnly = true;
      else amtIn.readOnly = false;
    };

    const calcMat = () => {
      const itm = rmItems.find(x=>x.id === matSel.value);
      if(itm) amtIn.value = (itm.cost || 0) * Number(matQty.value || 0);
    };
    matSel.onchange = calcMat;
    matQty.oninput = calcMat;

    modal({
      title: 'Record Factory Voucher', size: 'md',
      content: h('div', null,
        h('div', {class:'grid g2'}, 
          h('div', {class:'field'}, h('label', null, 'Voucher Type'), typeSel),
          h('div', {class:'field'}, h('label', null, 'Date'), h('input', {class:'input', type:'date', value:date()}))
        ),
        h('div', {class:'field'}, h('label', null, 'Description'), descIn),
        h('div', {class:'field'}, h('label', null, 'Total Amount'), amtIn),
        matBlock, wasteBlock,
        h('div', {class:'field'}, h('label', null, 'Job Allocation Strategy'), allocMode),
        allocHost
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Voucher', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          const type = typeSel.value;
          if(!amt) return toast('Enter amount', 'err');
          
          let finalAllocs = allocations.map(a => ({ jobId: a.jobId, amount: (amt * a.percent) / 100 }));
          if (allocMode.value === 'none') finalAllocs = [];

          // 1. Post GL
          if (type === 'material') {
            await ERP.db.put('journalEntries', { date:date(), narration: 'Material Issue', source:'Voucher', lines:[ {code:'1220', debit:amt, credit:0}, {code:'1200', debit:0, credit:amt} ]});
          } else if (type === 'wages') {
            await ERP.db.put('journalEntries', { date:date(), narration: descIn.value, source:'Voucher', lines:[ {code:'5020', debit:amt, credit:0}, {code:'1000', debit:0, credit:amt} ]});
          } else if (type === 'expense') {
            await ERP.db.put('journalEntries', { date:date(), narration: descIn.value, source:'Voucher', lines:[ {code:'5030', debit:amt, credit:0}, {code:'1000', debit:0, credit:amt} ]});
          } else if (type === 'wastage') {
            const addToJob = wasteAddToJob.value === 'yes';
            const debitAcct = addToJob ? '1220' : '5040';
            await ERP.db.put('journalEntries', { date:date(), narration: 'Wastage: ' + descIn.value, source:'Voucher', lines:[ {code:debitAcct, debit:amt, credit:0}, {code:'1200', debit:0, credit:amt} ]});
          }

          await ERP.db.put('vouchers', { date:date(), type, totalAmount:amt, description:descIn.value, allocations:finalAllocs });
          c(); render(); toast('Voucher Posted');
        }}
      ]
    });
  };

  render();
  return page('Factory Vouchers', 'Record Expenses, Wages & Materials', [h('button',{class:'btn btn-primary',onclick:openForm},'+ New Voucher')], host);
};

/* =====================================================================
   3. COST SHEET & PRODUCTION RELEASE
===================================================================== */
async function viewCostSheet(job) {
  const vouchers = await ERP.db.all('vouchers');
  const jobCosts = vouchers.filter(v => v.allocations.some(a => a.jobId === job.id)).map(v => {
    const alloc = v.allocations.find(a => a.jobId === job.id);
    return { date: v.date, type: v.type, amount: alloc.amount, desc: v.description };
  });

  let totalCost = 0;
  jobCosts.forEach(c => totalCost += c.amount);

  const content = h('div', null,
    table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v==='material'?'warn':v==='wages'?'ok':'brand')}, v.toUpperCase()) },
      { label:'Description', key:'desc' },
      { label:'Cost to Job', key:'amount', align:'right', render:v => money(v) }
    ], rows: jobCosts, empty: 'No costs recorded for this job.' }),
    h('div', {style:{marginTop:'20px', padding:'16px', background:'var(--brandsoft)', borderRadius:'8px', display:'flex', justifyContent:'space-between', fontSize:'18px', fontWeight:'800', color:'var(--brand)'}},
      h('span', null, 'Total WIP Cost: ' + money(totalCost)),
      h('span', null, 'Target Pairs: ' + job.lines.reduce((a,l)=>a+l.qty,0))
    )
  );

  modal({ title:'Cost Sheet - ' + job.number, size:'lg', content, actions:[{label:'Close', primary:true}] });
}

async function releaseGoods(job) {
  const grid = h('div');
  const qtyState = {}; 
  
  const renderRelease = () => {
    grid.innerHTML = '';
    const tbl = h('table', {class:'tbl'});
    tbl.appendChild(h('thead', null, h('tr', null, h('th',null,'Article'), h('th',null,'Target Qty'), h('th',{width:'150px'},'Produced Qty'))));
    const tb = h('tbody');
    
    job.lines.forEach(l => {
      qtyState[l.itemId] = qtyState[l.itemId] !== undefined ? qtyState[l.itemId] : l.qty;
      const qty = h('input', {class:'input', type:'number', value:qtyState[l.itemId], oninput:e=>qtyState[l.itemId]=Number(e.target.value)});
      tb.appendChild(h('tr', null, h('td',null, l.itemName), h('td',null, l.qty), h('td',null, qty)));
    });
    tbl.appendChild(tb);
    grid.appendChild(tbl);
  };
  renderRelease();

  modal({
    title: 'Release Goods to FG Store', size: 'md',
    content: h('div', null,
      h('p', {style:{marginBottom:'16px'}}, 'Calculate final cost per pair and move stock to Finished Goods.'),
      grid
    ),
    actions: [
      { label:'Cancel', onClick:c=>c() },
      { label:'Release & Close', primary:true, onClick: async c=>{
        const vouchers = await ERP.db.all('vouchers');
        const jobCosts = vouchers.filter(v => v.allocations.some(a => a.jobId === job.id)).map(v => v.allocations.find(a => a.jobId === job.id).amount);
        const totalJobCost = jobCosts.reduce((a,b)=>a+b, 0);
        
        const totalProducedPairs = Object.values(qtyState).reduce((a,b)=>a+b, 0);
        if(totalProducedPairs === 0) return toast('Enter produced quantities', 'err');

        let totalReleasedValue = 0;

        for (const line of job.lines) {
          const qty = qtyState[line.itemId];
          if(!qty) continue;

          const costPerPair = totalJobCost / totalProducedPairs;
          const lineTotalCost = costPerPair * qty;
          totalReleasedValue += lineTotalCost;

          await ERP.db.put('stockMoves', { date:date(), itemId:line.itemId, warehouseId:'wh_wip', qty:-qty, rate:costPerPair, refType:'Release', refId:job.id });
          await ERP.db.put('stockMoves', { date:date(), itemId:line.itemId, warehouseId:'wh_fg', qty:qty, rate:costPerPair, refType:'Release', refId:job.id });

          const itm = await ERP.db.get('items', line.itemId);
          if(itm) await ERP.db.put('items', { ...itm, cost: costPerPair });
        }

        if(totalReleasedValue > 0) {
          await ERP.db.put('journalEntries', { date:date(), narration:'FG Release ' + job.number, source:'Job', lines:[
            { code:'1230', debit:totalReleasedValue, credit:0 }, { code:'1220', debit:0, credit:totalReleasedValue }
          ]});
        }

        await ERP.db.put('jobs', { ...job, status:'completed' });
        c(); ERP.router(); toast('Goods Released & Cost Saved');
      }}
    ]
  });
}

const renderRouterP3 = async function() {
  const path = location.hash.replace('#/', '') || 'home';
  const view = document.getElementById('view');
  view.innerHTML = '';
  
  const map = {
    'home': ERP.screens.dashboard,
    'masters/coa': ERP.screens.coa,
    'masters/items': ERP.screens.items,
    'masters/parties': ERP.screens.parties,
    'banking/pdc': ERP.screens.pdc,
    'jobs': ERP.screens.jobs,
    'vouchers': ERP.screens.vouchers
  };

  if (map[path]) {
    view.appendChild(await map[path]());
    document.getElementById('tbTitle').textContent = document.querySelector(`.sb-item[onclick*="${path}"]`)?.textContent || 'Dashboard';
  } else {
    view.appendChild(ERP.ui.page('Under Construction', 'Coming next...', [], ERP.ui.h('div', { class: 'card card-body' }, 'Please wait.')));
  }
  ERP.layout.buildNav();
};

window.removeEventListener('hashchange', ERP.router);
ERP.router = renderRouterP3;
window.addEventListener('hashchange', ERP.router);
ERP.router();
toast('Part 3: Massive Job Costing Loaded', 'ok');

})();
</script>

<script>
(function(){
'use strict';
const ERP = window.ERP;
if (!ERP) return;

      ]},
      { name: 'rate', label: 'Base Rate / Salary', type: 'number' },
      { name: 'otRate', label: 'OT Multiplier (e.g. 1.5)', type: 'number', value: 1.5 },
      { name: 'epfNo', label: 'EPF Number' },

    ];

    fields.forEach(f => {
      let inp;
      if (f.type === 'select') {
        inp = h('select', { class: 'select' }, ...f.options.map(o => h('option', { value: o.value, selected: existing && existing[f.name]===o.value }, o.label)));
      } else {
        inp = h('input', { class: 'input', type: f.type || 'text', value: existing && existing[f.name] !== undefined ? existing[f.name] : (f.value || '') });
      }
      inputs[f.name] = inp;
      form.appendChild(h('div', { class: 'field' }, h('label', null, f.label), inp));
    });

    modal({
      title: (existing ? 'Edit ' : 'New ') + 'Employee',
      content: form,
      actions: [
        { label: 'Cancel', onClick: c => c() },
        { label: 'Save', primary: true, onClick: async c => {
          const data = existing ? { ...existing } : {};
          fields.forEach(f => data[f.name] = inputs[f.name].value);
          await ERP.db.put('employees', data);
          c(); render(); toast('Employee Saved');
        }}
      ]
    });
  };

  render();
  return page('Employees', 'Factory Staff & Statutory Data', [h('button', { class: 'btn btn-primary', onclick: () => openForm() }, '+ New Employee')], host);
};

/* =====================================================================
   2. PAYROLL INPUTS (DAILY/WEEKLY DATA)
===================================================================== */
ERP.screens.payrollInputs = function() {

  const render = async () => {
    const inputs = await ERP.db.all('payrollInputs');
    const tbl = table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },

    modal({

        h('div', {class:'grid g3'},
          h('div', {class:'field'}, h('label',null,'Days'), daysIn),
          h('div', {class:'field'}, h('label',null,'Pieces'), piecesIn),
          h('div', {class:'field'}, h('label',null,'OT Hrs'), otIn)
        )
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Save', primary:true, onClick: async c=>{

/* =====================================================================
   3. MASSIVE WAGE RUN ENGINE
===================================================================== */
ERP.screens.wageRuns = function() {
  const host = h('div', {class:'card'}, h('div', {class:'card-body p0'}));
  
  const render = async () => {
    const runs = await ERP.db.all('wageRuns');
    const tbl = table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Total Gross', key:'totalGross', align:'right', render:v => money(v) },
      { label:'EPF (Emp)', key:'epfEmp', align:'right', render:v => money(v) },
      { label:'Net Paid', key:'totalNet', align:'right', render:v => money(v) },
      { label:'', render:r => h('button', {class:'btn btn-sm', onclick:()=>{
        modal({ title:'Wage Run Details', content: table({
          columns: [
            { label:'Employee', key:'empName' },
            { label:'Gross', key:'gross', align:'right', render:v => money(v) },
            { label:'EPF', key:'epf', align:'right', render:v => money(v) },
            { label:'Net', key:'net', align:'right', render:v => money(v) }
          ], rows: r.lines
        }), actions:[{label:'Close', primary:true}]});
      }}, 'View') }
    ], rows: runs.sort((a,b)=>b.createdAt - a.createdAt), empty: 'No wage runs processed yet.' });
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').appendChild(tbl);
  };

  const openForm = async () => {
    const inputs = await ERP.db.all('payrollInputs');
    if(!inputs.length) return toast('Enter payroll inputs first', 'err');

    const empTotals = {};
    inputs.forEach(i => {
      if(!empTotals[i.empId]) empTotals[i.empId] = { days: 0, pieces: 0, ot: 0 };
      empTotals[i.empId].days += i.days;
      empTotals[i.empId].pieces += i.pieces;
      empTotals[i.empId].ot += i.ot;
    });

    const lines = [];
    let totalGross = 0, totalEpfEmp = 0, totalEpfCo = 0, totalEtf = 0, totalNet = 0;

    for(const empId in empTotals) {
      const emp = await ERP.db.get('employees', empId);
      if(!emp) continue;
      const t = empTotals[empId];
      
      let basic = 0;
      if(emp.wageType === 'monthly') basic = (emp.rate / 30) * t.days; 
      else if(emp.wageType === 'daily') basic = emp.rate * t.days;
      else if(emp.wageType === 'piece') basic = emp.rate * t.pieces;

      const hourly = (basic / 8) || 0; // 8hr shift
      const otPay = t.ot * hourly * (emp.otRate || 1.5);
      
      const gross = basic + otPay;
      const epfEmp = gross * 0.08; // 8%
      const epfCo = gross * 0.12;  // 12%
      const etf = gross * 0.03;    // 3%
      const net = gross - epfEmp;

      totalGross += gross; totalEpfEmp += epfEmp; totalEpfCo += epfCo; totalEtf += etf; totalNet += net;

      lines.push({ empId, empName: emp.name, gross, epf: epfEmp, net });
    }

    const activeJobs = (await ERP.db.all('jobs')).filter(j => j.status === 'in_progress');
    const allocHost = h('div');
    let allocations = [];

    const renderAlloc = () => {
      allocHost.innerHTML = '';
      if(!activeJobs.length) return allocHost.appendChild(h('div',{class:'hint'},'No active jobs. Wage will post to Factory Overhead.'));
      
      const grid = h('div', {class:'grid g2'});
      activeJobs.forEach(j => {
        const pct = h('input', {class:'input', type:'number', placeholder:'%', onchange: e => {
          const existing = allocations.find(a => a.jobId === j.id);
          if(existing) existing.percent = Number(e.target.value);
          else allocations.push({ jobId: j.id, percent: Number(e.target.value) });
        }});
        grid.appendChild(h('div', {class:'field'}, h('label',null,j.number), pct));
      });
      allocHost.appendChild(grid);
    };
    renderAlloc();

    modal({
      title: 'Process Wage Run', size: 'lg',
      content: h('div', null,
        h('div', {class:'grid g3', style:{marginBottom:'16px'}},
          h('div', {class:'kpi'}, h('div',{class:'kpi-l'},'Gross Pay'), h('div',{class:'kpi-v'}, money(totalGross))),
          h('div', {class:'kpi'}, h('div',{class:'kpi-l'},'Total EPF (8%+12%)'), h('div',{class:'kpi-v'}, money(totalEpfEmp + totalEpfCo))),
          h('div', {class:'kpi'}, h('div',{class:'kpi-l'},'Net Payable'), h('div',{class:'kpi-v'}, money(totalNet)))
        ),
        table({ columns: [
          { label:'Employee', key:'empName' },
          { label:'Gross', key:'gross', align:'right', render:v=>money(v) },
          { label:'EPF (8%)', key:'epf', align:'right', render:v=>money(v) },
          { label:'Net Pay', key:'net', align:'right', render:v=>money(v) }
        ], rows: lines }),
        h('div', {style:{marginTop:'20px', borderTop:'1px solid var(--line)', paddingTop:'16px'}},
          h('h4', {style:{marginBottom:'12px'}}, 'Allocate Wages to Jobs'),
          allocHost
        )
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Post Wage Run', primary:true, onClick: async c=>{
          
          let totalAllocated = 0;
          const validAllocs = allocations.filter(a => a.percent > 0);
          validAllocs.forEach(a => { a.amount = (totalGross * a.percent) / 100; totalAllocated += a.amount; });
          const overheadAmount = totalGross - totalAllocated;

          const glLines = [];
          if(totalAllocated > 0) glLines.push({ accountCode:'1220', accountName:'WIP', debit: totalAllocated, credit: 0 });
          if(overheadAmount > 0) glLines.push({ accountCode:'5030', accountName:'Overhead', debit: overheadAmount, credit: 0 });
          
          glLines.push({ accountCode:'5020', accountName:'Direct Labour', debit: totalEpfCo + totalEtf, credit: 0 }); // Employer contributions
          glLines.push({ accountCode:'2200', accountName:'EPF Payable', debit: 0, credit: totalEpfEmp + totalEpfCo });
          glLines.push({ accountCode:'2210', accountName:'ETF Payable', debit: 0, credit: totalEtf });
          glLines.push({ accountCode:'1000', accountName:'Cash', debit: 0, credit: totalNet });

          await ERP.db.put('journalEntries', { date:date(), narration: 'Weekly Wage Run', source:'Payroll', lines: glLines });
          await ERP.db.put('wageRuns', { date:date(), totalGross, epfEmp: totalEpfEmp, totalNet, lines, allocations: validAllocs });

          for(const i of inputs) await ERP.db.remove('payrollInputs', i.id);

          c(); render(); toast('Wages Processed and Posted');
        }}
      ]
    });
  };

  render();
  return page('Wage Runs', 'Calculate and allocate weekly wages', [h('button',{class:'btn btn-primary',onclick:openForm},'+ Process Wages')], host);
};

/* =====================================================================
   4. PETTY CASH MANAGER
===================================================================== */
ERP.screens.pettyCash = function() {
  const host = h('div');

  const getBalance = async () => {
    const entries = await ERP.db.all('journalEntries');
    let bal = 0;
    entries.forEach(j => {
      j.lines.forEach(l => {
        if(l.accountName === 'Petty Cash') bal += (l.debit - l.credit);
      });
    });
    return bal;
  };

  const render = async () => {
    const bal = await getBalance();
    const entries = (await ERP.db.all('journalEntries')).filter(j => j.lines.some(l => l.accountName === 'Petty Cash'));
    
    const rows = [];
    entries.forEach(e => {
      const pcLine = e.lines.find(l => l.accountName === 'Petty Cash');
      const other = e.lines.find(l => l.accountName !== 'Petty Cash');
      rows.push({
        date: e.date,
        type: pcLine.debit > 0 ? 'Top Up (IN)' : 'Expense (OUT)',
        desc: other ? other.accountName : e.narration,
        amount: pcLine.debit > 0 ? pcLine.debit : pcLine.credit
      });
    });

    host.innerHTML = '';
    host.appendChild(h('div', {class:'grid g2', style:{marginBottom:'20px'}},
      h('div', {class:'kpi'}, h('div',{class:'kpi-l'},'Petty Cash Balance'), h('div',{class:'kpi-v', style:{color:bal < 0 ? 'var(--danger)' : 'var(--brand)'}}, money(bal)))
    ));
    
    const card = h('div',{class:'card'}, h('div',{class:'card-body p0'}, table({ columns: [
      { label:'Date', key:'date', render:v => fmtDate(v) },
      { label:'Type', key:'type', render:v => h('span',{class:'badge ' + (v.includes('Top')?'ok':'danger')}, v) },
      { label:'Description', key:'desc' },
      { label:'Amount', key:'amount', align:'right', render:v => money(v) }
    ], rows: rows.sort((a,b)=>b.date.localeCompare(a.date)), empty: 'No petty cash transactions.' })));
    
    host.appendChild(card);
  };

  const topUp = () => {
    const amtIn = h('input', {class:'input', type:'number'});
    modal({
      title: 'Top Up Petty Cash', size:'sm',
      content: h('div', null, h('div', {class:'field'}, h('label',null,'Amount'), amtIn)),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Transfer', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          if(!amt) return toast('Enter amount', 'err');
          await ERP.db.put('journalEntries', { date:date(), narration:'Petty Cash Top Up', source:'PettyCash', lines:[
            { accountCode:'1010', accountName:'Petty Cash', debit:amt, credit:0 }, { accountCode:'1000', accountName:'Cash', debit:0, credit:amt }
          ]});
          c(); render(); toast('Petty Cash Topped Up');
        }}
      ]
    });
  };

  const recordExpense = () => {
    const descIn = h('input', {class:'input', placeholder:'e.g., Tea for workers'});
    const amtIn = h('input', {class:'input', type:'number'});
    modal({
      title: 'Record Petty Expense', size:'sm',
      content: h('div', null,
        h('div', {class:'field'}, h('label',null,'Description'), descIn),
        h('div', {class:'field'}, h('label',null,'Amount'), amtIn)
      ),
      actions: [
        { label:'Cancel', onClick: c=>c() },
        { label:'Pay', primary:true, onClick: async c=>{
          const amt = Number(amtIn.value);
          if(!amt || !descIn.value) return toast('Fill all fields', 'err');
          await ERP.db.put('journalEntries', { date:date(), narration:'Petty Expense: ' + descIn.value, source:'PettyCash', lines:[
            { accountCode:'5030', accountName:'Factory Overhead', debit:amt, credit:0, narration: descIn.value },
            { accountCode:'1010', accountName:'Petty Cash', debit:0, credit:amt }
          ]});
          c(); render(); toast('Expense Paid');
        }}
      ]
    });
  };

  render();
  return page('Petty Cash', 'Manage small daily expenses', 
    [h('button',{class:'btn',onclick:topUp},'⬆️ Top Up'), h('button',{class:'btn btn-primary',onclick:recordExpense},'💸 Pay Expense')], 
    host
  );
};
